# ---------------------------------------------------------------------------
# L2 · **罕见病编码条件**(rare):一条 = 一个 ORPHA 病种在 haenv 世界里的 overlay。
#
# 设计见 `docs/design/2026-09-20-rare-gen-full.md` §3.1;拍板见
# `docs/decisions/2026-09-20-rare-coding-合成与评测.md`。装载期校验在本包的 `gen.py`
# (default-deny:未登记字段 / orpha 不在 product1 / gene 不是 HGNC approved 一律拒收)。
#
# 🔴 **六条的临床内容由 haenv 侧起草,未经临床复核**(`clinical_review: pending`,
#     与 `conditions_unified.yaml` 的 HD-UNI 六条同一先例,2026-09-18 / 2026-09-20 定)。
#
# 与 unified 条件的分工:本表**不进** `overlay.condition_registry`(字段域不同);
# ddx 形状的那几个字段(diagnosis/aliases/tests/specialty/urgency)由本包的 `gen.py`
# 抄进 `latent.ddx_*`,于是自带的 ddx 判据照跑;`rare_*` 键另走 `adjudication.rare`。
#
# 字段:
#   case_id            冻结的对外编号(JD-50 起;`case_ids.yaml` 不收本表,编号在此冻结)
#   orpha / gene       编码金标;omim / icd10 由 product1 xref 派生,**不手填**
#   inheritance        AR | AD | XLR | de_novo | none
#   phenotype_policy   HPO 抽样策略(读 phenotype.hpoa 的 ORPHA 行)
#   rivals             鉴别病种的 ORPHA 码 —— 它们的高频表型进 **negated** 池
#   modalities         genome: {skeleton, tier} · imaging: {collection, tier} | none
#   weight             骑在代谢骨架上时体重族(与 unified 同域:down|up|stable, start, end)
#   urgency / red_flag 病种级下限;例级红旗另由下面 `red_flag_hpo` 按抽到的表型推出
#
# red_flag_hpo:先证者本人出现(polarity=present, subject=proband)其中任一术语或其子孙术语
# ⇒ 该例 red_flag=true、urgency=🔴。按术语本身判,不看渲染模板里的「近期 / 自述 / 较明显」。
# 本身是进行性表现的术语(视力丧失、吞咽/延髓肌无力、呼吸功能不全)不列入。🔴 待专业复核。
#
# SYNTHETIC,仅评测用,非医疗建议。
# ---------------------------------------------------------------------------
