[project]
name = "haenv-rare"
version = "0.0.1"
description = "haenv 罕见病编码题:金标块 · 发射门 R1–R10 · 判据 rc_* · 出题与报告命令 —— 仓外插件包,不改 haenv 一行"
requires-python = ">=3.10"
dependencies = ["pydicom", "pysam>=0.22"]

[project.scripts]
haenv-rare-gen = "haenv_rare.gen_job:main"
haenv-rare-html = "haenv_rare.report_html:main"
haenv-rare-paraphrase = "haenv_rare.paraphrase:main"
haenv-rare-verify = "haenv_rare.verify_attachments:main"
haenv-rare-round2 = "haenv_rare.round2:main"
haenv-rare-stats = "haenv_rare.stats:main"
haenv-rare-retrieval-job = "haenv_rare.retrieval:main"

[project.entry-points."haenv.judges.rare"]
rare = "haenv_rare:judges"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haenv_rare"]
