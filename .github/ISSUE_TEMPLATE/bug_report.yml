name: Bug report
description: Something behaves differently from what the docs say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: a few exits are deliberate.

        * `haenv verify` exits 2 on a batch that already contains answers. The order
          is `build → verify → run → report`, or add `--fresh`.
        * The freeze check fails after you change scoring or generation code. That is
          expected on a branch; see section 3 of `CONTRIBUTING.md`.
        * A test that skips has not passed, and the summary reports it as skipped.

        Suspected leaked credentials, non-synthetic data, or third-party text?
        Do not open an issue; see [`SECURITY.md`](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Paste the command and its actual output, including the exit code.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and where it says so
      description: Quote the line in the README or docs that led you to expect it. If nothing does, say that — a missing promise is also a bug.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit or release
      placeholder: "git rev-parse --short HEAD"
    validations:
      required: true

  - type: dropdown
    id: python
    attributes:
      label: Python version
      options: ["3.10", "3.11", "3.12", "3.13", "other"]
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - "git clone + uv run"
        - "pip install (wheel)"
        - "pip install -e ."
        - "other"
    validations:
      required: true
