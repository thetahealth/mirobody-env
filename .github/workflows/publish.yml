name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The package description is the README. On a release its figures and links name the
      # release tag instead of `main`, so each version's PyPI page keeps that version's files.
      - name: Point the package description at the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          sed -i -E "s#/thetahealth/mirobody-env/((blob|tree|raw)/)?main/#/thetahealth/mirobody-env/\\1${TAG}/#g" README.md
          test "$(grep -c -E '/thetahealth/mirobody-env/((blob|tree|raw)/)?main/' README.md)" = 0
      - run: uv build
      - name: Check the built distributions
        run: |
          uv run --with twine python -m twine check dist/*
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment registered as a PyPI trusted publisher for this project.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0  # v1.9.0
