[project]
name = "haenv-attrib-demo"
version = "0.1.0"
description = "haenv plugin package for the event-effect attribution task type: kind rule, judge and mount, with no change to haenv"
requires-python = ">=3.10"

# Each package uses its own entry-point group (it goes into `job_sha256`), not the default `haenv.judges`.
[project.entry-points."haenv.judges.attrib_demo"]
attrib_event_driver = "haenv_attrib_demo:judges"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
