[project]
name = "haenv-llm-judge-demo"
version = "0.1.0"
description = "Reference implementation of an LLM on haenv's judging side (a plugin, not part of haenv itself)"
requires-python = ">=3.10"
dependencies = []

# The whole interface for a plugin: one entry-point group name -> one `() -> Iterable[Judge]` factory.
# `job.yaml` writes `plugins: ["haenv.judges.llm_demo"]`, and `haenv/job.py:load_plugins`
# calls `judges.load_judge_plugins("haenv.judges.llm_demo")`, which finds the line below.
# A dedicated group name (not the shared `haenv.judges`), so the group recorded in
# `job_sha256` maps to exactly one package.
[project.entry-points."haenv.judges.llm_demo"]
rival_discriminator = "haenv_llm_judge_demo:judges"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haenv_llm_judge_demo"]
