[project]
name = "haenv-subject-demo"
version = "0.1.0"
description = "Minimal demo of an external observed subject for haenv: a fifth view, with no change to haenv"
requires-python = ">=3.10"

# A group of its own rather than the shared `haenv.judges`: the group name goes into
# `job_sha256`, so each group must map to exactly one package.
[project.entry-points."haenv.judges.subject_demo"]
subject_demo = "haenv_subject_demo:judges"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
