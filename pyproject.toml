# Generated for the public release by tools/make_public_tree.py from the development pyproject.

[project]
name = "haenv"
version = "1.3.2"
description = "A health-agent evaluation harness: author cases with hidden control variables, run models, get a report"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "pydantic>=2.6"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA", "src/haenv_kernel/LICENSE"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.urls]
Homepage = "https://github.com/thetahealth/mirobody-env"
Documentation = "https://github.com/thetahealth/mirobody-env/blob/main/docs/README.md"
"Data Card" = "https://github.com/thetahealth/mirobody-env/blob/main/docs/DATA_CARD.md"

[project.optional-dependencies]
analysis = ["numpy>=1.24"]
serve = ["mcp>=1.30,<2", "fhir.resources==7.1.0"]

[project.scripts]
haenv = "haenv.cli:main"

[project.entry-points."haenv.m2"]
m2 = "haenv.m2.plugin:judges"

[project.entry-points."haenv.p3"]
p3 = "haenv.p3.plugin:judges"

[project.entry-points."haenv.p4"]
p4 = "haenv.p4.plugin:judges"

[project.entry-points."haenv.pack2"]
pack2 = "haenv.pack2.plugin:judges"

[project.entry-points."haenv.p2"]
p2 = "haenv.p2.plugin:judges"

[project.entry-points."haenv.pack_readouts"]
pack2 = "haenv.pack2.readout:pack"
p2 = "haenv.p2.readout:pack"
p3 = "haenv.p3.readout:pack"
p4 = "haenv.p4.readout:pack"
m2 = "haenv.m2.readout:pack"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "docs", "haenv_kernel", "results", "reports", "frozen", "raw_cases", "inputs", "derived", "cases", "probes", "registry", "examples"]
markers = ["world: world-layer contract tests (`tests/contracts/`): single-variable control cases that check each layer does only its own job; run with `pytest -m world`", "disk: fidelity checks that need paid evaluation batches on disk (`results/`, `reports/`, `frozen/`)", "slow: a single test that takes more than 5 s", "integration: measured slow (tests/fixtures/harness/_speed_tiers.json) or uses a session-shared offline build; `pytest --fast` leaves these out", "internal: repository governance checks (budget ratchets, house rules, migration ratchets)"]
addopts = "-m 'not disk and not internal and not world' --maxschedchunk=2"

[tool.hatch.build.targets.wheel]
packages = ["src/haenv", "src/haenv_kernel", "src/verifier_core"]
core-metadata-version = "2.3"
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
"config.yaml" = "haenv/_data/config.yaml"
"registry" = "haenv/_data/registry"
"benchmarks/inputs" = "haenv/_data/benchmarks/inputs"
"benchmarks/probes" = "haenv/_data/benchmarks/probes"
"examples/extract-replay" = "haenv/_data/examples/extract-replay"
"tools/generation/p3_gen_job.py" = "haenv/_data/tools/generation/p3_gen_job.py"
"tools/generation/p4_gen_job.py" = "haenv/_data/tools/generation/p4_gen_job.py"
"tools/validation/invariant_gates.py" = "haenv/_data/tools/validation/invariant_gates.py"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.3"
exclude = ["/benchmarks/frozen/*.cases.jsonl", "/benchmarks/frozen/*.W.jsonl", "/results/", "/reports/", "/artifacts/", "/docs/figures/", "/tests/", "/config.local.yaml", "/.pytest_cache/", "**/__pycache__", "**/*.pyc"]

[tool.uv.sources.haenv-plugin-demo]
path = "examples/plugin_demo"
editable = true

[tool.uv.sources.haenv-llm-judge-demo]
path = "examples/llm_judge_demo"
editable = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = ["numpy>=1.24", "pytest>=8.0,<10", "pytest-xdist>=3.6", "haenv-plugin-demo", "haenv-llm-judge-demo", "tomli>=2.0; python_version < '3.11'"]
