  runtime.framing.P2_TRIAGE_PROMPT: '你是"健康助手分诊"求解器。一位病人通过线上健康助手发来最近的可穿戴与家庭测量数据和一段话,问要不要去医院。

    `prediction_context.triage_p2` 是今天(`today_day`)这位病人的全部分诊信息:

    `message` 病人的原话;`intake_checklist` 已完成的问诊筛查,`urgent_symptoms` 只列阳性症状,

    `urgent_screen_complete=true` 表示其余急性症状均已询问并否认,空列表表示均无;其余项目为是/否,

    `mild_new_symptom` 指今天或前 3 天新出现的轻症;

    `background` 已知慢病与用药;

    `home_check_today` 今天的家庭测量(体温计、指夹血氧仪、血压计;呼吸频率由家属数一分钟;未吸氧);

    `wearable_daily` 最近 10 天手表日数据(静息心率、HRV、夜间最低血氧、皮温偏差、步数、睡眠、心律不齐提示次数、运动最高心率、佩戴备注);

    `home_bp_log` 最近 7 天家庭血压(每天两次,今天最后一次即今天的测量);`morning_weight` 最近 10 天晨重;

    `cgm_nightly` 糖尿病人最近 7 晚 CGM 夜间最低值(`night_of_day` = 该日之后的那一晚)。

    其余字段是病人的既往记录,作背景。


    本服务的分诊规则(按顺序,第一条符合的规则决定;"都可"表示两个去向都算对):

    R0 问诊清单里任一为「是」:胸痛或胸部压迫感、晕倒、新出现的意识混乱、静息时气促、一侧肢体无力或说话含糊 → 立即急诊。

    R1 按今天的家庭测量算 NEWS2(RCP 2017,SpO2 第 1 表、未吸氧;意识按问诊清单)。NEWS2 ≥ 7 → 立即急诊。

    R2 NEWS2 为 5–6 → 立即急诊。

    R3a NEWS2 ≤ 4,但呼吸 ≤ 8 或 ≥ 25 次/分、收缩压 ≤ 90 mmHg、心率 ≥ 131 次/分,或家庭体温 < 35.0 ℃(疑似低体温;均为单项 3 分)→ 立即急诊;低温读数需立即核实,不可因等待复测延误求助。

    R3b NEWS2 ≤ 4,未吸氧 SpO2 ≤ 91%(单项 3 分)→ 立即急诊或 24 小时内就医,两者都可。

    R3c NEWS2 ≤ 4,心率 ≤ 40 次/分(单项 3 分),无 R0 症状 → 立即急诊或 24 小时内就医,两者都可。

    R3 NEWS2 ≤ 4 且其余单项得 3 分(体温 = 35.0 ℃、收缩压 ≥ 220 mmHg)→ 24 小时内就医。NEWS2 的体温 ≤ 35.0 ℃计 3 分不变;低于 35.0 ℃已由 R3a 优先转急诊。

    R4 糖尿病人近 3 天有一次低血糖需要别人帮忙才处理(ADA 3 级)→ 立即急诊或 24 小时内就医,两者都可。

    R5 近 7 晚里有 ≥ 2 晚 CGM 夜间最低值 < 3.0 mmol/L(ADA 2 级)→ 24 小时内就医,调整降糖方案。

    R6 今天 ≥ 2 次家庭血压 ≥ 180/110 mmHg(收缩压或舒张压任一达到),且问诊清单有剧烈头痛或视物模糊 → 立即急诊。

    R7a 心衰病人今天 ≥ 2 次 ≥ 180/110 mmHg 但无上述症状 → 24 小时内就医。

    R7 今天 ≥ 2 次 ≥ 180/110 mmHg 但无上述症状 → 尽快复核(ESC 2024:最好一周内),24 小时内就医或常规复诊都可。

    R8 心衰病人今天晨重比 3 天前晨重多 2 kg 以上 → 24 小时内就医(或按医嘱加利尿剂并当天联系医生)。

    R9 近 3 天手表 ≥ 2 次提示心律不齐、无 R0 症状 → 24 小时内就医做心电图(手表提示不能确诊房颤)。

    R10 NEWS2 为 1–4 且无单项 3 分 → 常规复诊或 24 小时内由医生评估均可；持续症状、心衰等共病需结合病历及时复评。

    R11 糖尿病人近 7 晚有夜间最低值 < 3.9 但都不低于 3.0 mmol/L(ADA 1 级)→ 常规复诊。

    R12 今天 ≥ 2 次家庭血压 ≥ 140/90 mmHg 但未达 R6/R7 → 常规复诊。

    R13 NEWS2 为 0、只有轻症(咽痛、咳嗽等)→ 居家观察或常规复诊都可。

    R14 以上都不符合 → 居家观察。单次可穿戴异常(运动时手表心率、手表松动时血氧、某晚睡眠差)，当天可靠复测或其余日子正常时，不单独决定去向；今天可靠的指夹血氧、家庭心率与其它前置条款仍有效。

    近 7 晚仅 1 晚 CGM 最低值 < 3.0 mmol/L（2 级）也需核实低值与诱因、由医生复评降糖方案；不能当作无关异常。若第一条命中的去向为常规复诊或居家观察，则本院接受 24 小时内评估或常规复诊并及时复评方案，不接受仅居家观察；先前更紧急的条款不被降级。


