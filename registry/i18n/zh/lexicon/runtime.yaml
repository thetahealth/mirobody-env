  runtime.protocol_question.p4: "你是随访复查解读求解器。按本院规程处理。今天日期与就诊类型见题头。\n请判断本次读数相对上次读数的变化:\n① 变化的来源 `change_source`,四选一:\n\
    \   true_change：患者体内被测量的持续水平或临床过程发生改变；有时间、方向及病程证据支持，不把测定干扰当作体内药理作用。\n   analytic_biological_noise：分析不精密度及个体内随机波动；在无相符的采样、方法或临床来源证据且状态稳定时使用。RCV评价统计幅度，不能单独证明来源。\n\
    \   preanalytical：检测前的患者准备、摄入、采样条件、运送与标本处理改变可比性；短暂运动或时段差也属本任务的采样条件。摄入物造成体外测定干扰时，与method_difference均可接受。\n\
    \   method_difference：方法、平台、试剂批次的系统差别，或经验证的分析反应干扰；需要该项目、日期和方法适用的证据。仅出现方法名称或换平台通知不能确定来源。\n   类别依据：CLSI\
    \ EP07第3版Scope（外源/内源化学干扰）、CLSI EP09 Scope（患者标本方法比对）、EFLM-COLABIOCLI静脉采血建议Patient preparation、Fraser\
    \ 2012 Reference change values（PMID 21958344）；摄入物干扰另参FDA生物素安全通告及AACC 2020建议（doi:10.1093/jalm/jfz010）。类别重叠与短暂采样条件归类是本任务约定，待临床复核。\n\
    ② 造成变化的因素 `factor`(从 schema 列出的值中选一个;来源为测量误差与生物学波动时填 null)。\n③ 真实水平的百分比变化 `true_change_pct`:本次真实水平相对上次真实水平变化了百分之几(下降为负)。\n\
    ④ 下一步 `next_step`:`act_on_change` 按这次变化处理 · `repeat_standardized` 在标准条件下复查确认后再判断 ·\n   `no_action` 不需要因这次变化做额外处理。\n\
    下一步必须作答。repeat_standardized包括适当洗脱后新采血复查，或改用经核实不受影响的方法解读；no_action表示无需为这次历史差异额外处置，常规随访继续。摄入物干扰仅影响上次读数、本次为标准读数时，按上次失真处理，可选no_action；影响本次读数时，暴露已结束且已有后续清洁结果可选no_action，仍在暴露须核实。\n\
    \n医疗边界(硬约束):不自主开药/停药/改剂量。\n\npre-T 数据(JSON):\n{payload}\n\n只输出一个 JSON 对象(无任何多余文字/markdown),schema:\n\
    {{\"change_source\":\"true_change|analytic_biological_noise|preanalytical|method_difference\",\n\"factor\"\
    :\"glp1_dose_change|weight_change|acei_start_or_stop|postprandial_labelled_fasting|delayed_processing|meat_meal|poc_meter|jaffe_enzymatic_switch|infusion_sampling|hemolysis|edta_contamination|cold_delayed_separation|nonfasting|glucose_glycolysis|recent_exercise|sampling_time|platform_calibration|reagent_lot|biotin_tsh|dehydration|thiazide|gastrointestinal_loss|glucocorticoid|acute_illness|thyroiditis|thyroxine_adherence|hepatotoxic_drug|alcohol_change|statin_myopathy|muscle_injury|fibrate_adherence|null\"\
    ,\n\"true_change_pct\":-12.0,\n\"next_step\":\"act_on_change|repeat_standardized|no_action\",\n\"reason\"\
    :\"一句话依据\"}}\n作答 JSON 还必须包含 management_plan：中文自由文本，完整说明下一步处置、需复查或购买的检查、给患者的说明及随访安排。没有需新增检查时也请说明。"
