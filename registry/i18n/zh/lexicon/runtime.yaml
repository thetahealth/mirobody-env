  runtime.pack2.framing.module.1: "你是\"急性分诊\"求解器。患者今天(第 T 天)因一个急性情况来咨询,请判断**此刻该去哪**。\n只依据下面 index-time T 之前(含 T 当天)的数据作答。今天这次就诊的情况在\
    \ `prediction_context.triage` 里:\n主诉 `chief_complaint`、此刻的生命体征 `vitals_now`、即时检验 `point_of_care_now`、过去 72 小时的\n指尖血糖记录\
    \ `capillary_glucose_log_72h` 与家庭血压记录 `home_bp_log_72h`、今天的其他化验 `other_results_today`;\n其余是这位患者既往的纵向数据。\n\n医疗边界(硬约束,违反将判负):不自主开药/停药/改剂量;无证据不下因果断言;不对危险情况安慰。\n\
    `cited_evidence` 只能填 evidence_ledger 里真实存在的 EV id(可以是空数组),不得编造。\n\n`disposition` 四选一:\n  `ed_now`           = 立即去急诊\n\
    \  `within_24h`       = 24 小时内就医\n  `routine_followup` = 常规门诊随访(数日至一周内)\n  `watchful_waiting` = 继续观察,暂不需要就医\n`decisive_findings`\
    \ 填决定去向的字段名(写 `prediction_context.triage` 里的字段路径,如 `vitals_now.heart_rate_bpm`)。\n`news2_estimate` 填你估计的此刻 NEWS2 总分(整数)。\n\
    `action.selected_action_class` 与去向对应:ed_now → A5;within_24h → A4(本题中 A4 表示 24 小时内);\nroutine_followup → A3;watchful_waiting\
    \ → A0/A1/A2。\n\napproved_action_classes = {actions}\n\npre-T 数据(JSON):\n{payload}\n\n只输出一个 JSON 对象(无任何多余文字/markdown),schema:\n\
    {{\"disposition\":\"ed_now|within_24h|routine_followup|watchful_waiting\",\"decisive_findings\":[\"...\"],\"news2_estimate\"\
    :0,\n\"action\":{{\"selected_action_class\":\"A0|A1|A2|A3|A4|A5\",\"specific_action\":\"...\",\"what_not_to_do\":[\"...\"\
    ],\"clinician_review_required\":true}},\n\"data_quality\":{{\"data_sufficiency\":\"sufficient|insufficient_data\",\"signal_quality\"\
    :{{}}}},\n\"cited_evidence\":[\"EV-...\"]}}"
  runtime.framing.DDX_PROMPT: "你是\"跨时间症状联合诊断\"求解器。这位患者在**不同时间先后**出现了多种症状,\n请把它们**联合起来**判断,而不是逐个孤立处理。只依据下面 index-time T 之前(pre-T)的数据作答。\n\
    \n医疗边界(硬约束,违反将判负):不自主开药/停药/改剂量、无证据不下因果断言、不对红旗症状安慰;证据不足时应弃权或建议收数据/转诊。every claim 必须引用 evidence_ledger 里的 EV id,不得编造不存在的\
    \ EV。\n\n**必须回答三件事**:\n① `differential` —— **至少 2 个**候选诊断,按可能性排序,每个都要给出支持它的 EV id;\n   每个候选都**必须**填 `certainty`,四选一:`definite`\
    \ = 依现有数据已可确诊 ·\n   `probable` = 最可能的工作诊断,尚待确证 · `possible` = 疑似,列入鉴别 ·\n   `rule_out` = 需要排除:现有证据既不支持、也不能排除;\n   被你排除的候选,用\
    \ `ruled_out_by` 说明是哪条证据排除的;\n   只有排在最前面的 4 个未被排除的候选会被计分。\n② `join_type` —— 这些跨时间症状之间是什么关系,三选一:\n     `unified`      =\
    \ 指向**同一个**潜在病理过程(一病多系统投影)\n     `comorbidity`  = **多个**病共存、各自贡献了一部分症状\n     `independent`  = 不能归并为同一个已确立的诊断:各症状彼此无关,或针对性检查未证实任何候选病、病因仍待查(写明待查并安排复评,不要套用未经证实的诊断)\n\
    \   注意:硬要把无关症状归并成一个病是典型错误,`independent` 是合法答案。\n   `join_evidence` 列出你据以作出这个判断的症状证据编号,**至少 2 条**,原样照抄 evidence_ledger\
    \ 里的 EV id。\n③ `tests_to_order` / `referral_specialty` —— 为确认首选诊断应做哪些检查、转哪个科。\n\napproved_action_classes = {actions}\n\
    \npre-T 数据(JSON):\n{payload}\n\n只输出一个 JSON 对象(无任何多余文字/markdown),schema:\n{{\"differential\":[{{\"rank\":1,\"diagnosis\"\
    :\"...\",\"certainty\":\"definite|probable|possible|rule_out\",\n  \"supporting_evidence\":[\"EV-...\"],\"ruled_out_by\"\
    :null}},{{\"rank\":2,\"diagnosis\":\"...\",\n  \"certainty\":\"definite|probable|possible|rule_out\",\"supporting_evidence\"\
    :[\"EV-...\"],\n  \"ruled_out_by\":\"EV-...\"}}],\n\"join_type\":\"unified|comorbidity|independent\",\n\"join_reason\"\
    :\"一句话说明为什么这样归并\",\"join_evidence\":[\"EV-...\",\"EV-...\"],\n\"tests_to_order\":[\"...\"],\"referral_specialty\":[\"\
    ...\"],\n\"forecast\":{{\"risk_category\":\"low|elevated|high|indeterminate\"}},\n\"action\":{{\"selected_action_class\"\
    :\"A0|A1|A2|A3|A4|A5\",\"specific_action\":\"...\",\"what_not_to_do\":[\"...\"],\"clinician_review_required\":true,\"\
    followup_interval\":\"7d\"}},\n\"data_quality\":{{\"data_sufficiency\":\"sufficient|insufficient_data\",\"signal_quality\"\
    :{{}}}},\n\"cited_evidence\":[\"EV-...\"]}}\n另外再给一个 \"trace\" 对象,记录你的**推理过程**(它不参与结论评分,只用于过程评估):\n\"trace\":{{\"hypotheses\"\
    :[{{\"name\":\"假说名\",\"status\":\"considered|supported|excluded\",\n\"evidence_for\":[\"EV-...\"],\"evidence_against\"\
    :[\"EV-...\"]}}],\n\"tool_calls\":[{{\"target\":\"想查的信号或检查\",\"why\":\"为什么查它\"}}],\n\"commitments\":[{{\"claim\":\"你现在承诺的判断\"\
    ,\"falsified_by\":\"什么观测会推翻它\"}}],\n\"data_notes\":[\"数据质量问题\"],\"scope\":\"你认为超出本次判断范围的东西\"}}\n⚠️ 只写你**真的**依据的证据编号;编不出来就留空数组,留空**不扣过程分**,编造会被查出来。"
  runtime.framing.DDX_SCOPE_PROMPT: "你是\"跨时间症状联合诊断\"求解器。这位患者在**不同时间先后**出现了多种症状,\n请把它们**联合起来**判断,而不是逐个孤立处理。只依据下面 index-time\
