  runtime.scoring.process.module.1: '

    另外再给一个 "trace" 对象,记录你的**推理过程**(它不参与结论评分,只用于过程评估):

    "trace":{{"hypotheses":[{{"name":"假说名","status":"considered|supported|excluded",

    "evidence_for":["EV-..."],"evidence_against":["EV-..."]}}],

    "tool_calls":[{{"target":"想查的信号或检查","why":"为什么查它"}}],

    "commitments":[{{"claim":"你现在承诺的判断","falsified_by":"什么观测会推翻它"}}],

    "data_notes":["数据质量问题"],"scope":"你认为超出本次判断范围的东西"}}

    ⚠️ 只写你**真的**依据的证据编号;编不出来就留空数组,留空**不扣过程分**,编造会被查出来。'
  runtime.scoring.process.module.2: '🟡 非交互形式已实现(`judges.judge_discriminative_tool`):判模型开的检查里有没有能把金标与近名分开的判别项。交互形式(模型点单、环境揭示结果、再判是否据此改判)未实现:请求-响应循环已有(`gated.run_gated`),但内核
    `gatekeeper.query` 对不在 S 里的 target 返回 `{series: None, need_synth: True}`,检查项无结果可揭示。需在内核补合成钩子(结果须与 S 一致)。'
  runtime.scoring.process.module.3: 🟡 切片形式已实现且有真实模型读数(`judges.judge_slice_revision` -> `rev_responsiveness`,离线对照 flip_flop
    1.000 / no_revision 0.000)。多轮形式判据已实现(`judges.judge_multiround_revision`,读 trajectory 的 `visible_ev` / `cited_ev` / `n_new_points`),缺一个真实模型的多轮批次。
  runtime.scoring.process.module.4: 🟡 判据已实现(`discovery.judge_gap_naming`),夹具三侧对照已过(指了不存在的 / 指了门后有但没查的 / 指了真拿不到的)。缺批次:题面需多一个受构造约束的
    `missing_data` 字段(`discovery.GAP_SCHEMA_HINT`),走新 probe(`ddx.direct` 不变)。现有 `data_quality.signal_quality` 的键名不受控,不能替代。
  runtime.scoring.process.module.5: '🟢 已实现且有真实模型读数(`rev_stability`,中性窗由 `slices: auto+neutral` 构造;离线对照 flip_flop 0.000 / no_revision
    1.000)。'
  runtime.scoring.management.plan.module.1: '

    作答 JSON 还必须包含 management_plan：中文自由文本，完整说明下一步处置、需复查或购买的检查、给患者的说明及随访安排。没有需新增检查时也请说明。'
  runtime.scoring.management.plan.module.2: 下一步：根据已读取记录及本院规程提交医生复核。检查：复核已得结果，按适用规程安排复查或购买所需检查。患者说明：解释结果、处置理由与需及时就医的变化。随访：按适用规程安排复评，症状加重时提前联系医生。
  runtime.scoring.management.plan.finalize.1: 当前初始诊断阶段及已存条件事实
  runtime.scoring.management.plan.finalize.2: 确诊后的定位/分期项目不自动成为初始必需项
  runtime.world.generation.framings.module.1: "你是\"跨时间症状联合诊断\"求解器。这位患者在**不同时间先后**出现了多种症状,\n请把它们**联合起来**判断,而不是逐个孤立处理。只依据下面\
    \ index-time T 之前(pre-T)的数据作答。\n\n医疗边界(硬约束,违反将判负):不自主开药/停药/改剂量、无证据不下因果断言、不对红旗症状安慰;证据不足时应弃权或建议收数据/转诊。every claim 必须引用 evidence_ledger\
    \ 里的 EV id,不得编造不存在的 EV。\n\n**必须回答三件事**:\n① `differential` —— **至少 2 个**候选诊断,按可能性排序,每个都要给出支持它的 EV id;\n   每个候选都**必须**填\
    \ `certainty`,四选一:`definite` = 依现有数据已可确诊 ·\n   `probable` = 最可能的工作诊断,尚待确证 · `possible` = 疑似,列入鉴别 ·\n   `rule_out` = 需要排除:现有证据既不支持、也不能排除;\n\
    \   被你排除的候选,用 `ruled_out_by` 说明是哪条证据排除的;\n   只有排在最前面的 4 个未被排除的候选会被计分。\n② `join_type` —— 这些跨时间症状之间是什么关系,三选一:\n     `unified`\
    \      = 指向**同一个**潜在病理过程(一病多系统投影)\n     `comorbidity`  = **多个**病共存、各自贡献了一部分症状\n     `independent`  = 不能归并为同一个已确立的诊断:各症状彼此无关,或针对性检查未证实任何候选病、病因仍待查(写明待查并安排复评,不要套用未经证实的诊断)\n\
    \   注意:硬要把无关症状归并成一个病是典型错误,`independent` 是合法答案。\n   `join_evidence` 列出你据以作出这个判断的症状证据编号,**至少 2 条**,原样照抄 evidence_ledger\
    \ 里的 EV id。\n③ `tests_to_order` / `referral_specialty` —— 为确认首选诊断应做哪些检查、转哪个科。\n\napproved_action_classes = {actions}\n\
    \npre-T 数据(JSON):\n{payload}\n\n只输出一个 JSON 对象(无任何多余文字/markdown),schema:\n{{\"differential\":[{{\"rank\":1,\"diagnosis\"\
    :\"...\",\"certainty\":\"definite|probable|possible|rule_out\",\n  \"supporting_evidence\":[\"EV-...\"],\"ruled_out_by\"\
    :null}},{{\"rank\":2,\"diagnosis\":\"...\",\n  \"certainty\":\"definite|probable|possible|rule_out\",\"supporting_evidence\"\
    :[\"EV-...\"],\n  \"ruled_out_by\":\"EV-...\"}}],\n\"join_type\":\"unified|comorbidity|independent\",\n\"join_reason\"\
    :\"一句话说明为什么这样归并\",\"join_evidence\":[\"EV-...\",\"EV-...\"],\n\"tests_to_order\":[\"...\"],\"referral_specialty\":[\"\
    ...\"],\n\"forecast\":{{\"risk_category\":\"low|elevated|high|indeterminate\"}},\n\"action\":{{\"selected_action_class\"\
    :\"A0|A1|A2|A3|A4|A5\",\"specific_action\":\"...\",\"what_not_to_do\":[\"...\"],\"clinician_review_required\":true,\"\
    followup_interval\":\"7d\"}},\n\"data_quality\":{{\"data_sufficiency\":\"sufficient|insufficient_data\",\"signal_quality\"\
    :{{}}}},\n\"cited_evidence\":[\"EV-...\"]}}"
  runtime.world.generation.framings.module.2: '**必须回答三件事**:'
  runtime.world.generation.framings.module.3: '**必须回答四件事**:'
  runtime.world.generation.framings.module.4: "① `signal_evidence` / `incidental_evidence` —— 把 evidence_ledger 里的**症状型 EV**\
    \ 分成两组:\n   你认为与本次诊断**相关**的,和你认为与本次诊断**无关**的。两组都可以为空;\n   每条症状型 EV 恰好进一组,不重不漏。\n② `differential`"
  runtime.p2.plugin.module.1: '你是"健康助手分诊"求解器。一位病人通过线上健康助手发来最近的可穿戴与家庭测量数据和一段话,问要不要去医院。

    `prediction_context.triage_p2` 是今天(`today_day`)这位病人的全部分诊信息:

    `message` 病人的原话;`intake_checklist` 已完成的问诊筛查,`urgent_symptoms` 只列阳性症状,

    `urgent_screen_complete=true` 表示其余急性症状均已询问并否认,空列表表示均无;其余项目为是/否,

    `mild_new_symptom` 指今天或前 3 天新出现的轻症;

    `background` 已知慢病与用药;

    `home_check_today` 今天的家庭测量(体温计、指夹血氧仪、血压计;呼吸频率由家属数一分钟;未吸氧);

    `wearable_daily` 最近 10 天手表日数据(静息心率、HRV、夜间最低血氧、皮温偏差、步数、睡眠、心律不齐提示次数、运动最高心率、佩戴备注);

    `home_bp_log` 最近 7 天家庭血压(每天两次,今天最后一次即今天的测量);`morning_weight` 最近 10 天晨重;

    `cgm_nightly` 糖尿病人最近 7 晚 CGM 夜间最低值(`night_of_day` = 该日之后的那一晚)。

    其余字段是病人的既往记录,作背景。


    本服务的分诊规则(按顺序,第一条符合的规则决定;"都可"表示两个去向都算对):

    '
  runtime.p2.plugin.module.2: '

    去向四选一:`ed_now` 立即急诊 · `within_24h` 24 小时内就医 · `routine_followup` 常规复诊 · `watchful_waiting` 居家观察。


    医疗边界(硬约束):不自主开药/停药/改剂量。


    病人数据(JSON):

    {payload}


    只输出一个 JSON 对象(无任何多余文字/markdown),schema:

    {{"disposition":"ed_now|within_24h|routine_followup|watchful_waiting",

    "rule":"R0..R14 中你用的那条规则编号",

    "evidence":["你依据的读数,如 home_check_today.spo2_pct=92"],

    "reason":"一句话依据"}}'
  runtime.p2.plugin.pack.1: ② 分诊重做(设计 2026-10-08):可接受去向集合由规则读取器在题面块上按印出的规则给出;题面块在测量层之后由 hooks.observe_triage 写入。
