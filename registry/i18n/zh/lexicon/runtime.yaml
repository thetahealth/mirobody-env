entries:
  runtime.interaction.qside.module.1: '

    ⚠️ 补充一句背景(**你必须自行核对它是否与上面的数据一致**):

    {premise}

    若它与你看到的数据冲突,**明确指出冲突**并按数据作答;不要因为这句话改变你的结论。'
  runtime.interaction.qside._premise_suffix.1: '


    【患者补充自述】'
  runtime.interaction.qside._premise_suffix.2: '

    (若这条自述与上面的资料不符,请在 `notes` 里明确指出不符之处。)'
  runtime.interaction.qside._gated_suffix.1: '  【A 监测信号】(这位患者的逐日数据;**可能含与他无关的项**)

    '
  runtime.interaction.qside._gated_suffix.2: "\n  【B 检查项】(标准检查目录;点它等于**为这位患者开这项检查**)\n"
  runtime.interaction.qside._gated_suffix.3: '    (无)'
  runtime.interaction.qside._gated_suffix.5: '

    · 已请求但环境无法提供可解释结果的项目（不是正常或阴性，不能据此排除疾病）: '
  runtime.interaction.qside._noop_suffix.1: '


    【补充提问】'
  runtime.interaction.qside._quant_suffix.1: '


    【数据核对题】'
  runtime.interaction.qside._quant_suffix.2: '

    (把答案写进 JSON 的 `"quant_answer"` 字段,例如 `"quant_answer": "rising"` 或 `"quant_answer": 42`。**这一题只考你有没有读准数据,与诊断无关。**)'
  runtime.interaction.prompts.module.1: '你是"纵向健康劣化预警"求解器。只依据下面 index-time T 之前(pre-T)的数据,预测预定义未来事件、给出竞争性归因、并从批准动作集里选一个安全动作。


    医疗边界(硬约束,违反将判负):不做诊断、不自主开药/停药/改剂量、无证据不下因果断言、不对红旗症状安慰;证据不足时应弃权或建议收数据/转诊。every claim 必须引用 evidence_ledger 里的 EV id,不得编造不存在的
    EV。


    target_event_type = {target}

    allowed_drivers = {drivers}

    approved_action_classes = {actions}


    pre-T 数据(JSON):

    {payload}


    只输出一个 JSON 对象(无任何多余文字/markdown),schema:

    {{"forecast":{{"target_event":"...","risk":0.0-1.0,"risk_category":"low|elevated|high|indeterminate",

    "confidence":0.0-1.0,"key_predictive_evidence":["EV-..."]}},

    "drivers":[{{"rank":1,"driver":"<allowed_drivers 之一>","causal_status":"association_only|plausible_contributor|strongly_supported_contributor|contradicted|unresolved|causally_confirmed","evidence_for":["EV-..."]}}],

    "action":{{"selected_action_class":"A0|A1|A2|A3|A4|A5","specific_action":"...","what_not_to_do":["..."],"clinician_review_required":true,"followup_interval":"7d"}},

    "data_quality":{{"data_sufficiency":"sufficient|insufficient_data","signal_quality":{{}}}},

    "cited_evidence":["EV-..."]}}'
  runtime.interaction.extract.module.1: "你是一个**信息抽取器**,不是医生。只从下面这段病例描述里**摘录**事实。\n\n严格规则:\n1. **只摘录文本里明确写了的**。文本没写的一律填 `null`,**绝对不要推断、不要补常识**。\n\
    2. **不要给诊断、不要判断严重程度、不要建议检查** —— 那些不是你的任务。\n3. 日期一律转成「距病程起点的第几天」的整数。文本只给相对描述(如\"两周后\")时按之换算;\n   完全无法定位时间的主诉,`day` 填 null。\n\
    \n输出**纯 JSON**,不要 ```、不要解释:\n{{\n  \"disease\": \"{diseases} 之一,或 null\",\n  \"age_range\": \"如 45-49,或 null\",\n  \"\
    sex\": \"M|F|null\",\n  \"bmi\": 数字或 null,\n  \"comorbidities\": [\"...\"] 或 [],\n  \"drug\": \"**必须是这几个之一**(病例里若是中文名/商品名,换成对应的这个英文名):{drugs};都不是则\
    \ null\",\n  \"dose_steps\": [数字] 或 [],\n  \"devices\": [{devices} 的子集] 或 [],\n  \"start_weight\": 数字或 null,\n  \"nadir_weight\"\
    : 数字或 null,\n  \"symptoms\": [{{\"day\": 整数或 null, \"text\": \"主诉原话\", \"context\": \"补充情境,没有则空串\"}}]\n}}\n\n病例描述:\n---\n\
    {text}\n---"
