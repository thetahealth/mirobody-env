    \ —— 必须挑;超出余额的项目不会执行。菜单里可能有与这位患者无关的项,点了照样计费。\n  ⚠️ 预算用尽而仍未作答,本题按未作答处理。\n  ⚠️ 检查项(菜单 tests)买过即计入「你开的检查」 —— `tests_to_order`\
    \ 里只需再填菜单未列的检查。\n  · 结果为「无法提供可解释结果」的项目不是正常或阴性,不能据此排除疾病。"
