  p2.med.bb: 比索洛尔 5 mg 每日一次
  p2.med.bb2: 美托洛尔缓释片 47.5 mg 每日一次
  p2.med.insulin: 甘精胰岛素 每晚皮下注射
  p2.med.su: 格列美脲 每日早餐前
  p2.med.furosemide: 呋塞米 20 mg 每日一次
  p2.med.amlodipine: 氨氯地平 5 mg 每日一次
