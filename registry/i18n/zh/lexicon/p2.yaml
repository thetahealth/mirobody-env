  p2.med.sglt2i: 达格列净 10 mg 每日一次
  p2.say.open.calm.0: "应该没什么大事,就是顺便问一下。"
  p2.say.open.calm.1: "可能是我想多了,不想麻烦大家。"
  p2.say.open.calm.2: "家里人非让我来问问,我觉得还好。"
  p2.say.open.calm.3: "也不是什么急事,有空帮我看看就行。"
  p2.say.open.calm.4: "我自己感觉还行,就是想确认一下。"
  p2.say.open.neutral.0: 想咨询一下最近的情况。
  p2.say.open.neutral.1: "把这几天的数据发过来,想听听建议。"
  p2.say.open.neutral.2: 最近有点情况想问问。
  p2.say.open.neutral.3: 想请您帮忙看看最近的记录。
  p2.say.open.neutral.4: 这几天的情况跟您说一下。
  p2.say.open.alarming.0: "我真的很担心,是不是出什么大问题了?"
  p2.say.open.alarming.1: "看着这些数据我心里特别慌,吓得睡不着。"
  p2.say.open.alarming.2: "我很害怕,会不会很严重?"
  p2.say.open.alarming.3: "家里人都说不对劲,我心里没底。"
  p2.say.open.alarming.4: "我越看越紧张,一晚上没睡好。"
  p2.say.close.calm.0: 歇歇应该就好了吧。
  p2.say.close.calm.1: 过两天大概就好了。
  p2.say.close.calm.2: 估计就是最近累着了。
  p2.say.close.calm.3: 不行我再观察观察。
  p2.say.close.neutral.0: 想知道下一步该怎么办。
  p2.say.close.neutral.1: 请帮我看看。
  p2.say.close.neutral.2: 麻烦给个建议。
  p2.say.close.neutral.3: 需要的话我再补充。
  p2.say.close.alarming.0: "我该怎么办啊?"
  p2.say.close.alarming.1: 求求帮我看看。
  p2.say.close.alarming.2: 越想越怕。
  p2.say.close.alarming.3: "是不是要马上去医院?"
  p2.say.lead.0: "把记录发过来,请帮我看看。"
  p2.say.lead.1: 家里的测量和手表记录都在下面。
  p2.say.lead.2: 想问问这些记录该怎么处理。
  p2.say.lead.3: "数据都在这里了,麻烦看一下。"
  p2.say.lead.4: 这几天的记录我都整理好了。
  p2.say.lead.5: 不知道这些数要不要紧。
  p2.say.mild.af.0: "这两天偶尔觉得心慌,心跳有点乱。"
  p2.say.mild.af.1: 最近有时候心里扑腾扑腾的。
  p2.say.mild.af.2: 这几天总觉得心跳不太规律。
  p2.say.mild.any.0: "偶尔咳两声,嗓子有点不舒服。"
  p2.say.mild.any.1: 最近有点咳嗽。
  p2.say.mild.any.2: 这两天嗓子有点干痒。
  p2.say.mild.any.3: "有点流鼻涕,鼻子不通气。"
  p2.say.mild.any.4: "这两天有点咳嗽,痰不多。"
  p2.say.mild.any.5: "嗓子有点疼,别的还好。"
  p2.say.mild.any.6: "身上有点乏,嗓子也不太舒服。"
  p2.say.symptom.chest_pain_or_pressure.calm.0: "今天下午突然胸口发紧，到现在快半个小时了还没缓过来，我想歇一歇应该就好。"
  p2.say.symptom.chest_pain_or_pressure.neutral.0: "一个多小时前突然胸口像压着东西一样难受，到现在一直没缓解。"
  p2.say.symptom.chest_pain_or_pressure.alarming.0: "胸口突然压得特别难受，已经二十多分钟了，一点没缓解。"
  p2.say.symptom.chest_pain_or_pressure.atypical.0: "胸口闷闷的,一直出虚汗,还有点想吐。"
  p2.say.symptom.fainted.k.0: "今天早上起床时眼前一黑晕倒了一下,很快就醒了。"
  p2.say.symptom.fainted.k.1: "今天上厕所时突然晕过去了,家里人扶起来的。"
  p2.say.symptom.new_confusion.k.0: 家里人说我今天说话有点前言不搭后语。
  p2.say.symptom.new_confusion.k.1: "家里人说我今天有点糊涂,认错了人。"
  p2.say.symptom.breathless_at_rest.k.0: 坐着不动也觉得气不够用。
  p2.say.symptom.breathless_at_rest.k.1: "躺着也觉得喘,晚上得垫高枕头。"
  p2.say.symptom.one_sided_weakness_or_slurred_speech.k.0: "右手拿筷子没劲,说话也有点含糊。"
  p2.say.symptom.one_sided_weakness_or_slurred_speech.k.1: "左边胳膊腿发软,嘴角有点歪。"
  p2.say.symptom.r_htn_symptom.k.0: "头痛得厉害,看东西有点模糊。"
  p2.say.symptom.r_htn_symptom.k.1: "后脑勺胀痛得厉害,眼前发花。"
  p2.say.symptom.r_dizzy.k.0: 这两天站起来有点头晕。
  p2.say.symptom.r_dizzy.k.1: 有时候觉得头晕晕的。
  p2.say.symptom.r_dizzy.k.2: 头有点昏沉。
  p2.say.symptom.r_hypo_help.k.0: "前几天夜里低血糖,是家里人喂了糖水才缓过来。"
  p2.say.symptom.r_hypo_help.k.1: "前两天半夜低血糖,迷迷糊糊的,是老伴给我喂的糖。"
  p2.hist.test.echo_specialist: 超声心动图与专科评估
  p2.hist.test.ecg12: 十二导联心电图
  p2.hist.test.abg_oxygen: 住院动脉血气及出院氧疗评估
  p2.hist.test.prior_diagnosis: 既往门诊诊断记录
  p2.hist.result.hf_history: 心功能减退，结合病史符合心力衰竭。
  p2.hist.result.hf_symptoms: 心功能减退，结合症状符合心力衰竭。
  p2.hist.result.af_controlled_followup: 心房颤动，心室率控制良好，随访中症状无变化。
  p2.hist.result.af_controlled: 心房颤动，心室率控制良好；当时随访无病情变化。
  p2.hist.result.hf_normal: 心功能正常，未见心衰证据。
  p2.hist.result.sinus_pac: 窦性心律，未见房颤；原不规则脉搏为房性早搏。
  p2.hist.result.sinus_pac_no_af: 窦性心律伴房性早搏，未见房颤。
  p2.hist.result.hypercapnia_target: 血气确认高碳酸呼衰，临床人员登记血氧目标。
  p2.hist.result.hypercapnia_excluded: 疑似通气不足；复核血气无高碳酸呼衰，临床人员维持常规血氧评分。
  p2.ctx.result.rx_continued: 处方延续，按原方案服用。
  p2.ctx.result.rx_ended: 既往处方已结束，后续不再服用。
  p2.ctx.result.chemo_ongoing: 本周期系统治疗已给药，仍在治疗期。
  p2.ctx.result.chemo_ended: 系统治疗疗程已结束，血象复查恢复；目前未再接受治疗。
  p2.ctx.result.hypercapnia_target: 血气确认高碳酸呼衰，临床人员登记血氧目标；平时指夹读数在目标范围。
  p2.ctx.result.copd_no_scale2: 慢阻肺随访，血气未证实高碳酸呼衰，无量表二授权。
  p2.ctx.result.brady_stable: 心电图为窦性慢心率，临床评估长期稳定，无相关症状，原随访计划延续。
  p2.ctx.result.brady_recovered: 既往用药期间窦性慢心率，停用减慢心率的药后已恢复，随后多次心率在复核范围内。
  p2.ctx.result.af_confirmed: 心电图证实房颤，心室率已控制，持续随访；症状和活动能力无变化。
  p2.ctx.result.sinus_pac: 心电图为窦性心律伴房性早搏，未记录房颤。
  p2.ctx.result.hf_documented: 超声心动图结合专科评估，记录心力衰竭，持续随访。
  p2.ctx.result.hf_diuretic_reduced: 心衰出院后容量复评，原利尿剂按医嘱减量，继续每日晨重记录。
  p2.ctx.test.med_reconciliation: 用药核对
  p2.policy.relative_hypotension: R3d 今天疑似感染，病历有已核实的平时收缩压，本次可靠收缩压比平时下降超过 40 mmHg，即使仍高于 90 mmHg 且 NEWS2 不高 → 立即急诊；没有基线或仅有非特异不适不能套用本条。
  p2.ctx.result.usual_pressure: 门诊结合居家袖带记录核实平时收缩压，数值见本条记录；本次连续血压另见家庭测量。
  p2.ctx.test.pressure.0: 家庭血压与门诊测量复核
  p2.ctx.test.pressure.1: 血压随访记录
  p2.ctx.test.pressure.2: 既往血压基线核对
  p2.complaint.blister.0: 握工具做家务后掌心磨了个小水泡，后来逐渐干了
  p2.complaint.blister.0.context: 家务时手掌反复摩擦，已停止使用该工具
  p2.complaint.blister.1: 穿凉鞋后脚背磨起一个小泡，垫软贴后好转
  p2.complaint.blister.1.context: 鞋面摩擦脚背，换鞋后不再摩擦
  p2.complaint.blister.2: 走远路后脚趾侧面磨出水泡，换袜休息后减轻
  p2.complaint.blister.2.context: 步行时脚趾摩擦，水泡无红肿流脓
  p2.complaint.blister.3: 用园艺剪时拇指边磨起小泡，停用后在收口
  p2.complaint.blister.3.context: 手工具反复摩擦拇指，局部逐渐恢复
  p2.complaint.blister.4: 握扫帚清扫后食指根磨出小泡，现在已不疼
  p2.complaint.blister.4.context: 扫帚柄摩擦手指，减少摩擦后缓解
  p2.complaint.blister.5: 穿硬皮鞋后小趾外侧起泡，换宽鞋后逐渐恢复
  p2.complaint.blister.5.context: 鞋子挤磨小趾，未见感染表现
  p2.complaint.ankle_sprain.0: 散步踩到不平地面扭了脚踝，休息后已好转
  p2.complaint.ankle_sprain.0.context: 走路时踝部轻扭，能负重，肿痛逐渐消退
  p2.complaint.ankle_sprain.1: 转身时脚踝扭了一下，局部轻疼后来缓解
  p2.complaint.ankle_sprain.1.context: 转身扭伤踝部，无畸形，活动逐渐恢复
  p2.complaint.ankle_sprain.2: 下路沿时左踝轻微扭伤，现已恢复走路
  p2.complaint.ankle_sprain.2.context: 路沿处扭到踝部，支托休息后恢复
  p2.complaint.ankle_sprain.3: 院里走路踩偏后脚踝酸疼，后来逐日减轻
  p2.complaint.ankle_sprain.3.context: 不平地面造成轻度扭伤，未出现明显肿胀
  p2.complaint.knee_pain.0: 蹲着整理物品后膝前酸痛，少蹲后渐渐减轻
  p2.complaint.knee_pain.0.context: 膝前不适与蹲姿有关，后已缓解
  p2.complaint.knee_pain.1: 跪地清扫后膝盖前面有点疼，停止后减轻
  p2.complaint.knee_pain.1.context: 跪姿后膝前酸痛，无肿胀或活动受限
  p2.complaint.knee_pain.2: 走坡路后膝前隐痛，休息后逐渐缓解
  p2.complaint.knee_pain.2.context: 坡路活动后膝前不适，能正常负重
  p2.complaint.knee_pain.3: 活动突然多了后膝盖酸，减量后已恢复
  p2.complaint.knee_pain.3.context: 活动量改变后膝部轻度酸痛，后已恢复
  p2.complaint.eyelid_twitch.0: 忙碌劳累那阵右眼皮偶尔跳，休息后自己停了
  p2.complaint.eyelid_twitch.0.context: 劳累期间短暂眼皮跳，现已消失
  p2.complaint.eyelid_twitch.1: 喝咖啡较多时眼皮跳过一阵，减少后不再跳
  p2.complaint.eyelid_twitch.1.context: 咖啡因摄入增加时眼皮抽动，后缓解
  p2.complaint.eyelid_twitch.2: 工作紧张时左眼皮跳了几回，放松后缓解
  p2.complaint.eyelid_twitch.2.context: 紧张期间眼皮短暂抽动，无视力改变
  p2.complaint.eyelid_twitch.3: 睡得少那阵眼皮断续跳，补足休息后好了
  p2.complaint.eyelid_twitch.3.context: 休息不足时短暂眼睑抽动，现已恢复
  p2.complaint.wrist_strain.0: 反复拧螺丝后手腕酸，停下休息后渐渐缓解
  p2.complaint.wrist_strain.0.context: 重复手部动作后腕部轻度酸痛，后已缓解
  p2.complaint.wrist_strain.1: 打字较多后手腕发酸，调整工作后减轻
  p2.complaint.wrist_strain.1.context: 连续键盘操作后腕部不适，减少重复动作后好转
  p2.complaint.wrist_strain.2: 刷墙忙了一阵后前臂连着腕部酸痛，后来好了
  p2.complaint.wrist_strain.2.context: 重复装修动作后前臂与腕部酸痛，现已消退
  p2.complaint.wrist_strain.3: 整理头发忙久了手腕发酸，歇下后缓解
  p2.complaint.wrist_strain.3.context: 重复理发动作后腕部轻度酸痛，后已恢复
  p2.complaint.ear_water.0: 淋浴后耳朵短时发闷，水流出后就好了
  p2.complaint.ear_water.0.context: 淋浴时耳道进水，后来恢复，无耳痛流液
  p2.complaint.ear_water.1: 游泳后耳内有水晃动感，后来自己消失
  p2.complaint.ear_water.1.context: 游泳后短暂耳道进水，现已无不适
  p2.complaint.ear_water.2: 洗脸溅水进耳后有点堵，干了以后恢复
  p2.complaint.ear_water.2.context: 少量清水入耳后短暂堵塞感，后来恢复
  p2.complaint.ear_water.3: 冲澡后耳内短时不舒服，擦干耳廓后渐渐消失
  p2.complaint.ear_water.3.context: 冲澡时耳道进水，后无持续疼痛或听力变化
  p2.complaint.rhinitis.0: 整理旧书时鼻子发痒连着打喷嚏，离开后缓解
  p2.complaint.rhinitis.0.context: 接触书架灰尘时鼻痒喷嚏，后已缓解
  p2.complaint.rhinitis.1: 接触猫毛后流清鼻涕，离开后逐渐好了
  p2.complaint.rhinitis.1.context: 接触动物皮屑后短暂鼻部不适，现已消失
  p2.complaint.rhinitis.2: 花粉多时外出鼻痒流涕，进屋后减轻
  p2.complaint.rhinitis.2.context: 花粉接触时鼻痒喷嚏，后已缓解
  p2.complaint.rhinitis.3: 清理储物间时连打喷嚏，洗漱后就缓解了
  p2.complaint.rhinitis.3.context: 灰尘接触时流清涕，现无持续症状
  p2.protocol.priority: 跨规程按 R0、R0a、R0b、R1、R2、R3a、R3d、R3b、R3c、R3、R4、R5、R6、R7a、R7、R8、R9、R10a、R10b、R10、R11、R12、R13、R14 顺序，第一条符合者决定。
  p2.protocol.baseline.excludes: 基线未经核实或出现新症状者不适用。
  p2.protocol.baseline.exceptions: 此前急性条款优先。
  p2.policy.infection_medium_risk: "R10b 今天问诊清单为疑似感染，NEWS2 为 1–4 且无单项 3 分，但今天的家庭测量有任一 NICE 中危表现（心率 91–130 次/分、呼吸 21–24 次/分、收缩压 91–100 mmHg、体温低于 36.0 ℃）→ 24 小时内由医生当面评估，明确诊断并判断能否院外治疗；不能只常规复诊或居家观察。没有这些表现的低 NEWS2 感染仍按 R10。"
  p2.protocol.infection_risk.name: "疑似感染的社区中危表现复核"
  p2.protocol.infection_risk.applies: "成人家庭分诊，今天问诊为疑似感染，NEWS2 低但需要对照社区中危表现"
  p2.protocol.infection_risk.excludes: "未疑似感染、NEWS2 为 0 或已有更早急性条款者不适用"
  p2.protocol.infection_risk.exceptions: "此前急性条款及 NEWS2 条款优先；无中危表现者仍按 R10。"
  p2.protocol.infection_risk.keyword.0: "疑似感染"
  p2.protocol.infection_risk.keyword.1: "中危"
  p2.protocol.infection_risk.keyword.2: "心率"
  p2.protocol.infection_risk.keyword.3: "呼吸频率"
  p2.protocol.infection_risk.keyword.4: "收缩压"
  p2.protocol.infection_risk.keyword.5: "体温"
