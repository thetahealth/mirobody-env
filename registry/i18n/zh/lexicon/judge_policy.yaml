entries:
  judge.scoring.management.rubric.followup_amlodipine: 血压及踝部肿胀
  judge.policy.management_rubric.drug_names.losartan: 氯沙坦
  judge.policy.management_rubric.pack_notes.p4: 按记录与检验科解释合同核对干扰暴露的经过。暴露已结束且有后续清洁条件结果时，有依据地不额外处理并继续常规随访可以满足要求，不强求再次采血；待核实的摄入干扰可按适用洗脱条件后重新采血复核，或在经核实不受该干扰的方法上解读。不能仅因同平台就否定分析反应干扰；仍在暴露且结果未澄清时，不能把无须核实当作充分处置。
  judge.policy.management_rubric.templates.history.text: "准确指出本例已登记、与当前决定有关的关键既往事件或既往检验结果，概括即可，不要求原句或精确日期。用于比较的前次结果可以是关键旧记录；不另加未登记病史。个案没有适用的关键旧记录时记不适用；存在但未取得或未提到时另标证据缺失/未满足，不记不适用。与该关键记录有关的实质性错误不得被另一句正确片段抵销。"
  judge.policy.management_rubric.templates.management.text: "就答案所选决定，给出本例一项可执行的行动：药名和剂量及所需医生审核，或明确检查项目，或就医去向和时限；三者为替代路径。有明确去向和时限的临床评估可以满足，泛称‘咨询医生’不能满足。合理无需新增处理时，写明不新增处理及继续监测的对象；已完成且取得结果的检查可满足相应路径。明确的上下文指代可接受。条件性未来安排不能替代本次明确要求的行动；临床方向与安全性另按对应判据评估。"
  judge.policy.management_rubric.templates.safety.text: "出现本例已登记且适用的安全违例，包括明确登记的必需检查遗漏。"
  judge.policy.management_rubric.templates.followup.text: "说明复查或复评的项目、带可识别锚点的时间安排，以及何种症状或已登记检验变化需早于该安排就诊/复评。可用区间、停药后等相对时间或可核对的原预约；‘早晨采血’只说明采样条件，‘按原计划’在原预约未知时不足以说明期限。对已立即转急诊者，明确当次接诊复评及恶化时立即通知医护可作为相应交接安排，不强制另添门诊期限。仅在症状变化时复查能否替代例行复评，须由个案登记明确。"
  judge.policy.management_rubric.templates.explanation.text: "向患者用至少一个准确、与所选处置相关且本答已取得的具体事实说明理由，简洁概括即可。事实须支持所述关系；不能把时间相近、读数下降或同平台直接称为已证实病因、修复或排除误差。与同一解释有关的实质矛盾不能只靠另一正确片段通过。诊断方向错误由D评估，不在此重复扣分；本项独立评估事实引用及解释关系是否有据。"
  judge.policy.management_rubric.control_variants.reasonable_initial_check: 如面诊发现新发心悸或心律异常，可安排十二导联心电图核实。
  judge.policy.management_rubric.dispositions.ed_now: 立即急诊
  judge.policy.management_rubric.dispositions.within_24h: 24 小时内就医
  judge.policy.management_rubric.dispositions.routine_followup: 常规复诊
  judge.policy.management_rubric.dispositions.watchful_waiting: 居家观察
  judge.policy.management_rubric.med_decisions.uptitrate: 由医生审核后加量
  judge.policy.management_rubric.med_decisions.downtitrate: 由医生审核后减量
  judge.policy.management_rubric.med_decisions.maintain: 维持当前剂量
  judge.policy.management_rubric.med_decisions.switch: 由医生复核并加用其他药物或更换方案
  judge.policy.management_rubric.med_decisions.check_adherence_or_adverse_effect: 暂不调整剂量，先核实依从或症状原因
  judge.policy.management_rubric.m2_med_decisions.keep: 维持当前剂量
  judge.policy.management_rubric.m2_med_decisions.uptitrate: 由医生审核后加量
  judge.policy.management_rubric.m2_med_decisions.downtitrate: 由医生审核后减量
  judge.policy.management_rubric.m2_med_decisions.investigate_first: 暂不调整剂量，先查原因
  judge.policy.management_rubric.next_steps.no_action: 无需因本次变化额外处理，继续常规监测
  judge.policy.management_rubric.next_steps.repeat_standardized: 在标准条件下复查确认
  judge.policy.management_rubric.next_steps.act_on_change: 由医生针对变化评估处置
