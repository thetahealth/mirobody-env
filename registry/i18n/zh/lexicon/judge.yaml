  judge.scoring.llm_rubric.build_prompt.2: '你在核对一份临床推理作答。**只回二值,不要打分、不要给档位。**

    对下面每一个问题回 true / false;**判不了就回 null**(不要猜,不要折成 false)。


    ## 金标(供对照)

    '
  judge.scoring.llm_rubric.build_prompt.3: '


    ## 待核对的作答(已剔除过程记录与结论字段)

    '
  judge.scoring.llm_rubric.build_prompt.4: '


    ## 逐条回答

    '
  judge.scoring.llm_rubric.build_prompt.5: '


    ## 输出格式(严格 JSON,不要别的)

    {"<得分点名>": {"value": true|false|null, "why": "<一句话理由>"}, ...}

    ⚠️ `why` 是给人审阅的,**不参与计分**;不要为了让理由好看而改 value。

    '
