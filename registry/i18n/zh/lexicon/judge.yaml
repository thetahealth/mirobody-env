  judge.scoring.management.judge._v6_task.1: '核心决定正确性由代码判，不在质量条目再次扣分。概括但事实正确的解释满足；具体时间间隔满足跟进要求，不能仅因给出天数扣分。

    '
  judge.scoring.management.judge._v6_task.2: '核心决定正确性由代码判，不在质量条目再次扣分。点出关键旧事件即可，无须精确日期；概括正确的本例事实解释满足。

    时间可为区间或相对安排（如2–4周、下次复诊、落实所选处置后）；复查项目写出名称即可；管理方案不要求引用规程编号。

    '
  judge.scoring.management.judge._v6_task.3: 'evidence只能逐字摘自BEGIN UNTRUSTED ANSWER_JSON内作答字符串，不能摘自本例相关事实、病例或规程，也不能改写或拼接。省略请用……标记，省略号两侧每一段都必须来自作答；遗漏无引文时留空。

    '
