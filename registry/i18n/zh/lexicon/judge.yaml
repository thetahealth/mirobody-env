  judge.scoring.management.precision.add_precision.2: '本例检查精确性只对照以下带出处的清单，不能因列检查名或数量多而扣分。前提必须由本例可见资料或方案明确建立，不能推断未提供的心律诊断、风险、病情稳定或上次检查日期。

    不常规推荐清单：'
  judge.scoring.management.precision.add_precision.3: 无独立禁止项。
  judge.scoring.management.precision.add_precision.4: '

    允许的初始检查：'
  judge.scoring.management.precision.add_precision.5: 未登记本家族初始检查；不把未列项目当作禁止。
  judge.scoring.management.precision.add_precision.6: '

    慢病监测：'
  judge.scoring.management.precision.add_precision.7: 无本例适用的已登记间隔。
  judge.scoring.management.precision.add_precision.8: '

    本条不要求安排上述初始检查或监测。针对本次问题的初始检查、按间隔常规监测、写明交由接诊医生判断是否需要的检查均不扣分；明确已经安排违规检查后再说由医生执行不免扣。只有安排了清单中符合全部前提的不推荐检查，或明确无新指征且早于适用间隔的同项常规重复监测，才判contradicted；最低监测频次不是最短间隔，资料不足以证明重复也不扣分。否则有本次实际处置即satisfied；没有任何处置（空答、纯读数或泛泛遵医嘱）即unmet。'
  judge.scoring.management.precision.add_precision.9: 本次处置按上述安排执行；检查遵循本例适应证及慢病监测计划。
