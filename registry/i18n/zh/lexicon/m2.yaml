  m2.confirm.ecg.negative: 症状出现时采集十二导联心电图10秒：窦性心律，规则P波，RR间期规则，未记录到房颤。本次阴性不能排除其他时段阵发性心律失常。
  m2.confirm.psg.report: 规范多导睡眠监测，呼吸事件由睡眠专科复核；阴性且持续高度怀疑时需考虑复评。
  m2.confirm.biliary_us.positive: 空腹胆囊超声：腔内可移动强回声伴后方声影，胆囊壁增厚，探头局部压痛；结合当前病程评估。
  m2.confirm.biliary_us.negative: 空腹胆囊超声：未见结石，胆囊壁不厚，无周围积液，超声Murphy征阴性；持续症状应复评其他病因。
  m2.confirm.depression.positive: 临床访谈：过去至少两周几乎每日持续低落及兴趣减退，伴睡眠、精力、注意和自我评价改变，工作及家庭功能明显受损；未发现躁狂或轻躁狂史，需按此次症状持续时间与功能损害制定治疗和随访。
  m2.confirm.depression.negative: 临床访谈：睡眠和精力随当日压力波动，无连续两周大部分时间的心境低落或兴趣丧失，主要功能保留；分次处理睡眠与生活压力并随访。
  m2.confirm.cxr.positive: 胸部正侧位X线：右下肺新发局灶气腔实变伴支气管充气征，结合咳嗽发热考虑感染性浸润，需随访吸收情况。
  m2.confirm.cxr.negative: 胸部正侧位X线：未见局灶浸润或实变，无胸腔积液；如持续发热、气促或症状加重应复查。
