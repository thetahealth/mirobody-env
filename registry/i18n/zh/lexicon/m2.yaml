  m2.surface.exercise_inactive.0: 训练始于初次采血之后，初次采血前没有运动；当时短暂胃肠不适，现已好转。同实验室复查如下，原先异常的原因仍待厘清。
  m2.surface.exercise_inactive.1: 首次抽血时还未开始训练，之后才有上述运动；采血前曾短期胃肠不适，随后恢复。下列为同实验室复查，不能据此确定初次异常病因。
  m2.surface.exercise_inactive.2: 运动发生在第一次采血以后，不能解释此前结果。第一次采血前短暂胃肠不适现已缓解，同实验室复查见下，原因尚未完全明确。
  m2.surface.exercise_inactive.3: 初次化验之前未运动，所述训练在其后开始；那次采血前的胃肠不适已恢复。同实验室复查列于下方，先前异常仍需查因。
  m2.surface.fasting_active.0: 初次采血前吃过东西，但报告仍列空腹参考范围；之后依空腹要求重新采样，结果如下。
  m2.surface.fasting_active.1: 原标本采于非空腹状态，报告上的参考区间却为空腹值；后来已按要求空腹重采，列于下方。
  m2.surface.fasting_active.2: 第一次抽血没有空腹，原报告仍采用空腹范围；按空腹要求再采的结果见下。
  m2.surface.fasting_active.3: 首次送检的是非空腹标本，原单未更换空腹参考区间；随后空腹重新留样，复查列于下方。
