entries:
  p2.reading.protocol: >-
    NEWS2 按最新一组完整的同期测量评分，并使用病历授权的 SpO2 量表。核对自动回执的时间及输入值；较早回执不代表后续复测的评分。
    问诊勾选仅记录病人当时勾选的答案。今天患者叙述或设备事件备注中任何符合限定条件的紧急症状，即使未勾选也计入；这些记录中需要他人协助恢复的低血糖事件同样计入。头部碰撞、全身新发不适、疑似感染、剧烈头痛或视物异常的叙述也同样计入。设备记录可附导入的临床摘录：须先匹配有日期的病历索引，再使用其中的诊断、氧疗授权、处方日期或基线评估。
  p2.reading.tick_note: 以下答案为病人原始勾选，另需阅读今天的患者叙述及设备事件备注。
  p2.reading.infection: 今天新出现了一些可能是感染的症状。
  p2.reading.head: 今天绊了一下碰到头，一直清醒，没有吐。
  p2.reading.unwell: 今天新出现全身不适，发冷，嗓子疼。
  p2.reading.excerpt: 导入的临床摘录；请核对病历索引和原始记录日期。
