entries:
  p3.rule.safety_course: 调药前同时核对当前控制指标、实际服药、症状起病与现状及既往耐受剂量。有需要处理的不良反应或控制指标过低时，先处理用药安全，不能因服药不足而继续原方案。已缓解的孤立症状不能视为当前持续不良反应；格列齐特低血糖发作即使缓解仍须复评。
