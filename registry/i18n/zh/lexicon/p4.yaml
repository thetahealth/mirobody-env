  p4.contract.true_change: true_change：患者体内被测量的持续水平或临床过程发生改变；有时间、方向及病程证据支持，不把测定干扰当作体内药理作用。
  p4.contract.noise: analytic_biological_noise：分析不精密度及个体内随机波动；在无相符的采样、方法或临床来源证据且状态稳定时使用。RCV评价统计幅度，不能单独证明来源。
  p4.contract.preanalytical: preanalytical：检测前的患者准备、摄入、采样条件、运送与标本处理改变可比性；短暂运动或时段差也属本任务的采样条件。摄入物造成体外测定干扰时，与method_difference均可接受。
  p4.contract.method_difference: method_difference：方法、平台、试剂批次的系统差别，或经验证的分析反应干扰；需要该项目、日期和方法适用的证据。仅出现方法名称或换平台通知不能确定来源。
  p4.contract.sources: 类别依据：CLSI EP07第3版Scope（外源/内源化学干扰）、CLSI EP09 Scope（患者标本方法比对）、EFLM-COLABIOCLI静脉采血建议Patient preparation、Fraser 2012 Reference change values（PMID 21958344）；摄入物干扰另参FDA生物素安全通告及AACC 2020建议（doi:10.1093/jalm/jfz010）。类别重叠与短暂采样条件归类是本任务约定，待临床复核。
  p4.contract.next: 下一步必须作答。repeat_standardized包括适当洗脱后新采血复查，或改用经核实不受影响的方法解读；no_action表示无需为这次历史差异额外处置，常规随访继续。摄入物干扰仅影响上次读数、本次为标准读数时，按上次失真处理，可选no_action；影响本次读数时，暴露已结束且已有后续清洁结果可选no_action，仍在暴露须核实。
  p4.notice.commutable_comparison.2: 患者标本在两套检测条件下同期测定；比对数值仅用于所列日期和平台、批号。
  p4.notice.commutable_comparison.3: 本次登记患者样本的并行检测结果；先核实适用项目与启用时间，再解释报告差别。
  p4.notice.commutable_comparison.4: 比对使用可交换的患者标本；所列差值对应文件中的方法及试剂批号，不外推至其它批次。
  p4.notice.historical_batches.2: 归档文件记录当时使用的检测系统和批号，须按有效日期与本次报告分别核对。
  p4.notice.historical_batches.3: 这是早期批次的使用登记；平台、试剂和有效期间保留在各字段内。
  p4.notice.historical_batches.4: 旧方法文件随原报告归档，其适用时间与检测条件以记录字段为准。
  p4.event.biotin_ended: 已停用所列补充剂，后续清洁条件复核结果见检验记录。
  p4.event.biotin_ongoing: 本次回顾就诊仍在服用所列补充剂；既往复核曾按记录临时停用，近期又已恢复。
  p4.followup.case.ingested_ongoing: 摄入物测定干扰影响本次读数，暴露仍在且待核实：按适用方法洗脱后复查，或使用不受影响的方法
  p4.followup.case.ingested_ended: 摄入物测定干扰影响本次读数，但暴露已结束且有后续清洁结果