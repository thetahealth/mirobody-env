  p4.rule.meat_meal: 熟肉在采血前1–4小时；两日前餐食不解释当日变化。
  p4.rule.infusion_sampling: 同侧正在输生理盐水且采血在输液点近心侧；对侧采血不受此污染影响。
  p4.rule_head.infusion_sampling: 同侧正在输生理盐水且采血在输液点近心侧
  p4.rule.hemolysis: 钾报告游离血红蛋白超过该方法已验证界限；正常指数或其它项目不据此判断钾释放。
  p4.rule_head.hemolysis: 钾报告游离血红蛋白超过该方法已验证界限
  p4.rule.edta_contamination: 从含K-EDTA管转移血液至生化管，有转移记录及异常低钙支持；仅采血管顺序异常不足以诊断。
  p4.rule_head.edta_contamination: 从含K-EDTA管转移血液至生化管，有转移记录及异常低钙支持
  p4.rule.cold_delayed_separation: 未分离细胞的标本冷藏并延迟分离；分离后的血浆冷藏不据此认定钾外漏。
  p4.rule_head.cold_delayed_separation: 未分离细胞的标本冷藏并延迟分离
  p4.rule.nonfasting: 两次采血前进食状态不一致，近期餐食会影响血糖/TG；不把常规非空腹TG称为错误，解释的是条件改变。
  p4.rule.glucose_glycolysis: 普通未分离全血室温放置2–4小时；柠檬酸缓冲抑制管或30分钟内分离时不据此判定糖酵解。
  p4.rule_head.glucose_glycolysis: 普通未分离全血室温放置2–4小时
  p4.rule.recent_exercise: 采血前1–7日不习惯的高强度抗阻运动与短暂CK/ALT释放；三周前运动不解释新变化，持续损伤另归体内水平改变。
  p4.rule.sampling_time: TSH早晨与下午时段不同，可有昼夜节律差；时段一致时不凭存在下午记录定性。
  p4.rule_head.sampling_time: TSH早晨与下午时段不同，可有昼夜节律差
  p4.rule.platform_calibration: 报告平台不同，适用文件中可交换患者标本比对有同向偏移；无差异的平台互换不命名来源。
  p4.rule.reagent_lot: 同方法不同试剂批号，适用患者标本比对支持同向偏移；已核实无差异的新批号不命名来源。
  p4.rule.jaffe_enzymatic_switch: 肌酐Jaffe与酶法不同且适用患者标本比对支持差异；不假定所有Jaffe恒高或恒差固定百分比。
  p4.rule.biotin_tsh: 10mg生物素后1–5小时且本次使用经核实敏感的链霉亲和素-生物素夹心TSH法，读数可偏低；无此架构的平台或72小时后不据此认定。
  p4.rule.acei_start_or_stop: 有适应证的ACEI起用/停用发生在两次报告之间；稳定用药不能解释新差。肌酐升幅≤30%首选按适应证风险复查，不自主停药。
  p4.rule.dehydration: 两次采血间新发脱水或补液恢复并有病程支持；已恢复很久的旧腹泻不作用。
  p4.rule.thiazide: 有高血压适应证的噻嗪利尿剂起用后钾下降，医生停用后恢复；稳定剂量不能解释新变化。
  p4.rule.gastrointestinal_loss: 新发持续腹泻/呕吐或医生治疗后的恢复改变钾水平；旧已恢复事件无效。
  p4.rule.glucocorticoid: 近期医生起用长效全身糖皮质激素后血糖升高，停用后回落；局部用药或两次前已停用的短程不作用。
  p4.rule.acute_illness: 采血间新发发热感染应激或恢复有病程支持；已恢复的旧感染不解释本次血糖变化。
  p4.rule.thyroiditis: 门诊记录FT4与TSH相符的甲状腺炎甲减阶段或恢复；没有病程/伴随结果不得仅用TSH差值命名。
  p4.rule.thyroxine_adherence: 有甲减治疗记录，漏服或恢复服药持续至少6周，FT4方向支持；很久以前的漏服不作用。
  p4.rule.hepatotoxic_drug: 处方后相符时间窗有持续肝酶变化及医生排除其它常见原因的记录；单有药名不能诊断药物性肝损伤。
  p4.rule.alcohol_change: 数周饮酒量变化与ALT或TG方向相符；一次旧聚餐不足以归因。
  p4.rule.statin_myopathy: 已有适应证，用药后新发持续肌症状及CK升高有时间关系且排除剧烈运动；旧稳定用药不是充分病因。
  p4.rule.muscle_injury: 有持续外伤肌损伤或其恢复记录；短暂采血前运动状态另按规程归采样条件。
  p4.rule.fibrate_adherence: 有高TG适应证，数周漏服或恢复用药与TG相符；旧稳定用药不解释新差。

