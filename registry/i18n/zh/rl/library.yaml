  Can you help me plan meals for a busy week? I usually skip lunch.: 能帮我规划一下忙碌一周的饭菜吗？我经常不吃午饭。
  ? 'Sure. Batch-cook two simple dishes at the weekend, for example a vegetable chilli and a tray of roast vegetables with
    chicken, and portion them into containers. Keep easy lunches in reach: wholegrain wraps, hummus, eggs, fruit and a handful
    of nuts. Even a small lunch helps you avoid a big snack later in the afternoon.'
  : 当然可以。周末集中做两道简单的菜，比如一锅蔬菜辣豆汤和一烤盘烤蔬菜配鸡肉，分装到饭盒里。再备些方便的午餐：全麦卷饼、鹰嘴豆泥、鸡蛋、水果和一小把坚果。哪怕午饭吃得少一点，也能避免下午晚些时候大吃零食。
  Is it fine to go for my morning walk when it's this cold?: 这么冷的天，早上还适合出去散步吗？
  ? Yes, with sensible layers. Wear a hat and gloves, warm up indoors for a few minutes first, and choose well-lit routes
    without ice. If the wind is bitter, a shorter walk later in the day still counts.
  : 可以，注意多穿几层。戴上帽子和手套，先在室内热身几分钟，选择光线好、没有结冰的路线。如果风特别刺骨，改在白天晚些时候走一小段也同样算数。
  How do I move an appointment I can't make next week?: 下周有个预约去不了，怎么改期？
  ? Most practices let you change it in the online portal or app under appointments; otherwise phone reception and ask for
    the next available slot. Cancelling early frees the slot for someone else.
  : 大多数诊所可以在网上门户或 App 的“预约”栏目里改期；也可以打电话给前台，约下一个可用时段。尽早取消还能把号源让给别人。
  What's a good stretch for a stiff neck after a long drive?: 长途开车后脖子僵硬，有什么好的拉伸动作？
  ? 'Try slow chin tucks: sit tall, draw your chin straight back, hold for five seconds and repeat ten times. Then gently
    tilt each ear toward the shoulder for twenty seconds. Take a short break every couple of hours on long drives.'
  : 试试慢速收下巴：坐直，把下巴水平向后收，保持五秒，重复十次。然后轻轻把耳朵向同侧肩膀倾斜，每侧保持二十秒。长途开车时每隔两三个小时休息一下。
  Any tips for sleeping when the evenings are so light?: 傍晚天这么亮，有什么帮助入睡的办法吗？
  ? Blackout curtains or an eye mask help most. Keep a regular bedtime and wake time, dim the lights an hour before bed,
    and keep screens out of the bedroom. A cool, quiet room makes a big difference.
  : 遮光窗帘或眼罩最管用。保持固定的上床和起床时间，睡前一小时调暗灯光，卧室里不放电子屏幕。凉爽、安静的房间会有很大帮助。
  I'd like to get back into cycling. How should I start?: 我想重新开始骑自行车，该怎么起步？
  ? Start with short, flat rides of 20 to 30 minutes two or three times a week, and add a little each week. Get the bike
    checked, set the saddle height so your knee is slightly bent at the bottom of the pedal stroke, and wear a helmet and
    bright clothing.
  : 先从平路短途骑行开始，每次 20 到 30 分钟，每周两三次，之后每周稍微增加一点。先把车检修一下，调好座垫高度，让脚蹬踩到最低点时膝盖略微弯曲，并戴好头盔、穿颜色鲜亮的衣服。
  Can you suggest a few healthy snacks to keep at work?: 能推荐几样适合放在办公室的健康零食吗？
  ? 'Good options that keep well: a small handful of unsalted nuts, fruit, oatcakes with peanut butter, plain yoghurt, or
    carrot and pepper sticks with hummus. Keeping them in your bag makes the vending machine less tempting.'
  : 这些都方便保存：一小把无盐坚果、水果、燕麦饼配花生酱、原味酸奶，或胡萝卜条、彩椒条配鹰嘴豆泥。把它们放在包里，自动售货机就没那么诱人了。
  How can I start gardening again after the winter without hurting my back?: 冬天过后想重新开始打理花园，怎样才能不伤到腰背？
  ? Warm up with a short walk, kneel on a pad rather than bending from the waist, and switch tasks every 20 minutes. Use
    a wheelbarrow for heavy loads and lift with your knees bent, keeping the load close to your body.
  : 先散步几分钟热身，跪在护膝垫上干活，不要弯腰；每 20 分钟换一种活儿。重物用手推车运，搬东西时屈膝，让重物贴近身体。
  I'm going away for a few days by train. Any tips for a comfortable trip?: 我要坐火车出去玩几天，有什么让旅途更舒适的建议吗？
  ? Book a seat if you can, get up and walk the carriage every hour, and keep water and a snack with you. A small cushion
    for your lower back and comfortable shoes help on longer journeys.
  : 能订座就订座，每小时起身在车厢里走一走，随身带水和零食。长途旅行时，一个垫在腰后的小靠垫和一双舒适的鞋会很有帮助。
  How do I see my upcoming appointments in the online portal?: 怎么在网上门户里查看我接下来的预约？
  ? Log in and open the appointments section; upcoming bookings are listed with date, time and clinician. Many portals also
    let you add them to your phone calendar or turn on text reminders.
  : 登录后打开“预约”栏目，即将到来的预约会列出日期、时间和接诊医生。很多门户还能把预约添加到手机日历，或开启短信提醒。
  I'm going away for two weeks. How should I pack my {med}?: 我要出门两周，{med}该怎么打包？
  ? Keep your {med} in your hand luggage in its original packaging, with a copy of your repeat slip, and pack a few extra
    days' supply in case of delays.
  : 把{med}放在随身行李里，保留原包装，带上一份续方单复印件，并多带几天的量以防延误。
  Where is the best place to keep my {med} at home?: '{med}在家放在哪里最好？'
  ? Somewhere cool and dry, out of direct sunlight and out of reach of children; a bathroom cabinet is often too humid.
    Check the leaflet in the pack for anything specific to your {med}.
  : 放在阴凉干燥处，避免阳光直射，并放在儿童够不到的地方；浴室柜通常太潮湿。也可以看看包装里的说明书，了解{med}有没有特别的储存要求。
