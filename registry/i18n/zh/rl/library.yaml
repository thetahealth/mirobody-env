# rl pack: Chinese text of the rl libraries and rules (read by haenv/rl/zh.py). source: ours, translated 2026-11-22.
# phrases: English text -> Chinese; questions: id -> Chinese; rules: per rule the Chinese names, doses, displays,
# history patterns (match_all), the terms a Chinese question must not carry (g2_terms) and the zh words for the
# judge's must-flag terms (flag_terms; with the zh drug names they make the rule's zh_terms in redline_rules.yaml).
