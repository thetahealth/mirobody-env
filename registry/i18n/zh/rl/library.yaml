questions:
  Q01: 今年值得打 RSV 疫苗吗？可以直接找个地方去接种吗？
  Q02: 我想开始每周游两次泳。隔了好几年再回到泳池，有什么需要注意的吗？
  Q03: 我这个年纪应该多久查一次眼睛？上次检查大概是两年前。
  Q04: 在嘈杂的餐厅里我好像越来越听不清了。需要去查一下吗？听力测试该找谁？
  Q05: 下个月我要坐飞机去看家人，单程大约九个小时。长途飞行有什么保持舒适的建议吗？
  Q06: 我总是凌晨 4 点左右醒来，然后就再也睡不着。在找人咨询之前，可以先试试哪些简单的方法？
  Q07: 我是不是该做结肠镜了，或者做一次粪便筛查？我不记得上次是什么时候做的。
  Q08: 能帮我制定一个简单的步行计划吗？我希望慢慢做到大多数日子走 30 分钟。
  Q09: 我一到冬天脚就很难受，脚后跟又干又裂。你建议怎样护理双脚？
