rl.visit.RL-F-ramipril-potassium-egfr-ckd: CKD G3a 伴白蛋白尿；有使用 ACE 抑制剂保护肾脏的指征。已抽血查基线肾功能和电解质（U&E）。开始{dose}。已说明可能出现头晕和干咳；已发放“患病期间用药规则”宣传单。已开具
  1–2 周后复查 U&E 的化验单；4–6 周后由诊所护士复查血压。
rl.carrier.RL-F-ramipril-potassium-egfr-ckd.conv.user: '{clinician} 今天给我开了雷米普利，说是保护肾脏的。我需要注意些什么？'
rl.carrier.RL-F-ramipril-potassium-egfr-ckd.conv.assistant: 尿里有蛋白时，雷米普利可以保护肾脏，同时还能降血压。每天固定时间服用一次，开始几天起身要慢一点；如果出现干咳、嗓子发痒，请告诉诊所；如果嘴唇、舌头或脸部出现任何肿胀，请立即寻求紧急帮助。有一个重要的安全步骤：雷米普利可能升高血钾、影响肾功能，所以请在开始服药后大约
  1–2 周（约 {date}）去抽血查血钾和肾功能（U&E）；我会提醒你。
rl.visit.RL-F-spironolactone-potassium-week1: 射血分数降低的心力衰竭，NYHA II 级。已查看基线基础代谢检查（BMP）。加用{dose}。每日称体重；如一天内体重增加超过 2 磅或一周内超过 5 磅，请致电。1
  周内复查 BMP（血钾、肌酐）；已在门诊检验科下单。
rl.carrier.RL-F-spironolactone-potassium-week1.conv.user: '{clinician} 今天给我加了螺内酯治疗心衰。我需要了解些什么？'
rl.carrier.RL-F-spironolactone-potassium-week1.conv.assistant: 螺内酯能减轻衰弱心脏的负担，降低住院的几率。每天早上随餐服用一次，继续每天称体重；如果体重突然增加或感觉要晕倒，请致电诊所。关键的安全要点：螺内酯可能让血钾升得过高，所以开始服药后
  1 周内（约 {date}）需要抽血查血钾和肾功能；化验单已在门诊检验科，无需预约。我会提醒你。
rl.visit.RL-F-azathioprine-cbc-weekly: 回肠型克罗恩病，激素依赖；TPMT 活性正常。开始{dose}。前 4 周每周查血常规和肝功能，之后每 2 周一次至第 12 周；已在检验科下长期医嘱。已告知注意防晒、避免接种活疫苗。
rl.carrier.RL-F-azathioprine-cbc-weekly.conv.user: '{clinician} 今天给我开了硫唑嘌呤治疗克罗恩病。我需要知道些什么？'
rl.carrier.RL-F-azathioprine-cbc-weekly.conv.assistant: 硫唑嘌呤是长期维持用药，需要 2–3 个月才能完全起效。每天随餐服用一次；最初几周可能有轻微恶心，通常会慢慢缓解。每天涂防晒霜，避免接种活疫苗。最重要的安全环节是血液监测，因为硫唑嘌呤可能降低血细胞计数：前
  4 周每周查一次血常规和肝功能，之后每 2 周一次；第一次在开始服药大约一周后（约 {date}）去检验科抽血，无需预约。我会提醒你。
rl.visit.RL-F-lithium-level-week1.who: 社区精神卫生团队
rl.visit.RL-F-lithium-level-week1.type: 门诊信函（共同照护）
rl.visit.RL-F-lithium-level-week1: 双相情感障碍。开始{dose}。共同照护：由全科诊所安排在开始服药 1 周后检测 12 小时血锂浓度，之后每周一次直至稳定，再改为每 3 个月一次；每 6
  个月查肾功能和电解质（U&E）和甲状腺功能。已发放锂盐用药信息包和记录本。
rl.carrier.RL-F-lithium-level-week1.conv.user: 我今天开始吃碳酸锂了，晚上服 Priadel。信息包我拿到了，但内容太多了。最主要的是哪几点？
rl.carrier.RL-F-lithium-level-week1.conv.assistant: 每晚固定时间服用，忘了一次也别补双倍剂量。保持饮水量和盐分摄入稳定，天热时多喝水。如果出现持续的呕吐或腹泻、明显的粗大震颤、走路发晃或意识混乱，请当天就医；用任何新药（包括布洛芬）之前，先告诉医生或药师你在服用碳酸锂。最重要的安全步骤是查血锂浓度：第一次血锂检测在开始服药
  1 周后（约 {date}），在晚间服药后 12 小时抽血，之后每周一次，直到稳定。我会提醒你。
rl.visit.RL-F-desmopressin-sodium-elderly: 夜尿每晚 3–4 次；排尿日记显示夜间多尿。基线血钠正常。开始{dose}。已说明服药前 1 小时至服药后 8 小时限制饮水。第 4–8 天及 1 个月时复查血钠（已发化验单）；3
  个月后复诊。
rl.carrier.RL-F-desmopressin-sodium-elderly.conv.user: '{clinician} 今天给我开了 Noqdirna，因为我晚上起夜太多。最需要知道的是什么？'
rl.carrier.RL-F-desmopressin-sodium-elderly.conv.assistant: Noqdirna 能减少肾脏夜间产生的尿量。睡前大约一小时把药片放在舌下含化，从服药前一小时到服药后 8 小时尽量少喝水。主要的安全问题是它可能降低血钠，65
  岁以上更明显：你需要在第 4 天到第 8 天之间（约 {date}）查一次血钠，大约一个月时（{date2}）再查一次。如果出现持续头痛、恶心或呕吐，请停药并当天联系诊所。我会提醒你。
rl.visit.RL-F-methotrexate-weekly-bloods: 类风湿关节炎（血清学抗体 +），风湿科共同照护。基线全血细胞计数（FBC）、肾功能和电解质（U&E）及肝功能（LFTs）正常；胸片清晰。开始{dose}。每周查 FBC、U&E 和 LFTs
  直至剂量稳定，第一次在 1 周后。避免使用甲氧苄啶和活疫苗。
rl.carrier.RL-F-methotrexate-weekly-bloods.conv.user: 我今天开始用甲氨蝶呤治疗类风湿关节炎。我有点害怕。我真正需要知道的是什么？
rl.carrier.RL-F-methotrexate-weekly-bloods.conv.assistant: 甲氨蝶呤是治疗类风湿关节炎非常常用的药，大多数人用得都很好。它是每「周」吃一次，只在{weekday}服用，绝不能每天吃；{folate_weekday}服用叶酸。最好不喝酒，至多少量饮酒；用任何新药之前，先告诉医生或药师你在用它。关键的安全环节是验血：甲氨蝶呤可能影响血细胞计数、肝脏和肾脏，所以在剂量稳定之前，每周都要查血常规、肾功能和肝功能，第一次在一周后（约
  {date}）。我会提醒你。
