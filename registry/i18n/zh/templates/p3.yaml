p3.rule.adherence: 本院依从性判定：按取药记录（提前取药的余量顺延计入；加量当天换新规格发药，旧规格余药不再计入）与今天的药盒计数估算最近 {window} 天（开始用药不足 {window} 天的，自开始用药日起）的服药覆盖率，低于 {pct}% 视为依从不足；控制指标未达标而依从不足时，暂不调整剂量，先核实服药情况。
p3.rule.interval: 本院复评间隔：该药加量（或开始用药）后约 {tau} 天疗效才充分显现；加量（或开始用药）后 {half} 天内复查读数仍未达标，属疗效尚未显现，不据此判定加量无效。
