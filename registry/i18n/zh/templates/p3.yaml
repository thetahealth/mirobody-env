p3.rule.absorption: '左甲状腺素与碳酸钙应间隔约 {hours} 小时；控制不佳且同服时，维持当前剂量，先核实服法并处理吸收干扰后复查，不立即加量。TSH 在目标内而症状仍持续时，维持剂量并先调查其他原因。已缓解的孤立症状不能当作当前持续症状；格列齐特相关低血糖发作即使已进食缓解仍须复评。'
p3.rule.top_check: "本院{name}剂量上限：已用到本院最高剂量（{top} {unit}）而{axis}仍未达标时，不再加量也不换药，维持当前剂量，先核查服药依从性、服法、吸收障碍（如胃肠疾病）及合用药影响。"
