entries:
  一个喷嚏把后背闪了,当时刺痛: I sneezed and pulled my back. There was a sharp pain at the time
  一到下午三四点就饿得发慌,心慌,吃块饼干十分钟就好: Around three or four in the afternoon I get desperately hungry and my heart races.
    A biscuit puts it right within ten minutes
  一发作血压就猛地升到220/120,过去了就正常: During an episode my blood pressure shoots up to 220/120, then goes back to normal
  一天清早怎么叫都叫不醒,家人喂了糖水才醒,头天晚饭只吃了一点: One morning my family could not wake me until they gave me sugar water. I had
    eaten very little the previous evening
  一天要喝好多水,小便也比以前多: I drink a lot of water every day and pass more urine than before
  一年来脸色身上都变暗了,不怎么晒也一样,那方面兴趣也少了: Over the past year my face and skin have darkened even without much sun. I have
    less interest in sex too
  一心慌就觉得头晕,坐着能缓一缓: I feel dizzy when my heart races. Sitting down eases it
  一早起床咳点白痰,过了就没事: I cough up a little white phlegm first thing in the morning, then I am fine
  一早起床就喷嚏不断,流清鼻涕,鼻子里痒痒的: I wake up sneezing constantly, with a clear runny nose and an itchy feeling inside
  一早醒来后脑勺沉沉的,下床动一动半小时左右才缓过来: The back of my head feels heavy on waking. It takes about half an hour moving around
    to clear
  一爬楼就心里慌,停下来好一些: My heart races when I climb stairs. Stopping helps
  一直按减重方案在做: I have kept following the weight-loss plan
  一碰冷手指先发白,接着发紫,暖和过来又变红,还又麻又疼: In the cold my fingers turn white, then purple. They turn red as they warm up, with
    numbness and pain
  一站起来就有点晕,坐下好些: I feel a little dizzy on standing. Sitting helps
  一走动就喘,比平常厉害: I get more breathless than usual when I move around
  一阵一阵剧烈头疼,同时心慌、出一身大汗: I get bouts of severe headache with a racing heart and drenching sweats
  一顿辣的下去,胃里烧得难受了一会儿: After a spicy meal my stomach burned uncomfortably for a while
  三个月来口渴尿多,单位体检说血糖高: I have been thirsty and passing lots of urine for three months. My work health check found
    high blood sugar
  上午没吃东西的时候心慌手抖,说话前言不搭后语,吃点东西十几分钟就好了: Without food in the morning my heart races, my hands shake and I talk nonsense.
    Food puts it right in ten or so minutes
  上午翻资料的时候不小心,右手食指被纸边划了道小口子: While looking through papers this morning I accidentally cut my right index finger
    on an edge
  上厕所的次数有变化,自己也说不准是什么原因: How often I go to the toilet has changed. I cannot say why
  上厕所的次数有变化，自己也说不准是什么原因。: How often I go to the toilet has changed. I cannot say why.
  上同样的楼梯,现在得多停几次: I need more stops on the same stairs now
  上周去海边玩,在户外晒了一整天,这两天后背开始脱皮了: I spent a whole day outdoors at the seaside last week. My back has started peeling
    these past two days
  上周在外面晒了太阳,后背这几天开始脱皮,洗澡能搓下来: After being in the sun last week my back has started peeling. It rubs off in the shower
  上唇与下颌细软毛变粗、变多: The fine hair on my upper lip and chin has become coarser and more plentiful
  上嘴唇和下巴的细毛这阵子变得又粗又多: The fine hairs above my lip and on my chin have recently become thicker and more numerous
  上楼时觉得心慌,休息后能缓一点: My heart races upstairs. Rest eases it a little
  上楼梯以后膝盖前面隐隐地疼,走平路倒没事: The front of my knee aches after stairs, but walking on the flat is fine
  上次剪脚趾甲剪得太短了,边上嵌进肉里,穿鞋一压就疼: I cut my toenail too short last time. The edge digs into the skin and hurts when my
    shoe presses on it
  上消化道溃疡或穿孔等急腹症亦可有相似疼痛；需急诊查体、脂肪酶及适当影像综合判断。: Upper gastrointestinal ulceration, perforation and other acute abdominal
    conditions may cause similar pain; assess with an emergency examination, lipase and appropriate imaging together.
  上班一整天都戴着口罩,下班摘下来的时候耳朵后面压得疼: I wore a mask all day at work. When I took it off, it was sore behind my ears from
    the pressure
  上礼拜在外面晒了一天,这两天后背开始掉皮: After a whole day outside in the sun last week, my back has started peeling these past two
    days
  上腹一下子疼起来,持续疼,休息没缓解: The upper part of my tummy suddenly started hurting and has kept hurting. Rest has not helped
  上腹一直闷闷地疼,偶尔窜到背上,蜷着身子会轻一些: There is a constant dull pain high in my tummy, sometimes reaching my back. Curling
    up helps a little
  上腹疼痛连到背上: The pain high in my tummy goes through to my back
  上腹的痛牵到背部: The upper tummy pain pulls through to my back
  上腹突然持续疼痛,休息也没缓解: Sudden, constant upper tummy pain, with no relief from rest
  上腹部持续隐痛向腰背部放射,近一周明显加重,夜间痛醒: A constant dull upper abdominal pain spreads to my lower back. It has worsened markedly
    over the past week and wakes me at night
  上边肚子疼的时候背也被牵着疼: When the top of my tummy hurts, my back hurts along with it
  上边肚子突然一直痛,歇着也不好: The top of my tummy suddenly began hurting all the time. Rest does not help
  上述训练在第一次抽血之后才开始；第一次抽血前并未运动。该次采血前有短期胃肠不适，后已恢复；同实验室复查见下，原异常原因未完全确定。: This training only started after the first
    blood draw; there was no exercise beforehand. Brief gastrointestinal symptoms before that draw have since resolved.
    Repeat testing at the same laboratory is below; the original cause remains incompletely determined.
  上述进食是在复查采血之后，不能解释之前的读数。第一次标本的登记注明急性胃肠不适恢复期；恢复后空腹重采见下。: The reported meal was after repeat sampling and cannot
    explain earlier readings. The first specimen was registered during recovery from acute gastrointestinal symptoms;
    fasting resampling after recovery follows.
  下午三四点特别容易饿、心慌,吃块饼干十分钟就好: Around three or four in the afternoon I get very hungry and my heart races. A biscuit
    fixes it in ten minutes
  下午三四点特别饿,心里慌,吃点饼干就缓过来了: I get very hungry and my heart races around three or four in the afternoon. Some biscuits
    settle it
  下午容易累,偶尔看字发糊: I tire in the afternoon and sometimes words look blurred
  下午整理一摞旧资料,指尖被上面的订书钉划了一下: While sorting a stack of old papers this afternoon I scratched my fingertip on a staple
  下午那会儿老是饿得心慌,垫块饼干一会就没事: I keep getting so hungry in the afternoon that my heart races. A biscuit settles it after
    a little while
  下嘴唇里面长了个口腔溃疡,一吃辣的就疼: I have an ulcer inside my lower lip that hurts whenever I eat something spicy
  下巴一圈爱冒痘: I keep getting spots around my chin
  下巴刮破了: I cut my chin
  下巴周围总是长痘,刚好又冒新的: Spots keep coming up around my chin, with new ones appearing just as others clear
  下巴那一圈老是长红肿的痘,好了又长: I keep getting red, swollen spots around my chin. They clear and then come back
  下楼梯一脚踩空,右脚踝扭了: I missed a step downstairs and twisted my right ankle
  下楼梯踩空了一下,右脚踝扭到,这两天有点酸: I missed a step going downstairs and twisted my right ankle. It has ached these past two
    days
  下楼没看清台阶踩空了,右脚踝扭了一下,脚脖子那块一直酸酸的: I did not see a stair and missed my footing, twisting my right ankle. It has kept
    aching there
  下腹和大腿内侧出了紫红色的纹,皮肤一碰就青,胳膊腿使不上劲: I have purple-red lines on my lower tummy and inner thighs, bruise at a touch,
    and have little strength in my arms and legs
  下雨天骑车上班,拐弯的时候车子侧滑摔倒了,膝盖擦破一块皮: My bicycle slid on a turn going to work in the rain. I fell and grazed my knee
  下颌这边的痘反反复复,一长就是红肿的: The spots around my jaw keep coming back, red and swollen each time
  不知道怎么回事人瘦了很多: I have lost a lot of weight without knowing why
  两侧肩臂也酸,活动时更明显: Both shoulders and arms ache too, more when I move
  两侧肩臂酸疼,活动时感觉重一些: Both shoulders and arms feel sore, especially with movement
  两只手两只脚都发麻,像针扎一样: Both hands and feet feel numb and prickly
  两只手和两只脚都发麻,像针扎一样,两边一样: Both hands and feet are numb and feel like pins and needles, equally on both sides
  两只眼睛又干又涩,怕光,看东西雾蒙蒙的,点人工泪液也不太管用: Both eyes are dry and gritty, light bothers them and things look misty. Artificial
    tears barely help
  两只脚踝都肿,鞋穿着变紧了: Both ankles are swollen and my shoes feel tighter
  两条大腿都酸疼,没有明显伤到: Both thighs ache, without any obvious injury
  两条小腿前面起了几个红疙瘩,按着疼,两周左右自己颜色变暗消了: I got a few tender red lumps on the fronts of both lower legs. After about two
    weeks they darkened and went away by themselves
  两条腿肿,一按一个坑,动一动就喘: Both legs are swollen and keep a dent when pressed. Moving about makes me breathless
  两次 FT4 均在本实验室参考范围内；没有使用生物素补充剂。一次轻度 TSH 升高不能确认持续的甲状腺功能异常。: Both FT4 results were within this laboratory's reference
    range; no biotin supplements were being used. One mildly raised TSH cannot establish persistent thyroid dysfunction.
  两边大腿一样酸痛,没什么明显外伤: Both thighs ache equally, with no obvious injury
  两边大腿酸痛,没有明显外伤: Both thighs ache, without any clear injury
  两边肩膀和手臂都酸,动的时候更明显: Both shoulders and arms ache, more noticeably when moving
  两边脚踝都肿了,鞋子比以前紧: Both ankles have swollen and my shoes are tighter than before
  两边脸蛋连着鼻梁发红,怕晒太阳: My cheeks and the bridge of my nose are red, and the sun bothers them
  两餐中间要加点东西才不难受,半年下来体重涨了五公斤: I need snacks between meals to feel all right. Over six months I have gained five kilograms
  中午跟同事去吃了顿火锅,点的特辣,吃完胃里火烧火燎了一阵: I had an extra-spicy hotpot with colleagues at lunchtime. My stomach burned for
    a while afterwards
  为了不难受在两顿饭之间吃点东西,结果半年长了十斤: I eat between meals to avoid feeling unwell and have gained ten jin in six months
  乏力一天比一天重: I feel weaker day by day
  乏力和胃肠不适可伴睡眠情绪问题、短期胃肠病或内分泌异常；须按病程和检查综合判断。: Fatigue and gastrointestinal discomfort may accompany sleep or mood
    problems, short gastrointestinal illnesses or endocrine abnormalities; assess the course and investigation results
    together.
  五官变粗了,鼻子嘴唇厚了,汗特别多: My features have become coarser, my nose and lips thicker, and I sweat a lot
  人在瘦,不是故意的,另外老心慌,手也抖: I am losing weight without trying, and my heart keeps racing and my hands shake
  人很乏,一整天都没什么精神: I feel worn out, without energy all day
  人没力气,上楼梯的时候腿软: I have no strength, and my legs feel weak on stairs
  人瘦了,还时不时一阵阵心里发慌害怕: I have lost weight and sometimes suddenly feel my heart racing and feel frightened
  人越来越乏,最近更明显了: I am getting increasingly tired, especially lately
  今天小便明显比平常少: I am passing much less urine than usual today
  今天小便比平时少很多: I have passed far less urine than usual today
  今天尿量比往常少了很多: Today I have passed much less urine than I normally do
  今天穿了双薄底鞋出去散步,脚底被路上的小石子硌了一下: I went for a walk in thin-soled shoes today and a little stone hurt the sole of my
    foot
  从暖和的屋里走到外面,一吸冷空气就忍不住咳一两声: When I leave a warm room, breathing cold air makes me cough once or twice
  从椅子站起来比以前费力: Getting up from a chair takes more effort than before
  以前做得完的家务,现在要多歇几回: I need more breaks doing housework I used to manage
  以前崴过的脚踝,一变天就酸: An ankle I sprained before aches when the weather changes
  以前的戒指套不上,鞋也得买大一码: My old rings no longer fit, and I need shoes a size bigger
  体检说血钙有点高,最近也老口渴、尿多: My health check found slightly high calcium. I have been thirsty and passing a lot of urine
    too
  体重、精力和排便变化也可能随睡眠、饮食、药物或其他甲状腺病因出现；需甲功及必要的病因检查。: Changes in weight, energy and bowel habits can also occur with
    sleep, diet, medicines or other thyroid causes; thyroid function and, if needed, investigation of the cause
    are required.
  体重掉了,经常莫名其妙地紧张、害怕,像要出事: I have lost weight and often feel inexplicably nervous and afraid, as if something bad
    is about to happen
  体重掉了六公斤,没刻意减,也没加运动量: I have lost six kilograms without trying to lose weight or doing more exercise
  体重明显下降,我并没有刻意减: I have lost a lot of weight without trying
  体重最近变了,吃饭和活动也不太规律: My weight has changed recently, and my eating and activity have been irregular
  体重最近变了，吃饭和活动也不太规律。: My weight has changed recently, and my eating and activity have been irregular.
  体重涨了: I have gained weight
  例假老是推迟,隔四十多天才来: My periods keep coming late, more than forty days apart
  例假量大、好多天不干净,饮食清淡血脂却偏高,脑子反应变迟钝: My periods are heavy and last ages. Despite eating lightly my blood fats are high,
    and my thinking has slowed
  修剪阳台花草的时候小臂被枝条划伤了,划了一道红印子: While trimming balcony plants, a branch scratched my forearm and left a red line
  修眉毛时刀片划了一下,眉边破了点皮: I nicked the skin beside my eyebrow with the blade while tidying my eyebrows
  做原来的事比以前累,需要更多休息: My usual tasks tire me more and I need more rest
  做平常的活动更费力,需要多休息: My normal activities take more effort and I need extra rest
  做深呼吸的时候胸部有些痛: My chest hurts a little when I take a deep breath
  做饭的时候吸了油烟,呛咳了一阵: I inhaled cooking fumes while cooking and coughed for a while
  偶尔呼吸有声音,能在胸里听到: Sometimes I can hear a noise in my chest when I breathe
  偶尔手脚一下子没力气,坐一会才缓过来: Sometimes my arms and legs suddenly feel weak, then recover after sitting for a while
  偶尔觉得胸里呼吸有响声: Sometimes there is a noise in my chest as I breathe
  傍晚两边脚踝有些肿,袜口勒出印子: Both ankles are a little swollen by evening, with marks from my socks
  光是肚子腰上长肉,胳膊腿倒变细了: I am gaining fat just round my waist and tummy while my arms and legs get thinner
  入秋以后嘴唇干裂,涂了润唇膏过一会儿又干了: My lips have been dry and cracked since autumn began. Lip balm helps only briefly before
    they dry again
  关门把手指夹了: I trapped my finger closing a door
  关门没注意夹到手指,指甲盖底下青了一小块: I caught my finger closing the door without looking. There is a small bruise under the nail
  冬季与空调房内均出现: Occurs both in winter and in air-conditioned rooms
  冰啤酒下肚以后肚子疼了一阵: My tummy hurt for a while after an ice-cold beer
  冰啤酒喝得太猛了,肚子里隐隐地疼,坐着揉了一会儿: I drank cold beer too fast and had a dull tummy ache. I sat rubbing it for a while
  冰的喝多了,肚子隐隐痛了半个钟头: I drank too much cold drink and my tummy ached dully for half an hour
  冰箱里剩的菜舍不得扔,热了热吃了,结果拉了一次肚子: I did not want to throw away leftovers, so I reheated and ate them. I had diarrhoea
    once afterwards
  冷空气吸进去就呛咳一两声: I cough once or twice when I breathe cold air in
  冷风一呛就咳嗽两下: A cold breeze catches my breath and makes me cough a couple of times
  几个月以来反复咳嗽,还会咳痰: I have had a recurring cough with phlegm for several months
  几个月来总容易累,休息了也没全好: I have tired easily for several months and rest does not fully help
  几个月来散步越来越费劲,走的也少了: Walking has become harder over several months and I take fewer walks
  几个月来胃口变差一点,吃得少了: My appetite has been a little worse for several months and I eat less
  几周来很容易累,平常那段路也走不远: I have tired very easily for weeks and cannot walk far along my usual route
  几次都在饭后很久还吐出了吃过的食物: Several times I have brought up food long after eating it
  出门一吸冷风就咳一两声: When I go outside, breathing cold air makes me cough once or twice
  出门前赶时间修眉毛,刀片划了一下,眉毛边上破了点皮: I hurried to tidy my eyebrows before going out and nicked the skin beside one with
    the blade
  出门的时候着急关门,把手指夹了一下,指甲下面青了一块: I caught my finger hurrying to close the door on my way out. There is a bruise under
    the nail
  刚剪完头发,脖子后面发痒,忍不住老去挠: Since my haircut the back of my neck has itched. I keep wanting to scratch it
  别人说我眼睛像瞪着看人,眼皮往上缩,月经也少了: People say my eyes look as if I am staring and my eyelids are pulled up. My periods are
    lighter too
  刮胡子不小心把下巴刮了个口子: I accidentally cut my chin shaving
  刮胡子的时候手一抖,下巴刮破了一点,贴了个创可贴: My hand slipped shaving and I nicked my chin. I put a plaster on it
  刮腿毛的时候把小腿刮破了个小口子: I made a small cut on my lower leg while shaving it
  到了傍晚两只脚踝有点肿,袜子勒出印: Both ankles swell a little by evening and my socks leave marks
  刷牙的时候突然想吐,漱完口就好了: I suddenly felt like being sick while brushing my teeth. It stopped after rinsing my mouth
  前两天说话说得多,嗓子开始疼,到现在咽口水还有点痛: After a lot of talking two days ago my throat started hurting. Swallowing saliva still
    hurts a little
  前天下楼梯踩空,右脚踝扭到了,走路的时候那一块还有点酸痛: I missed a step downstairs the day before yesterday and twisted my right ankle.
    It still aches a little when walking
  前天打喷嚏太猛,后背闪了一下,当时刺痛,睡了一晚第二天好多了: I sneezed hard the day before yesterday and pulled my back, with a sharp pain
    then. It was much better after a night's sleep
  前天骑车压到路上的沙子,车一滑摔倒了,膝盖擦破了一块皮: The day before yesterday my bicycle slid on sand and I fell, grazing my knee
  剪头发后脖子痒: My neck itches after a haircut
  剪完头发没洗干净,碎头发掉进衣领里,脖子后面痒得难受: After my haircut, loose hair left in my collar made the back of my neck very itchy
  功能性消化不良和胃出口机械梗阻也可有餐后饱胀恶心；应排除梗阻并按规范完成固体餐胃排空测定。: Functional dyspepsia and mechanical gastric outlet obstruction
    can also cause post-meal fullness and nausea; exclude obstruction and perform a standard solid-meal gastric
    emptying test.
  化验尿发现有酮体: My urine test found ketones
  午饭后一小时特别犯困,不趴下眯会儿撑不住: About an hour after lunch I get so sleepy I have to put my head down for a nap
  半年内第二次发作: Second episode within six months
  半年胖了,这两周严格少吃主食还天天运动,体重基本没降: I have gained weight over six months. Two weeks of strictly cutting down starchy food
    and exercising daily have barely changed it
  半年里体重一直涨,两周控碳水加锻炼几乎没掉: My weight has kept rising for six months. Two weeks cutting carbohydrates and exercising
    have hardly brought it down
  单位体检说我血钙偏高,这段时间特别能喝水,尿也多: My work health check found high calcium. Lately I have been drinking lots of water and
    passing lots of urine
  单位电梯坏了,爬了几天楼,膝盖前面隐隐作痛,平地走倒是不疼: The lift at work broke and I used the stairs for a few days. The front of my knee
    aches, but walking on the flat is painless
  单纯脂肪变性和其他肝病可有相似乏力；普通超声不能代替有效弹性成像及病因评估。: Simple steatosis and other liver conditions may cause similar fatigue;
    routine ultrasound cannot replace valid elastography and assessment of the cause.
  卧床休息不缓解: Bed rest does not relieve it
  原发性雷诺现象、其他结缔组织问题亦可有手指和消化道不适；需结合甲襞毛细血管和免疫检查。: Primary Raynaud phenomenon and other connective tissue problems can
    also cause finger and gastrointestinal symptoms; assess with nailfold capillaroscopy and immunological tests.
  厨房窗户没开,炒菜吸了不少油烟,站在灶台边上咳了一阵: The kitchen window was shut and I breathed in a lot of cooking fumes. I stood coughing
    by the hob for a while
