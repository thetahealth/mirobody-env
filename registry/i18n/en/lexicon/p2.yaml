  p2.policy.infection_medium_risk: "R10b Suspected infection on today's intake checklist, NEWS2 1–4 with no individual score of 3, and any NICE medium-risk sign on today's home check (heart rate 91–130/min, respiratory rate 21–24/min, systolic BP 91–100 mmHg, temperature below 36.0 °C) → face-to-face medical assessment within 24 hours to reach a diagnosis and decide whether care outside hospital is safe; routine follow-up or watchful waiting alone is not enough. Low-NEWS2 infection without these signs stays under R10."
  p2.protocol.infection_risk.name: "Review of community medium-risk signs in suspected infection"
  p2.protocol.infection_risk.applies: "Adult home triage with suspected infection on today's intake checklist and low NEWS2, requiring review against community medium-risk signs"
  p2.protocol.infection_risk.excludes: "Does not apply without suspected infection, with NEWS2 of 0, or when an earlier acute rule applies"
  p2.protocol.infection_risk.exceptions: "Earlier acute and NEWS2 rules take precedence; cases without medium-risk signs remain under R10."
