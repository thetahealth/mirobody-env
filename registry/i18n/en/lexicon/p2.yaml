entries:
  p2.med.bb: Bisoprolol 5 mg once daily
  p2.med.bb2: Metoprolol modified-release 47.5 mg once daily
  p2.med.insulin: Insulin glargine by subcutaneous injection every evening
  p2.med.su: Glimepiride before breakfast daily
  p2.med.furosemide: Furosemide 20 mg once daily
  p2.med.amlodipine: Amlodipine 5 mg once daily
  p2.med.metformin: Metformin twice daily
  p2.med.sglt2i: Dapagliflozin 10 mg once daily
  p2.say.open.calm.0: It's probably nothing serious. I just thought I'd ask.
  p2.say.open.calm.1: I could be overthinking it. I don't want to trouble anyone.
  p2.say.open.calm.2: My family insisted I ask, but I feel all right.
  p2.say.open.calm.3: It's nothing urgent. Could you have a look when you have time?
  p2.say.open.calm.4: I feel okay myself. I just want to make sure.
  p2.say.open.neutral.0: I'd like some advice about how things have been lately.
  p2.say.open.neutral.1: I'm sending the last few days' readings to ask for your advice.
  p2.say.open.neutral.2: There's something that's been happening lately that I'd like to ask about.
  p2.say.open.neutral.3: Could you look at my recent records?
  p2.say.open.neutral.4: I'd like to tell you how things have been these last few days.
  p2.say.open.alarming.0: I'm really worried. Could something be seriously wrong?
  p2.say.open.alarming.1: These readings make me so anxious I can't sleep.
  p2.say.open.alarming.2: I'm frightened. Could it be serious?
  p2.say.open.alarming.3: My family all say something's wrong, and I don't know what to think.
  p2.say.open.alarming.4: The more I look at this, the more anxious I get. I didn't sleep well all night.
  p2.say.close.calm.0: It should get better with a bit of rest, shouldn't it?
  p2.say.close.calm.1: It'll probably be better in a couple of days.
  p2.say.close.calm.2: I reckon I've just been tired lately.
  p2.say.close.calm.3: If need be, I'll keep an eye on it a little longer.
  p2.say.close.neutral.0: I'd like to know what to do next.
  p2.say.close.neutral.1: Please have a look for me.
  p2.say.close.neutral.2: I'd appreciate your advice.
  p2.say.close.neutral.3: I can give you more information if you need it.
  p2.say.close.alarming.0: What should I do?
  p2.say.close.alarming.1: Please, could you help me look at this?
  p2.say.close.alarming.2: The more I think about it, the more frightened I get.
  p2.say.close.alarming.3: Do I need to go to hospital straight away?
  p2.say.lead.0: I'm sending my records. Please have a look.
  p2.say.lead.1: My home measurements and watch records are below.
  p2.say.lead.2: I'd like to ask what to do about these records.
  p2.say.lead.3: Here are all the readings. Could you take a look?
  p2.say.lead.4: I've put together all my records from the last few days.
  p2.say.lead.5: I'm not sure whether these numbers are anything to worry about.
  p2.say.mild.af.0: Over the last couple of days, I've sometimes felt my heart racing and beating unevenly.
  p2.say.mild.af.1: Lately I sometimes feel my heart going thump-thump.
  p2.say.mild.af.2: These past few days my heartbeat keeps feeling uneven.
  p2.say.mild.any.0: I cough a little now and then, and my throat feels a bit uncomfortable.
  p2.say.mild.any.1: I've had a bit of a cough lately.
  p2.say.mild.any.2: My throat has felt a bit dry and tickly these last couple of days.
  p2.say.mild.any.3: I've got a bit of a runny nose and it's blocked up.
  p2.say.mild.any.4: I've had a bit of a cough these last couple of days, with little phlegm.
  p2.say.mild.any.5: My throat's a bit sore, but otherwise I'm okay.
  p2.say.mild.any.6: I feel a bit tired, and my throat's not quite right either.
  p2.say.symptom.chest_pain_or_pressure.calm.0: "My chest suddenly went tight this afternoon and it still hasn't eased after nearly half an hour; I expect it'll settle if I rest."
  p2.say.symptom.chest_pain_or_pressure.neutral.0: "About an hour ago my chest suddenly started to feel as if something was pressing on it, and it hasn't let up since."
  p2.say.symptom.chest_pain_or_pressure.alarming.0: "All of a sudden there's an awful pressure on my chest. It's been over twenty minutes and it isn't easing at all."
  p2.say.symptom.chest_pain_or_pressure.atypical.0: My chest feels tight, I keep breaking out in a cold
    sweat, and I feel a bit sick.
  p2.say.symptom.fainted.k.0: When I got up this morning, everything went black and I passed out briefly.
    I came round quickly.
  p2.say.symptom.fainted.k.1: I suddenly passed out while using the toilet today. My family helped me
    up.
  p2.say.symptom.new_confusion.k.0: My family say I haven't been making sense when I talk today.
  p2.say.symptom.new_confusion.k.1: My family say I've been a bit muddled today and mistook someone for
    somebody else.
  p2.say.symptom.breathless_at_rest.k.0: Even when I'm sitting still, I feel I can't get enough air.
  p2.say.symptom.breathless_at_rest.k.1: I feel short of breath even lying down. At night I have to prop
    myself up on pillows.
  p2.say.symptom.one_sided_weakness_or_slurred_speech.k.0: My right hand feels too weak to hold my chopsticks,
    and my speech is a bit slurred.
  p2.say.symptom.one_sided_weakness_or_slurred_speech.k.1: My left arm and leg feel weak, and one side
    of my mouth is drooping a little.
  p2.say.symptom.r_htn_symptom.k.0: I've got a really bad headache, and my vision's a bit blurred.
  p2.say.symptom.r_htn_symptom.k.1: The back of my head is aching badly, and things look blurry.
  p2.say.symptom.r_dizzy.k.0: I've felt a bit dizzy when I stand up these last couple of days.
  p2.say.symptom.r_dizzy.k.1: Sometimes I feel a bit dizzy.
  p2.say.symptom.r_dizzy.k.2: My head feels a bit muzzy.
  p2.say.symptom.r_hypo_help.k.0: My blood sugar went low one night a few days ago. I only felt better
    after my family gave me sugar water.
  p2.say.symptom.r_hypo_help.k.1: My blood sugar went low in the middle of the night a couple of days
    ago. I was all muddled, and my partner gave me sugar.
  p2.hist.test.echo_specialist: Echocardiography and specialist assessment
  p2.hist.test.abg_oxygen: Inpatient arterial blood gas and oxygen assessment at discharge
  p2.hist.test.prior_diagnosis: Previous outpatient diagnosis record
  p2.hist.result.hf_history: Reduced cardiac function; findings and history consistent with heart failure.
  p2.hist.result.hf_symptoms: Reduced cardiac function; findings and symptoms consistent with heart failure.
  p2.hist.result.af_controlled_followup: Atrial fibrillation with good ventricular rate control; symptoms
    unchanged on follow-up.
  p2.hist.result.af_controlled: Atrial fibrillation with good ventricular rate control; no change in clinical
    status at that follow-up.
  p2.hist.result.hf_normal: Normal cardiac function; no evidence of heart failure.
  p2.hist.result.sinus_pac: Sinus rhythm with no atrial fibrillation; the earlier irregular pulse was
    due to premature atrial beats.
  p2.hist.result.sinus_pac_no_af: Sinus rhythm with premature atrial beats; no atrial fibrillation.
  p2.hist.result.hypercapnia_target: Blood gas confirmed hypercapnic respiratory failure; oxygen saturation
    target documented by clinical staff.
  p2.hist.result.hypercapnia_excluded: Suspected hypoventilation; repeat blood gas showed no hypercapnic
    respiratory failure. Clinical staff retained the standard oxygen saturation scoring scale.
  p2.ctx.result.rx_continued: Prescription continued; take as previously prescribed.
  p2.ctx.result.rx_ended: Previous prescription ended; no further use thereafter.
  p2.ctx.result.chemo_ongoing: Systemic treatment administered for this cycle; treatment remains ongoing.
  p2.ctx.result.chemo_ended: Systemic treatment course completed and repeat blood counts recovered; not
    currently receiving further treatment.
  p2.ctx.result.hypercapnia_target: Blood gas confirmed hypercapnic respiratory failure; oxygen saturation
    target documented by clinical staff. Usual finger oximeter readings within target.
  p2.ctx.result.copd_no_scale2: COPD follow-up; blood gas did not confirm hypercapnic respiratory failure.
    No authorisation for scale two.
  p2.ctx.result.brady_stable: ECG shows sinus bradycardia, assessed clinically as longstanding and stable,
    without related symptoms. Previous follow-up plan continued.
  p2.ctx.result.brady_recovered: Sinus bradycardia during previous medication use resolved after withdrawal
    of the rate-lowering medicine; subsequent repeated heart rates within the recheck range.
  p2.ctx.result.af_confirmed: ECG-confirmed atrial fibrillation with controlled ventricular rate and ongoing
    follow-up; symptoms and exercise tolerance unchanged.
  p2.ctx.result.sinus_pac: ECG shows sinus rhythm with premature atrial beats; atrial fibrillation not
    documented.
  p2.ctx.result.hf_documented: Heart failure documented on echocardiography and specialist assessment;
    follow-up ongoing.
  p2.ctx.result.hf_diuretic_reduced: Volume status reassessed after discharge for heart failure. Previous
    diuretic dose reduced as instructed by the clinician; continue daily morning weight records.
  p2.ctx.test.med_reconciliation: Medication reconciliation
  p2.policy.relative_hypotension: 'R3d Suspected infection today, with a verified usual systolic pressure
    in the record and a reliable current systolic pressure more than 40 mmHg below usual: immediate emergency
    assessment even if still above 90 mmHg and NEWS2 is low. Do not apply without a baseline or for nonspecific
    symptoms alone.'
  p2.ctx.result.usual_pressure: Usual systolic pressure verified at clinic against home cuff readings;
    the value is recorded in this entry. See home measurements for the current blood pressure series.
  p2.ctx.test.pressure.0: Review of home and clinic blood pressure measurements
  p2.ctx.test.pressure.1: Blood pressure follow-up record
  p2.ctx.test.pressure.2: Review of previous baseline blood pressure
  p2.complaint.blister.0: I got a little blister on my palm from gripping a tool while doing housework;
    it gradually dried up afterwards
  p2.complaint.blister.0.context: Repeated friction on the palm during housework; use of the tool stopped
  p2.complaint.blister.1: Sandals rubbed a little blister on the top of my foot; it improved with a soft
    dressing
  p2.complaint.blister.1.context: Shoe upper rubbed the top of the foot; no further friction after changing
    shoes
  p2.complaint.blister.2: I got a blister on the side of my toe after a long walk; changing socks and
    resting helped
  p2.complaint.blister.2.context: Friction on the toe while walking; no redness, swelling or pus from
    the blister
  p2.complaint.blister.3: Garden shears rubbed a little blister beside my thumb; it has been closing up
    since I stopped using them
  p2.complaint.blister.3.context: Repeated friction from a hand tool on the thumb; local recovery progressing
  p2.complaint.blister.4: I got a little blister at the base of my index finger from sweeping with a broom;
    it no longer hurts
  p2.complaint.blister.4.context: Broom handle rubbed the finger; symptoms eased with reduced friction
  p2.complaint.blister.5: I got a blister on the outside of my little toe from stiff leather shoes; it
    has gradually healed since I changed to wider shoes
  p2.complaint.blister.5.context: Pressure and friction from shoes on the little toe; no signs of infection
  p2.complaint.ankle_sprain.0: I twisted my ankle on uneven ground while out walking; it has improved
    with rest
  p2.complaint.ankle_sprain.0.context: Mild ankle twist while walking; able to bear weight, with pain
    and swelling gradually settling
  p2.complaint.ankle_sprain.1: I twisted my ankle while turning; it hurt a little locally, then settled
  p2.complaint.ankle_sprain.1.context: Twisted ankle while turning; no deformity, with movement gradually
    recovering
  p2.complaint.ankle_sprain.2: I slightly twisted my left ankle stepping off a kerb; I am walking again
    now
  p2.complaint.ankle_sprain.2.context: Ankle twisted at a kerb; recovered with support and rest
  p2.complaint.ankle_sprain.3: My ankle ached after I stepped awkwardly walking in the yard; it eased
    day by day afterwards
  p2.complaint.ankle_sprain.3.context: Mild sprain on uneven ground; no marked swelling developed
  p2.complaint.knee_pain.0: The front of my knee ached after squatting to sort things out; it gradually
    eased when I squatted less
  p2.complaint.knee_pain.0.context: Anterior knee discomfort associated with squatting; subsequently resolved
  p2.complaint.knee_pain.1: The front of my knee hurt a little after kneeling to clean; it eased after
    I stopped
  p2.complaint.knee_pain.1.context: Anterior knee ache after kneeling; no swelling or limitation of movement
  p2.complaint.knee_pain.2: The front of my knee ached after walking on slopes; it gradually eased with
    rest
  p2.complaint.knee_pain.2.context: Anterior knee discomfort after walking on slopes; normal weight bearing
  p2.complaint.knee_pain.3: My knee ached after I suddenly became more active; it recovered when I cut
    back
  p2.complaint.knee_pain.3.context: Mild knee ache after a change in activity level; subsequently recovered
  p2.complaint.eyelid_twitch.0: My right eyelid twitched now and then while I was busy and tired; it stopped
    on its own after I rested
  p2.complaint.eyelid_twitch.0.context: Brief eyelid twitching during fatigue; now resolved
  p2.complaint.eyelid_twitch.1: My eyelid twitched for a while when I was drinking more coffee; since
    I cut down, it no longer twitches
  p2.complaint.eyelid_twitch.1.context: Eyelid twitching during increased caffeine intake; subsequently
    resolved
  p2.complaint.eyelid_twitch.2: My left eyelid twitched a few times when work was stressful; it eased
    when I relaxed
  p2.complaint.eyelid_twitch.2.context: Brief eyelid twitching during stress; no change in vision
  p2.complaint.eyelid_twitch.3: My eyelid kept twitching on and off when I wasn't sleeping much; it got
    better after I caught up on rest
  p2.complaint.eyelid_twitch.3.context: Brief eyelid twitching during insufficient rest; now recovered
  p2.complaint.wrist_strain.0: My wrist ached after repeatedly turning screws; it gradually eased when
    I stopped and rested
  p2.complaint.wrist_strain.0.context: Mild wrist ache after repetitive hand movements; subsequently resolved
  p2.complaint.wrist_strain.1: My wrist ached after a lot of typing; it eased when I adjusted my work
  p2.complaint.wrist_strain.1.context: Wrist discomfort after prolonged keyboard use; improved after reducing
    repetitive movements
  p2.complaint.wrist_strain.2: My forearm and wrist ached after a spell of painting walls; they got better
    afterwards
  p2.complaint.wrist_strain.2.context: Forearm and wrist ache after repetitive decorating movements; now
    resolved
  p2.complaint.wrist_strain.3: My wrist ached after spending a long time doing people's hair; it eased
    when I took a break
  p2.complaint.wrist_strain.3.context: Mild wrist ache after repetitive hairdressing movements; subsequently
    recovered
  p2.complaint.ear_water.0: My ear felt blocked for a short time after a shower; it cleared when the water
    came out
  p2.complaint.ear_water.0.context: Water entered the ear canal during a shower; subsequently recovered,
    with no ear pain or discharge
  p2.complaint.ear_water.1: I felt water sloshing in my ear after swimming; it went away on its own
  p2.complaint.ear_water.1.context: Brief water entry into the ear canal after swimming; no discomfort
    now
  p2.complaint.ear_water.2: My ear felt a bit blocked after water splashed into it while washing my face;
    it cleared once dry
  p2.complaint.ear_water.2.context: Brief blocked sensation after a little clean water entered the ear;
    subsequently recovered
  p2.complaint.ear_water.3: My ear felt uncomfortable briefly after a shower; it gradually settled after
    I dried the outside of my ear
  p2.complaint.ear_water.3.context: Water entered the ear canal while showering; no persistent pain or
    change in hearing afterwards
  p2.complaint.rhinitis.0: My nose got itchy and I kept sneezing while sorting old books; it eased when
    I moved away
  p2.complaint.rhinitis.0.context: Nasal itching and sneezing on exposure to bookshelf dust; subsequently
    resolved
  p2.complaint.rhinitis.1: My nose ran with clear fluid after contact with cat fur; it gradually got better
    when I moved away
  p2.complaint.rhinitis.1.context: Brief nasal discomfort after exposure to animal dander; now resolved
  p2.complaint.rhinitis.2: My nose was itchy and runny outside when there was a lot of pollen; it eased
    indoors
  p2.complaint.rhinitis.2.context: Nasal itching and sneezing on pollen exposure; subsequently resolved
  p2.complaint.rhinitis.3: I kept sneezing while clearing out the store room; it eased after I washed
  p2.complaint.rhinitis.3.context: Clear nasal discharge on dust exposure; no persistent symptoms now
  p2.protocol.priority: Across procedures, apply R0, R0a, R0b, R1, R2, R3a, R3d, R3b, R3c, R3, R4, R5,
    R6, R7a, R7, R8, R9, R10a, R10b, R10, R11, R12, R13, R14 in that order. The first applicable rule determines
    the decision.
  p2.protocol.baseline.excludes: Does not apply if the baseline is unverified or new symptoms develop.
  p2.protocol.baseline.exceptions: Earlier acute rules take precedence.
