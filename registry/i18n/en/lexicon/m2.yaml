  "无统一病理:咳嗽气促待查(舒张后肺功能未见持续气流阻塞),症状持续需复评": "No unifying pathology: cough and breathlessness under investigation (no persistent airflow obstruction on post-bronchodilator spirometry); reassess if they persist"
  "无统一病理:睡眠和情绪不适待查(临床访谈不满足抑郁发作),需随访复评": "No unifying pathology: sleep and mood complaints under investigation (the clinical interview does not meet criteria for a depressive episode); follow up and reassess"
  "无统一病理:日间嗜睡待查(规范睡眠监测未见呼吸暂停),症状持续需复评": "No unifying pathology: daytime sleepiness under investigation (a standard sleep study shows no sleep apnoea); reassess if it persists"
