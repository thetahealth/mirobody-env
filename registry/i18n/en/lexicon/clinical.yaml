  ? 空腹与标本：空腹血糖应确认至少 8 小时未摄入热量，不能仅按早晨采血或报告登记判断。肌酐比较尤其核对肉类餐；采血后才进食不影响已采标本。检查血清/血浆/指尖全血、采样与离心时间、室温放置、溶血指数和报告备注，并查询采样日期时已生效且覆盖该项目的方法与标本规程。酶法肌酐在有关研究的延迟处理中较稳定，动力学
    Jaffe 延迟超过 6 小时可升高；本院当前印出的 6 小时规程是既有合成操作映射，不能将 2 小时等待普遍认作肌酐异常，也不能据此宣称所有项目均稳定 6 小时。血糖未及时分离另有糖酵解风险，按其项目文件处理。
  : 'Fasting and specimens: confirm at least 8 hours without caloric intake for fasting glucose; morning
    sampling or a fasting label alone does not establish this. For creatinine, specifically check meat
    intake; eating after collection cannot affect the collected specimen. Check serum/plasma/finger whole
    blood, collection and centrifugation times, room-temperature storage, haemolysis index and report
    notes. Consult method and specimen protocols effective on the collection date and covering that analyte.
    In the relevant delayed-processing studies, enzymatic creatinine was relatively stable, while kinetic
    Jaffe could rise after more than 6 hours. The current printed local 6-hour policy is an existing synthetic
    operational mapping; a 2-hour wait does not universally establish abnormal creatinine, nor does this
    prove every analyte stable for 6 hours. Delayed glucose separation carries a separate glycolysis risk;
    follow its analyte document.'
