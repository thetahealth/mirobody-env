entries:
  ? "\n· 本题部分数据要**购买**:get_menu 列出可买的项目、价格、预算与余额;order_test(target) 买一项(可在一轮里买多项)。买到的监测流之后也可以用 get_series\
    \ 读。\n  ⚠️ 预算点不全整张菜单 —— 必须挑;超出余额的项目不会执行。菜单里可能有与这位患者无关的项,点了照样计费。\n  ⚠️ 预算用尽而仍未作答,本题按未作答处理。\n  ⚠️ 检查项(菜单\
    \ tests)买过即计入「你开的检查」 —— `tests_to_order` 里只需再填菜单未列的检查。\n  · 结果为「无法提供可解释结果」的项目不是正常或阴性,不能据此排除疾病。"
  : "\n· Some data in this question must be **purchased**: get_menu lists available items, prices, budget\
    \ and remaining balance; order_test(target) purchases an item (multiple items may be purchased in\
    \ one round). Purchased monitoring streams can subsequently be read with get_series.\n  ⚠️ The budget\
    \ cannot cover the whole menu: choose selectively. Items exceeding the remaining balance will not\
    \ be executed. The menu may include items unrelated to this patient; these are still charged if selected.\n\
    \  ⚠️ If the budget runs out before you answer, the question is marked unanswered.\n  ⚠️ Purchased\
    \ investigations (menu tests) already count as \"investigations you ordered\"; in `tests_to_order`,\
    \ include only further investigations absent from the menu.\n  · A result marked \"no interpretable\
    \ result available\" is neither normal nor negative and cannot be used to exclude disease."
  '*低密度胆固醇': '*LDL cholesterol'
  '*甘油三酯': '*triglycerides'
  '*糖化血红蛋白': '*glycated haemoglobin'
  '*葡萄糖': '*glucose'
  '*谷丙转氨酶': '*alanine aminotransferase'
  '*谷草转氨酶': '*aspartate aminotransferase'
  1 型糖尿病患者不适用。: Not applicable to patients with type 1 diabetes.
  1 年内跌倒 ≥ 2 次、受伤需就医、无法自行起身、跌倒时意识丧失或衰弱者，转综合跌倒评估。: Refer for comprehensive falls assessment if there have
    been ≥ 2 falls in 1 year, injury requiring medical care, inability to get up independently, loss of
    consciousness during a fall or frailty.
  1,25-二羟维生素D: 1,25-dihydroxyvitamin D
  10mg生物素后1–5小时且本次使用经核实敏感的链霉亲和素-生物素夹心TSH法，读数可偏低；无此架构的平台或72小时后不据此认定。: Readings may be falsely low 1–5 hours
    after 10 mg biotin when the current TSH assay is a verified susceptible streptavidin–biotin sandwich
    method. Do not infer this on platforms without that architecture or after 72 hours.
  10–15 分钟后复测；仍 < 4.0 mmol/L 则再给一份，最多重复 3 轮；3 轮后仍未恢复，或再次变得迟钝 → 按严重低血糖转急诊。: Recheck after 10–15 minutes.
    If still < 4.0 mmol/L, give another portion, for at most 3 rounds. If not recovered after 3 rounds,
    or responsiveness declines again → emergency department for severe hypoglycaemia.
  12 小时内痛过但已缓解且心电图正常，或末次疼痛在 12–72 小时前 → 当日评估。: Pain within the last 12 hours that has resolved with a
    normal ECG, or last pain 12–72 hours ago → same-day assessment.
  12 岁及以上，以头痛为主诉就诊。: Age 12 years or older, presenting with headache.
  16 岁以下者不适用。: Not applicable below age 16 years.
  17-羟孕酮: 17-hydroxyprogesterone
  1mg地塞米松抑制试验: 1 mg dexamethasone suppression test
  1型: type 1
  2 型糖尿病: type 2 diabetes mellitus
  2 型糖尿病患者不适用，起始药应为 ACE 抑制剂或 ARB。: Not applicable to patients with type 2 diabetes; start with an ACE
    inhibitor or ARB.
  2 型糖尿病成人，正在使用或拟开始二甲双胍。: Adults with type 2 diabetes taking or about to start metformin.
  24h尿游离皮质醇: 24h urinary free cortisol
  24小时尿游离皮质醇(UFC): 24-hour urinary free cortisol (UFC)
  24小时尿钙: 24-hour urinary calcium
  25-羟维生素D: 25-hydroxyvitamin D
  3c型糖尿病: type 3c diabetes mellitus
  4 周内已用过口服激素疗程、或长期口服激素者不适用。: Not applicable after a course of oral corticosteroids in the last 4 weeks
    or during long-term oral corticosteroid therapy.
  48–72 小时内复诊；一年需多个激素疗程者评估骨质疏松预防。: Review within 48–72 hours; assess osteoporosis prevention if multiple
    corticosteroid courses are needed in a year.
  48–72 小时复评，皮疹进展则按上一步升级。: Reassess in 48–72 hours; if the rash progresses, escalate as in the preceding
    step.
  5 分钟内达峰的雷击样头痛，或有新神经功能缺损、意识受损 → 转急诊。: Thunderclap headache reaching maximum intensity within 5 minutes,
    new neurological deficit or impaired consciousness → emergency department.
  50 岁及以上（或衰弱者）近 1 年内跌倒、因跌倒就诊，头部未受外伤。: Age 50 years or older (or frail), with a fall in the last 1 year
    or presenting after a fall, without head injury.
  6 个月内 ≥ 2 次或 12 个月内 ≥ 3 次发作 → 送尿培养并评估诱因。: ≥ 2 episodes in 6 months or ≥ 3 in 12 months → send urine
    culture and assess predisposing factors.
  65 岁以下，TSH 高于参考值但 < 10 mIU/L 两次，且有甲减症状 → 可试用 6 个月，症状无改善则停。: Below age 65 years, TSH above the reference
    range but < 10 mIU/L on two occasions, with hypothyroid symptoms → consider a 6-month trial; stop
    if symptoms do not improve.
  65 岁及以上、TSH < 10 mIU/L 者不常规治疗，只随访。: 'Age 65 years or older with TSH < 10 mIU/L: do not routinely treat;
    follow up only.'
  80 岁以上、有直立性低血压史者，加药前先测站立血压，收缩压低于 110 mmHg 暂不加药。: 'Above age 80 years with a history of orthostatic hypotension:
    measure standing blood pressure before adding medication; defer if systolic pressure is below 110
    mmHg.'
  80 岁以下诊室目标 < 140/90 mmHg，80 岁及以上 < 150/90 mmHg。: Clinic target < 140/90 mmHg below age 80 years; < 150/90
    mmHg at age 80 years or older.
  ACEI 既往最大耐受剂量复评: Review of previously established maximum tolerated ACEI dose
  ACEI 起用前均值取最近一次 ACEI 事件之后至上次比较采血日的停药期读数，无可用读数时以上次读数为基线。: For the pre-ACEI mean, use off-treatment readings
    after the latest ACEI event and up to the previous comparison draw. If none are available, use the
    previous reading as baseline.
  ACEI 起用或停用: ACEI initiation or discontinuation
  ACEI/ARB剂量及高血压已稳定，低风险且肾功能和血钾本周正常，无急性病、共病风险或新指征，仍安排下周常规重复肾功能和血钾。: ACEI/ARB dose and hypertension are
    stable, risk is low and renal function and potassium were normal this week, with no acute illness,
    comorbidity risk or new indication, yet routine renal function and potassium are ordered again next
    week.
  ACEI/ARB起用或加量后按1至2周复查肾功能和血钾；低风险稳定高血压按年度计划复查。: Repeat renal function and serum potassium 1 to 2 weeks
    after starting or increasing ACEI/ARB; review annually in low-risk stable hypertension.
  ACTH+垂体/肾上腺影像: ACTH + pituitary/adrenal imaging
  ACTH兴奋试验: ACTH stimulation test
  ACTH兴奋试验皮质醇反应: cortisol response to ACTH stimulation
  ADA 2025 6.2为至少每年两次；未达标、近期换药、频繁/严重低或高血糖、健康状态变化时可更频繁（如每3个月）。这是最低频次，不单独用于惩罚短间隔，有此类新指征也不按稳定半年条款扣分。: ADA
    2025 6.2 specifies at least twice yearly; testing may be more frequent (e.g. every 3 months) for unmet
    targets, recent medication changes, frequent/severe hypoglycaemia or hyperglycaemia, or health changes.
    This is a minimum frequency, not grounds alone to penalise short intervals. With such new indications,
    do not apply the stable half-yearly rule as a penalty.
  ANA + 抗着丝点抗体/抗Scl-70: ANA + anticentromere antibodies/anti-Scl-70
  AST/ALT/血小板并计算FIB-4: AST/ALT/platelets and FIB-4 calculation
  CKD 进展: CKD progression
  CKD患者如起用或加量RAAS拮抗剂，按1至2周复查eGFR和血钾，异常或新风险时由医生提前监测。: In CKD, repeat eGFR and potassium 1 to 2 weeks after
    starting or increasing a RAAS antagonist; the clinician may monitor earlier for abnormalities or new
    risks.
  CKD患者起用/加量RAAS拮抗剂之前及之后1至2周查eGFR、血钾；异常结果、合用升钾药或急性病可能需要更早/更频繁，不把1至2周当禁止更早检查的硬下界。: In CKD, check eGFR and
    potassium before and 1 to 2 weeks after starting/increasing a RAAS antagonist. Abnormal results, concomitant
    potassium-raising drugs or acute illness may require earlier/more frequent checks; 1 to 2 weeks is
    not a hard lower bound prohibiting earlier testing.
  COPD急性加重在基层管理时不常规送痰培养；住院、脓痰、治疗不改善、需针对病原调整治疗等新指征除外。不能从高碳酸呼衰记录自动推断所有人都有COPD。: Do not routinely send sputum
    culture for COPD exacerbations managed in primary care. New indications such as hospital admission,
    purulent sputum, failure to improve or need for pathogen-directed treatment are exceptions. Do not
    infer COPD in every patient with hypercapnic respiratory failure.
  COPD急性加重本次在基层管理，无治疗失败等新指征，仍只为常规筛查送痰培养。: This COPD exacerbation is managed in primary care without a
    new indication such as treatment failure, yet sputum culture is sent solely for routine screening.
  COPD急性加重送医院后按指征查血常规、电解质、心电图及胸片，发热时评估血培养。: After hospital referral for COPD exacerbation, obtain full
    blood count, electrolytes, ECG and chest radiograph as indicated; assess blood cultures with fever.
  COPD急性加重送医院时可查胸片、血气、心电图、血常规、尿素/电解质；脓痰可送痰培养、发热可取血培养，不能因这些名称扣分。: For hospital referral with COPD exacerbation,
    chest radiograph, blood gases, ECG, full blood count and urea/electrolytes may be checked; culture
    sputum if purulent and blood if febrile. Do not penalise these test names.
  CT肺动脉造影: CT pulmonary angiography
  CT肺动脉造影(CTPA): CT pulmonary angiography (CTPA)
  CVA逐项采用EuBIVAS已发表的双份测量实测值，CVI采用EFLM全球估计；不得把CVA称为EFLM统一常数。论文CVA对应研究平台与低浓度范围，例行实验室应使用长期质控值；在本院不同已比对平台间复用此研究CVA是合成简化，尚需检验科评审。: CVA
    uses the published analyte-specific EuBIVAS duplicate-measurement estimates; CVI uses EFLM global
    estimates. Do not describe CVA as a universal EFLM constant. The published CVA corresponds to the
    study platforms and low concentration range; routine laboratories should use long-term quality-control
    values. Reusing this study CVA across different compared local platforms is a synthetic simplification
    requiring laboratory review.
  C反应蛋白: C-reactive protein
  C反应蛋白(CRP): C-reactive protein (CRP)
  C肽: C-peptide
  D-二聚体: D-dimer
  DOAC：每年至少查肾功能、血红蛋白与肝功能。: 'DOAC: check renal function, haemoglobin and liver function at least annually.'
  FIB-4指数: FIB-4 index
  GAD抗体/IA-2抗体: GAD antibodies/IA-2 antibodies
  GLP-1 受体激动剂调量: GLP-1 receptor agonist dose adjustment
  HFE基因检测: HFE genetic testing
  HbA1c/血糖: HbA1c/blood glucose
  HbA1c·空腹血糖(先确认糖尿病本身): HbA1c · fasting glucose (first confirm diabetes itself)
  HbA1c及降糖治疗稳定时每6个月；尚未稳定时按个体需要每3至6个月。仅在稳定状态、距上次测定的间隔及无新指征均明确时，过早安排同项常规重复才扣分；不把首次测定/时间未知的测定当重复。: Measure
    HbA1c every 6 months if the result and glucose-lowering treatment are stable; otherwise every 3 to
    6 months according to individual need. Penalise premature routine repetition of the same test only
    when stability, the previous test interval and absence of a new indication are all established. Do
    not treat initial testing or testing with unknown previous timing as repetition.
  HbA1c和降糖治疗已稳定，刚做完HbA1c，无新指征且不换药，仍安排下周常规重复HbA1c。: HbA1c and glucose-lowering treatment are stable, HbA1c
    has just been measured and there is no new indication or medication change, yet routine HbA1c is ordered
    again next week.
  HbA1c和降糖治疗稳定时按每6个月的慢病计划监测；不稳定时按个体需要每3至6个月复评。: Monitor HbA1c under the chronic disease plan every 6 months
    when the result and glucose-lowering treatment are stable; otherwise reassess every 3 to 6 months
    according to individual need.
  IFCC动力学法: IFCC kinetic method
  IFCC速率法: IFCC rate method
  Jaffe 苦味酸速率法: Jaffe alkaline picrate kinetic method
  Jaffe/酶法比对: Jaffe/enzymatic method comparison
  MIBG(必要时): MIBG (if needed)
  MIBG核素显像: MIBG scintigraphy
  ? NEWS2 适用于年满 16 岁的非妊娠病人。病历中有既往或本次住院血气确认高碳酸呼衰，并由临床人员明确登记目标血氧 88–92% 时使用 SpO2 Scale 2；其余使用 Scale 1。Scale
    2 未吸氧时：≤83% 计 3，84–85% 计 2，86–87% 计 1，≥88% 计 0；吸氧时 88–92% 计 0，93–94% 计 1，95–96% 计 2，≥97% 计 3，低于 88%
    同前。吸氧另加 2 分。其余评分与分诊优先级照原表。
  : 'NEWS2 applies to non-pregnant patients aged 16 years or older. Use SpO2 Scale 2 only when previous
    or current inpatient blood gases confirm hypercapnic respiratory failure and a clinician has explicitly
    recorded an oxygen saturation target of 88–92%; otherwise use Scale 1. Scale 2 on room air: ≤83% scores
    3, 84–85% scores 2, 86–87% scores 1, ≥88% scores 0; on supplemental oxygen: 88–92% scores 0, 93–94%
    scores 1, 95–96% scores 2, ≥97% scores 3; below 88% as above. Add 2 points for supplemental oxygen.
    Other scoring and triage priorities follow the original table.'
  NG115 1.3.1 与 Table 7；1.3.15；1.3.16；1.3.18；NHS 哮喘发作页: NG115 1.3.1 and Table 7; 1.3.15; 1.3.16; 1.3.18;
    NHS asthma attack page
  NICE CG151 §§1.3.1-1.4.1; St George’s 急性肿瘤规程: NICE CG151 §§1.3.1-1.4.1; St George’s acute oncology protocol
  NT-proBNP/心超: NT-proBNP/echocardiography
  OGTT+胰岛素: OGTT + insulin
  OGTT-生长激素抑制试验: OGTT–growth hormone suppression test
  OGTT生长激素抑制试验: OGTT growth hormone suppression test
  R0 问诊清单里任一为「是」:胸痛或胸部压迫感、晕倒、新出现的意识混乱、静息时气促、一侧肢体无力或说话含糊 → 立即急诊。: 'R0 Any positive item in the symptom
    checklist: chest pain or pressure, fainting, new confusion, breathlessness at rest, unilateral limb
    weakness or slurred speech → emergency department immediately.'
  R0a 已有头部外伤，即使当前生命体征正常、无昏迷呕吐，病历确认仍在抗凝治疗 → 立即急诊。本次用药核对确认遵从现行处方，并核对旧处方覆盖日期及停药记录；只有跌倒而未碰头、或抗凝已结束者不触发本条。: R0a
    Head injury with ongoing anticoagulation confirmed in the record, even with normal current vital signs
    and no loss of consciousness or vomiting → emergency department immediately. Today's medication reconciliation
    must confirm adherence to the current prescription and check coverage dates and discontinuation records.
    A fall without head impact or completed anticoagulation does not trigger this rule.
  R0a、R0b 属于急性条款，均优先于 NEWS2；原 R0 症状仍最优先。: R0a and R0b are acute rules and take priority over NEWS2; original
    R0 symptoms retain highest priority.
  R0b 病历确认近 6 周内实际接受系统性抗癌治疗，今天新出现全身不适并有感染相关诉述 → 立即联系肿瘤团队并立即到急诊评估疑似中性粒细胞减少性脓毒症；低热甚至没有高热不能排除。已结束超过 6 周且恢复、仅计划而未给药者不触发。: R0b
    The record confirms actual systemic anticancer treatment within the last 6 weeks, with new systemic
    illness and infection-related complaints today → contact the oncology team immediately and attend
    the emergency department immediately for suspected neutropenic sepsis. Low-grade fever or absence
    of high fever cannot exclude it. Treatment completed more than 6 weeks ago with recovery, or treatment
    planned but not administered, does not trigger this rule.
  R1 按今天的家庭测量算 NEWS2(RCP 2017,SpO2 第 1 表、未吸氧;意识按问诊清单)。NEWS2 ≥ 7 → 立即急诊。: R1 Calculate NEWS2 from today's
    home measurements (RCP 2017, SpO2 Scale 1, on room air; consciousness from the checklist). NEWS2 ≥
    7 → emergency department immediately.
  R10 NEWS2 为 1–4 且无单项 3 分 → 常规复诊或 24 小时内由医生评估均可；持续症状、心衰等共病需结合病历及时复评。: R10 NEWS2 1–4 with no individual
    score of 3 → either routine follow-up or clinician assessment within 24 hours is acceptable; persistent
    symptoms or comorbidities such as heart failure require timely reassessment using the record.
  ? R10a 仅心率带来 NEWS2 1 分（其余参数 0），病历已有心电图及临床评估证实长期无症状窦性慢心率，今日心率仍在已登记基线范围，且无新头晕、晕倒、胸部症状、气促，本次用药核对确认相关药物近期未变化
    → 按原随访计划居家观察。新下降、旧慢心率曾恢复正常、仅病名或未核实基线者不适用；此前急性条款优先。
  : R10a Heart rate alone gives NEWS2 1 point (all other parameters 0), with prior ECG and clinical assessment
    confirming long-standing asymptomatic sinus bradycardia, today's rate within the registered baseline
    range, no new dizziness, fainting, chest symptoms or breathlessness, and today's reconciliation confirming
    no recent relevant medication change → observe at home under the existing follow-up plan. Not applicable
    to a new decline, a decline after previous normalisation, a diagnosis alone or an unverified baseline;
    earlier acute rules take priority.
  R10a 满足时先用稳定基线条款，再考虑 R10；R0 至 R9 的更紧急条款仍优先。: If R10a is met, apply the stable-baseline rule before R10;
    more urgent rules R0 to R9 retain priority.
  R11 糖尿病人近 7 晚有夜间最低值 < 3.9 但都不低于 3.0 mmol/L(ADA 1 级)→ 常规复诊。: R11 Diabetes with overnight minima < 3.9
    but none below 3.0 mmol/L over the last 7 nights (ADA level 1) → routine follow-up.
  R12 今天 ≥ 2 次家庭血压 ≥ 140/90 mmHg 但未达 R6/R7 → 常规复诊。: R12 ≥ 2 home blood pressure readings ≥ 140/90 mmHg
    today, below R6/R7 criteria → routine follow-up.
  R13 NEWS2 为 0、只有轻症(咽痛、咳嗽等)→ 居家观察或常规复诊都可。: R13 NEWS2 0 with mild symptoms only (sore throat, cough, etc.)
    → either observation at home or routine follow-up is acceptable.
  R14 以上都不符合 → 居家观察。单次可穿戴异常(运动时手表心率、手表松动时血氧、某晚睡眠差)，当天可靠复测或其余日子正常时，不单独决定去向；今天可靠的指夹血氧、家庭心率与其它前置条款仍有效。: R14
    None of the above → observation at home. An isolated wearable abnormality (exercise watch heart rate,
    oxygen saturation with a loose watch, one poor night's sleep) does not alone determine disposition
    when a reliable repeat today or readings on other days are normal. Today's reliable finger oxygen
    saturation, home heart rate and other earlier rules still apply.
  R2 NEWS2 为 5–6 → 立即急诊。: R2 NEWS2 5–6 → emergency department immediately.
  R3 NEWS2 ≤ 4 且其余单项得 3 分(体温 = 35.0 ℃、收缩压 ≥ 220 mmHg)→ 24 小时内就医。NEWS2 的体温 ≤ 35.0 ℃计 3 分不变;低于 35.0 ℃已由 R3a 优先转急诊。: R3
    NEWS2 ≤ 4 with another individual score of 3 (temperature = 35.0 ℃, systolic blood pressure ≥ 220
    mmHg) → seek care within 24 hours. Temperature ≤ 35.0 ℃ still scores 3 in NEWS2; below 35.0 ℃ already
    requires immediate emergency care under R3a.
  R3a NEWS2 ≤ 4,但呼吸 ≤ 8 或 ≥ 25 次/分、收缩压 ≤ 90 mmHg、心率 ≥ 131 次/分,或家庭体温 < 35.0 ℃(疑似低体温;均为单项 3 分)→ 立即急诊;低温读数需立即核实,不可因等待复测延误求助。: R3a
    NEWS2 ≤ 4 but respiratory rate ≤ 8 or ≥ 25/min, systolic blood pressure ≤ 90 mmHg, heart rate ≥ 131/min,
    or home temperature < 35.0 ℃ (suspected hypothermia; each scores 3 individually) → emergency department
    immediately. Check the low temperature immediately; waiting for a repeat measurement must not delay
    seeking help.
  R3b NEWS2 ≤ 4,未吸氧 SpO2 ≤ 91%(单项 3 分)→ 立即急诊或 24 小时内就医,两者都可。: R3b NEWS2 ≤ 4 with room-air SpO2 ≤ 91% (individual
    score 3) → either emergency department immediately or medical care within 24 hours is acceptable.
  R3c NEWS2 ≤ 4,心率 ≤ 40 次/分(单项 3 分),无 R0 症状 → 立即急诊或 24 小时内就医,两者都可。: R3c NEWS2 ≤ 4 with heart rate ≤ 40/min
    (individual score 3), without R0 symptoms → either emergency department immediately or medical care
    within 24 hours is acceptable.
  R4 糖尿病人近 3 天有一次低血糖需要别人帮忙才处理(ADA 3 级)→ 立即急诊或 24 小时内就医,两者都可。: R4 Diabetes with an episode of hypoglycaemia
    requiring another person's assistance in the last 3 days (ADA level 3) → either emergency department
    immediately or medical care within 24 hours is acceptable.
  R5 近 7 晚里有 ≥ 2 晚 CGM 夜间最低值 < 3.0 mmol/L(ADA 2 级)→ 24 小时内就医,调整降糖方案。: R5 ≥ 2 of the last 7 nights with
    a CGM minimum < 3.0 mmol/L (ADA level 2) → medical care within 24 hours to review glucose-lowering
    treatment.
  R6 今天 ≥ 2 次家庭血压 ≥ 180/110 mmHg(收缩压或舒张压任一达到),且问诊清单有剧烈头痛或视物模糊 → 立即急诊。: R6 ≥ 2 home blood pressure readings
    ≥ 180/110 mmHg today (either systolic or diastolic threshold), with severe headache or blurred vision
    on the checklist → emergency department immediately.
  R7 今天 ≥ 2 次 ≥ 180/110 mmHg 但无上述症状 → 尽快复核(ESC 2024:最好一周内),24 小时内就医或常规复诊都可。: 'R7 ≥ 2 readings ≥ 180/110
    mmHg today without the symptoms above → prompt review (ESC 2024: preferably within a week); either
    medical care within 24 hours or routine follow-up is acceptable.'
  R7a 心衰病人今天 ≥ 2 次 ≥ 180/110 mmHg 但无上述症状 → 24 小时内就医。: R7a Heart failure with ≥ 2 readings ≥ 180/110 mmHg
    today without the symptoms above → medical care within 24 hours.
  R8 心衰病人今天晨重比 3 天前晨重多 2 kg 以上 → 24 小时内就医(或按医嘱加利尿剂并当天联系医生)。: R8 Heart failure with today's morning weight
    more than 2 kg above the morning weight 3 days ago → medical care within 24 hours (or increase diuretic
    as prescribed and contact the clinician today).
  R9 近 3 天手表 ≥ 2 次提示心律不齐、无 R0 症状 → 24 小时内就医做心电图(手表提示不能确诊房颤)。: R9 ≥ 2 watch irregular rhythm alerts in
    the last 3 days without R0 symptoms → medical care within 24 hours for an ECG (watch alerts cannot
    establish atrial fibrillation).
  RCV 与回归散布不是可辨认的个体内水平变化百分比；材料不支持精确分解时应说明估计限制。: Neither RCV nor regression scatter identifies the percentage
    change in an individual's true level. State estimation limits when the material does not support precise
    decomposition.
  ? RCV 是两次测量的参考变化量。以小变异的对数近似，单次总 CV = sqrt(CVI² + CVA²)，双侧 95% RCV = 1.96 × sqrt(CV0² + CV1²)；观测对数差为
    ln(本次/上次)，百分比差为 100 × (本次/上次 − 1)。本院合成校准沿用血肌酐 CVI 4.5%、酶法 CVA 1.1%、Jaffe CVA 4.4%；同酶法约 12.8%、同 Jaffe
    约 17.5%、两法各一次约 15.3%（对数尺度）。这些是既有登记参数，不能替代具体实验室质控；EuBIVAS 的酶法 CVI 为 4.4%（95% CI 4.2–4.7），碱性苦味酸法为 4.7%（4.4–4.9）；沿用的
    4.5% 为本院合成近似，非论文两法的精确点估计。范围内的变化也可以有记录支持的临床来源，范围外也须先核对方法与采样条件。
  : RCV is the reference change value for two measurements. Using the small-variation log approximation,
    total CV for one measurement = sqrt(CVI² + CVA²), and two-sided 95% RCV = 1.96 × sqrt(CV0² + CV1²).
    The observed log difference is ln(current/previous), and percentage difference is 100 × (current/previous
    − 1). Local synthetic calibration retains serum creatinine CVI 4.5%, enzymatic CVA 1.1% and Jaffe
    CVA 4.4%; the same-method enzymatic RCV is about 12.8%, same-method Jaffe about 17.5%, and one of
    each about 15.3% (log scale). These existing registered parameters do not replace laboratory-specific
    quality control. EuBIVAS enzymatic CVI is 4.4% (95% CI 4.2–4.7) and alkaline picrate CVI 4.7% (4.4–4.9);
    the retained 4.5% is a local synthetic approximation, not either exact study point estimate. Changes
    within the range may still have a documented clinical source; outside it, check methods and sampling
    conditions first as well.
  TPOAb 阳性者复查间隔缩短为每 6 个月 1 次。: If TPOAb positive, shorten the repeat interval to 1 check every 6 months.
  TSH早晨与下午时段不同，可有昼夜节律差；时段一致时不凭存在下午记录定性。: Morning versus afternoon TSH sampling may reflect circadian variation.
    An afternoon record alone does not establish this source if both draws were in the same time period.
  '`join_macro` 只判 `join_type` 的三选一,不读 `join_reason`; 本点区分「答对且说得出理由」与只答对。': '`join_macro` judges only
    the three-way `join_type` choice and does not read `join_reason`; this item distinguishes a correct
    answer with an explanation from a correct answer alone.'
  '`tests_recall` / `disc_recall` 只判是否列到(集合运算),不判理由; 「开单」与「知道为什么开」是两件事,后者只能在自由文本里判。': '`tests_recall`
    / `disc_recall` check listing only (set operations), not reasoning. Ordering an investigation and
    knowing why to order it are distinct; the latter can only be assessed in free text.'
