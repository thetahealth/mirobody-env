  p4.rule.acute_illness: New febrile infection-related stress or recovery between draws must be documented
    in the course. An old resolved infection does not explain the current glucose change.
  p4.rule.alcohol_change: A change in alcohol intake over several weeks matches the ALT or TG direction;
    one old social meal is insufficient for attribution.
  p4.rule.biotin_tsh: Readings may be falsely low 1–5 hours after 10 mg biotin when the current TSH assay
    is a verified susceptible streptavidin–biotin sandwich method. Do not infer this on platforms without
    that architecture or after 72 hours.
  p4.rule.cold_delayed_separation: An unseparated cellular specimen is refrigerated with delayed separation;
    refrigeration of already separated plasma does not establish potassium leakage.
  p4.rule.dehydration: New dehydration or recovery after fluids between draws is supported by the clinical
    course. An old diarrhoeal illness resolved long ago has no effect.
  p4.rule.edta_contamination: Blood transferred from a K-EDTA tube to a chemistry tube, supported by a
    transfer record and abnormally low calcium; an abnormal tube order alone is insufficient for diagnosis.
  p4.rule.fibrate_adherence: There is a high-TG indication; missed doses or resumed treatment over several
    weeks match TG changes. Old stable treatment does not explain a new difference.
  p4.rule.gastrointestinal_loss: New persistent diarrhoea/vomiting or recovery after clinician treatment
    changes potassium levels; an old resolved event has no effect.
  p4.rule.glucocorticoid: Glucose rises after recent clinician initiation of a long-acting systemic corticosteroid
    and falls after discontinuation. Topical treatment or a short course stopped before both draws has
    no effect.
  p4.rule.glucose_glycolysis: Plain unseparated whole blood left at room temperature for 2–4 hours. Do
    not infer glycolysis with a citrate-buffered inhibitor tube or separation within 30 minutes.
  p4.rule.hemolysis: Free haemoglobin on the potassium report exceeds that method's validated limit. A
    normal index or a different analyte does not establish potassium release.
  p4.rule.hepatotoxic_drug: Persistent liver enzyme changes within the corresponding post-prescription
    window, with clinician documentation excluding other common causes. A drug name alone cannot diagnose
    drug-induced liver injury.
  p4.rule.infusion_sampling: An ongoing ipsilateral saline infusion with sampling proximal to the infusion
    site; contralateral sampling is not affected by this contamination.
  p4.rule.jaffe_enzymatic_switch: Different creatinine methods, Jaffe and enzymatic, with an applicable
    patient-sample comparison supporting the difference. Do not assume all Jaffe readings are higher or
    differ by a fixed percentage.
  p4.rule.meat_meal: Cooked meat 1–4 hours before collection; a meal two days earlier does not explain
    today's change.
  p4.rule.muscle_injury: Persistent traumatic muscle injury or recovery is documented. Transient pre-draw
    exercise is classified separately as a sampling condition under the protocol.
  p4.rule.nonfasting: Food intake differs before the draws, with a recent meal affecting glucose/TG. Routine
    non-fasting TG is not an error; the explanation is a change in conditions.
  p4.rule.platform_calibration: Different report platforms, with a same-direction offset in applicable
    commutable patient-sample comparisons. Do not name platform change as the source if the platforms
    show no difference.
  p4.rule.reagent_lot: Same method, different reagent lots, with applicable patient-sample comparison
    supporting a same-direction offset. A new lot verified to have no difference is not named as the source.
  p4.rule.recent_exercise: Unaccustomed high-intensity resistance exercise 1–7 days before collection
    with transient CK/ALT release. Exercise three weeks earlier does not explain a new change; persistent
    injury is classified separately as a change in the true level.
  p4.rule.sampling_time: Morning versus afternoon TSH sampling may reflect circadian variation. An afternoon
    record alone does not establish this source if both draws were in the same time period.
  p4.rule.statin_myopathy: An established indication, with new persistent muscle symptoms and raised CK
    after treatment, a temporal relationship and strenuous exercise excluded. Old stable treatment is
    not sufficient causation.
  p4.rule.thiazide: Potassium falls after starting an indicated thiazide for hypertension and recovers
    after clinician discontinuation; a stable dose cannot explain a new change.
  p4.rule.thyroiditis: Outpatient records document the hypothyroid phase of thyroiditis or recovery, with
    concordant FT4 and TSH. Do not name this source from the TSH difference alone without a clinical course/accompanying
    results.
  p4.rule.thyroxine_adherence: Documented hypothyroidism treatment with missed or resumed intake sustained
    for at least 6 weeks, supported by the FT4 direction. Missed doses long ago have no effect.
  p4.rule_head.cold_delayed_separation: Refrigerated unseparated cellular specimen with delayed separation
  p4.rule_head.edta_contamination: Transfer from a K-EDTA tube to a chemistry tube, supported by a transfer
    record and abnormally low calcium
  p4.rule_head.glucose_glycolysis: Plain unseparated whole blood left at room temperature for 2–4 hours
  p4.rule_head.hemolysis: Free haemoglobin on the potassium report exceeds the method's validated limit
  p4.rule_head.infusion_sampling: Ongoing ipsilateral saline infusion with sampling proximal to the infusion
    site
  p4.rule_head.sampling_time: Different morning/afternoon TSH sampling periods may reflect circadian variation
