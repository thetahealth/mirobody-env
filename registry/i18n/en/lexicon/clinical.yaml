  ? 方法：Jaffe 与酶法的校准、非肌酐反应物和样本特性不同，差值可正可负。已登记 Abbott c16000 血清比对为 Jaffe(mg/dL) = 0.0486546 + 0.971448 ×
    酶法(mg/dL)，残差 SD 0.08285 mg/dL，1 mg/dL = 88.4 μmol/L；这是该研究回归及散布，不能逐患者精确倒算。不得统一减去一个固定百分比。来源在本次还是上次，要看两份报告和有效通知中的
    comparison_reference_method；本院合成实验室以酶法作为比较参照，这不是把酶法称为计量参考方法 IDMS。换院区、仪器或试剂批号本身不证明读数不可比，查当时方法比对与质控通知。同方法贯穿两次时，方法名称的存在不构成互换。
  : 'Methods: Jaffe and enzymatic assays differ in calibration, non-creatinine reactants and sample characteristics;
    differences may be positive or negative. The registered Abbott c16000 serum comparison is Jaffe(mg/dL)
    = 0.0486546 + 0.971448 × enzymatic(mg/dL), residual SD 0.08285 mg/dL, 1 mg/dL = 88.4 μmol/L. This
    is the study''s regression and scatter, not an exact patient-level inverse calculation. Do not subtract
    one fixed percentage universally. Whether the source affects the current or previous result depends
    on both reports and comparison_reference_method in the applicable notice. The local synthetic laboratory
    uses the enzymatic method as comparison reference; this does not call it the IDMS metrological reference
    method. A campus, instrument or reagent lot change alone does not prove non-comparability; check contemporaneous
    method comparison and quality-control notices. If the same method spans both draws, its name alone
    does not establish interchange.'
