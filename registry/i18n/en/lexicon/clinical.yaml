    selection, source interpretation and method reference are existing synthetic operational conventions.
    Retain clinical review flags; add no scoring thresholds or acceptance sets.
  ? 肉类餐：熟肉带入的肌酐可使血肌酐在餐后数小时升高。Nair 等在 1、2、4 小时取样，12 小时空腹后效应消失；Preiss 等在 1–2 小时观察到升高，后续研究酶法均值峰在 2 小时。NICE
    NG203 1.1.4 建议 eGFR 肌酐采血前 12 小时不吃肉。本院既有记录读者保守核对餐后 1–24 小时的可能暴露，这是合成判读范围，非文献证明效应持续到 24 小时；本批实际近期肉类餐在
    1–4 小时，前两日的餐在范围外，未使用这一区间边界出题。上次餐后高而本次标准采样可表现为下降。复查前记录实际食物、日期、时刻，不只采信空腹标签。
  : 'Meat meals: creatinine from cooked meat may raise serum creatinine for several hours after eating.
    Nair et al. sampled at 1, 2 and 4 hours; the effect disappeared after a 12-hour fast. Preiss et al.
    observed increases at 1–2 hours; a later study found an enzymatic mean peak at 2 hours. NICE NG203
    1.1.4 advises no meat for 12 hours before an eGFR creatinine draw. The existing local record reader
    conservatively checks possible exposure 1–24 hours after meals. This synthetic interpretation window
    is not evidence that the effect lasts 24 hours. In this batch, actual recent meat meals occurred 1–4
    hours before collection; meals two days earlier lie outside the window, and its boundary was not used
    to construct questions. A previous post-meal high followed by standard sampling today may appear as
    a fall. Record actual food, date and time before retesting; do not rely only on the fasting label.'
