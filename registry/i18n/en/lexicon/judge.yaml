  judge.scoring.management.precision.add_precision.1: 'precision not derived: no verified applicable investigation
    prohibition list or chronic monitoring interval in this case.'
  judge.scoring.management.precision.add_precision.2: 'Judge investigation precision only against the
    following sourced list; do not penalise test names or the number of investigations. All prerequisites
    must be explicitly established by this case''s visible data or the plan; do not infer an unstated
    rhythm diagnosis, risk, clinical stability or previous test date.

    Not routinely recommended: '
  judge.scoring.management.precision.add_precision.3: No separate prohibited items.
  judge.scoring.management.precision.add_precision.4: '

    Permitted initial investigations: '
  judge.scoring.management.precision.add_precision.5: No initial investigations registered for this family;
    unlisted tests are not thereby prohibited.
  judge.scoring.management.precision.add_precision.6: '

    Chronic disease monitoring: '
  judge.scoring.management.precision.add_precision.7: No registered interval applicable to this case.
  judge.scoring.management.precision.add_precision.8: '

    This item does not require arranging the initial investigations or monitoring above. Do not penalise
    initial investigations directed at the current problem, routine monitoring at the applicable interval,
    or tests explicitly left to the receiving clinician to assess for necessity. Arranging a prohibited
    test and then saying a clinician will perform it does not remove the penalty. Judge contradicted only
    for a listed non-recommended investigation with every prerequisite met, or explicitly premature routine
    repetition of the same test without a new indication. A minimum monitoring frequency is not a minimum
    interval; do not penalise if the information does not establish repetition. Otherwise, satisfied requires
    actual management for this visit; no management (empty answer, readings alone or generic advice to
    follow medical instructions) is unmet.'
  judge.scoring.management.precision.add_precision.9: Implement the management above; investigations follow
    this patient's indications and chronic monitoring plan.
