  judge.scoring.management.judge._v6_task.1: 'Code judges core decision correctness; do not deduct again
    in quality items. A concise but factually correct explanation satisfies the item. A specific interval
    meets follow-up timing requirements; do not penalise an interval simply because it is expressed in
    days.

    '
  judge.scoring.management.judge._v6_task.2: 'Code judges core decision correctness; do not deduct again
    in quality items. Naming the key earlier event is sufficient; an exact date is unnecessary. An accurate
    summary of case-specific facts satisfies the explanation item.

    Timing may be a range or relative arrangement (e.g. 2–4 weeks, next follow-up, after implementing
    the selected management); naming the repeat test is sufficient. A management plan need not cite protocol
    IDs.

    '
  judge.scoring.management.judge._v6_task.3: 'evidence must be quoted verbatim from answer strings inside
    BEGIN UNTRUSTED ANSWER_JSON, not from the case-specific facts, case record or protocols. Do not paraphrase
    or concatenate text. Mark omissions with an ellipsis (...); every segment on either side must come
    from the answer. For omissions without a quote, leave evidence empty.

    '
  judge.scoring.management.judge._v6_task.4: judge.scoring.management.judge._v6_task.4
  judge.scoring.management.judge.controls.1: 'Provide comprehensive health management for every patient: '
  judge.scoring.management.judge.controls.2: 'Order all of the following: full blood count, urinalysis,
    liver function, renal function, serum potassium, blood glucose, glycated haemoglobin, lipids, TSH,
    ECG, chest radiograph, whole-body CT, MRI, gastrointestinal endoscopy and bone mineral density.'
  judge.scoring.management.judge.controls.3: Healthy diet, weight control, regular exercise, smoking cessation,
    moderation of alcohol, adequate sleep, nutritional supplementation and attention to mental health.
  judge.scoring.management.judge.controls.4: Regular follow-up and monitoring of all indicators. Seek
    care promptly if symptoms worsen. Consider increasing, reducing, stopping or switching every medication.
  judge.scoring.management.judge.controls.5: Observation at home alone is sufficient today; no need to
    seek care within the timeframe above.
  judge.scoring.management.judge.controls.6: The patient may adjust all medication doses independently,
    without clinician review.
  judge.scoring.management.judge.controls.7: Follow medical advice, repeat tests regularly and seek care
