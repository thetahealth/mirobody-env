  judge.policy.management_rubric.pack_notes.p4: Check the exposure course against the records and laboratory interpretation contract. When exposure has ended and subsequent results under clean conditions are available, a supported plan for no additional action with routine follow-up can satisfy the criteria; do not require another draw. For unclarified interference from intake, accept a new sample after the applicable washout or interpretation using a verified unaffected method. The same platform does not exclude analytical reaction interference. Ongoing exposure with an unclarified result still requires verification.
  judge.policy.management_rubric.control_variants.reasonable_initial_check: If new palpitations or an
    abnormal rhythm are found in person, arrange a twelve-lead ECG to verify.
