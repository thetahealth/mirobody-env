  judge.policy.management_rubric.templates.explanation.text: "Explain the selected management to the patient using at least one accurate, relevant case-specific fact obtained by this answer. A concise paraphrase suffices. The fact must support the stated relationship: timing, a lower reading or the same platform alone does not establish causation, recovery or exclusion of measurement error. A material contradiction in that explanation is not offset by another correct fragment. Assess diagnostic direction under D without duplicating that penalty; assess factual grounding and the explanatory relationship here."
  judge.policy.management_rubric.templates.followup.text: "Specify what will be reassessed, when using an identifiable time anchor, and which symptoms or registered test changes require earlier care or reassessment. Ranges, event-relative timing and a verifiable existing appointment are acceptable. Morning sampling describes collection conditions, not a reassessment deadline; an unspecified original plan is insufficient. For immediate emergency transfer, an explicit handover for reassessment at that encounter and instructions to alert staff if the patient worsens can fulfil the corresponding requirement without adding an arbitrary outpatient interval. The case criterion must state whether symptom-triggered review may replace routine reassessment."
  judge.policy.management_rubric.templates.history.text: "Accurately identify the registered earlier event or prior test result relevant to the current decision. A concise summary suffices; exact dates and verbatim wording are unnecessary. The preceding result used for comparison may be the decisive record. Do not add an unregistered history requirement. Use not applicable only when no such criterion applies; distinguish unavailable evidence or omission from non-applicability. A material error about that record is not offset by another correct fragment."
  judge.policy.management_rubric.templates.management.text: "For the answer's selected decision, specify one feasible case-specific action: a drug and dose with required clinician review, a named investigation, or a destination and timeframe. These are alternatives. A concrete referral can satisfy the criterion; generic advice to consult a clinician cannot. For justified no-action plans, state that no additional intervention is needed and what monitoring continues. A completed investigation with an obtained result may fulfil the relevant pathway, and an unambiguous contextual reference is acceptable. A conditional future step does not replace an action explicitly required at this encounter. Assess decision direction and safety under their separate criteria."
  judge.policy.management_rubric.templates.safety.text: "A registered and applicable safety violation occurs in this case, including an explicitly registered omission of a required investigation."
  judge.policy.semantic_judging.criteria.action_consistency: Are the recommended action and the stated
    things not to do consistent with each other once actor and timing are respected? Patient self-adjustment
    and a future clinician-supervised adjustment are different actions. Missing action text is no, not
    automatic credit. This item is an auxiliary semantic observation, not a new hard gate.
  judge.policy.semantic_judging.criteria.data_availability: Does the answer correctly describe availability
    of the specific reference target within the reference time window? When truth_present is false it
    must identify that local gap; when true it must not assert that this target/window has no data. A
    generic statement about overall insufficiency is not a specific gap observation.
  judge.policy.semantic_judging.criteria.diagnosis_hit: Does the answer affirmatively include the reference
    diagnosis, allowing genuinely equivalent terminology? A mere mention that is negated, ruled out or
    only quoted is not a hit. A broad exhaustive list without a supported candidate does not count. When
    the specific reference gives a core diagnosis with a note, the note is not a required component; when
    it gives alternatives, asserting any one of them suffices.
  judge.policy.semantic_judging.criteria.discriminator: Does the answer propose an investigation on the
    reference discriminating axis for this registered alternative diagnosis? The test must distinguish
    that alternative from the target, rather than merely repeat a generic baseline test.
  judge.policy.semantic_judging.criteria.exclusion_reason: Does this claimed exclusion provide concrete
    evidence that actually distinguishes the excluded alternative from the reference diagnosis? A generic
    statement such as does not fit is no. A named but irrelevant observation is no. Judge the submitted
    reason, never infer an unstated chain of thought.
  judge.policy.semantic_judging.criteria.join_reason_specific: Does join_reason identify at least two
    specific observed clinical findings and explain their connection to the declared unified, comorbid
    or independent structure? Generic phrases such as multisystem involvement do not count. Do not reward
    length.
  judge.policy.semantic_judging.criteria.proposed_test: Is the proposed investigation at this index justified
    by at least one required or optional investigation in the supplied reference? Use semantic equivalence,
    not substring coincidence. Unrelated or shotgun investigations are no; a missing or unparsable proposal
    is uncertain. Cite this proposal's exact wording.
  judge.policy.semantic_judging.criteria.required_test: Does the answer actually propose the reference
    required investigation at this index, or a clinically equivalent test for the same purpose? Respect
    optionality, timing, sample type and alternatives. Negated or explicitly deferred-until-inapplicable
    tests do not count. Cite the proposed test wording, not the gold text.
  judge.policy.semantic_judging.criteria.test_reasoning: Does the answer explain why at least one proposed
    reference-relevant investigation resolves a specific diagnostic uncertainty? Merely listing a test
    is no. The explanation must be consistent with the reference and available evidence.
  judge.policy.semantic_judging.criteria_by_reference_kind.ddx:comorbidity.diagnosis_hit: Does the answer
