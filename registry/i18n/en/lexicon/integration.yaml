  成人慢病用药复诊，复评本院已登记的慢病药物；目标药物、适应证及当前剂量另查患者处方。: Chronic medication follow-up for medicines
    registered in this clinic; check the patient prescription for the target drug,
    indication and current dose.
  已登记药物复评，有症状、起病日期和处方剂量变化记录。: Review of registered medicines with symptoms, onset
    dates and prescription dose-change records.
  左甲状腺素服法与干扰复评: Levothyroxine administration and interference review
  服药间隔: Separation of medication administration
  成人复评左甲状腺素治疗，需核对本药和钙剂的实际服用时刻、当前 TSH、目标范围及症状经过。处方量与服药覆盖率已核实时仍不能省略服法复核。: For adults
    receiving levothyroxine, check the actual administration times of this drug and
    calcium, current TSH, target range and symptom course. A verified prescribed dose
    and medication coverage do not remove the need to review administration.
  未取得实际服药时刻时不能推断同服；近期停用的补充剂须核对停用日期和后续复查，不能当作当前仍在服用。: Do not infer concurrent intake
    without actual administration times. For a recently stopped supplement, check
    the stop date and subsequent tests; do not treat it as ongoing use.
  其它药物的处方量与疗程不作为左甲状腺素的服药时刻；本条不授权自行加减药。: The prescribed dose and course of other medicines
    do not establish levothyroxine administration times. This procedure does not authorize
    independent dose changes.
  传统推荐间隔尚未经直接试验验证，按适用药物及医生指导执行；控制不佳先核实服法及吸收干扰，不立即升级剂量。: The traditionally recommended
    separation has not been directly tested. Follow the applicable drug instructions
    and clinician guidance; with inadequate control, verify administration and absorption
    interference before considering an increase.
  服法与钙剂吸收相互作用据 ATA 指南；症状经过与先调查再复评沿用已登记的合成门诊政策，仍待临床复核。传统间隔不是已经试验证实的统一洗脱时间。: Administration
    and the calcium absorption interaction follow ATA guidance. Symptom-course assessment
    and investigation before reassessment follow the registered synthetic clinic policy,
    pending clinical review. The traditional separation is not a universal washout
    interval established by trials.
  碳酸钙: Calcium carbonate
