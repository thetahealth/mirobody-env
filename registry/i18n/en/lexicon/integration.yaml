  氯沙坦（ARB）: Losartan (ARB)
  已登记药物复评，需要连续取药记录与今天药盒计数。先查原处方起始日、各次取药数量及日期、规格变化与今天剩余天数；取药日期本身不能证明已服用。: Review of
    registered medicines requires consecutive dispensing records and today's pill
    count. First check the prescription start date, dispensing amounts and dates,
    strength changes and today's remaining days of supply; dispensing dates alone
    do not prove intake.
  氯沙坦（ARB，口服）: Losartan (ARB, oral)
  Table 6.4；recommendations 6.6 and 6.18: Table 6.4;recommendations 6.6 and 6.18
