  甲减处方随访；连续6周每周有3天未服处方药，FT4下降。: Hypothyroidism prescription review. Did not take the prescribed medicine
    on 3 days each week for 6 consecutive weeks; FT4 has fallen.
  白粥、馒头: Plain rice porridge and steamed bread
  米粉（清汤）: Rice noodles in clear broth
  米饭、清炒时蔬: Rice and stir-fried seasonal vegetables
  米饭、清炒菠菜、紫菜蛋花汤: Rice, stir-fried spinach, and seaweed and egg soup
  米饭、清炒西兰花、蛋花汤: Rice, stir-fried broccoli and egg soup
  米饭、番茄炒蛋、青菜: Rice, scrambled egg with tomatoes, and green vegetables
  米饭、豆腐、青菜: Rice, tofu and green vegetables
  米饭、麻婆豆腐、青菜: Rice, mapo tofu and green vegetables
  素饺子、凉拌萝卜丝: Vegetarian dumplings and shredded radish salad
  素馅饺子: Vegetarian dumplings
  红烧牛肉约 250 g、面条: Braised beef, about 250 g, with noodles
  羊肉汤泡馍（羊肉约 150 g）: Crumbled flatbread in lamb soup (about 150 g lamb)
  羊肉粉丝汤（羊肉约 150 g）: Lamb and glass-noodle soup (about 150 g lamb)
  腹泻后口干、尿量减少、体位性头晕；门诊复核容量状态。: Dry mouth, reduced urine output and postural dizziness after diarrhoea;
    volume status reviewed in clinic.
  葱爆羊肉约 250 g、花卷: Lamb stir-fried with spring onions, about 250 g, with steamed rolls
  蒸红薯、豆浆: Steamed sweet potato and soya milk
  蔬菜汤面: Noodles in vegetable soup
  血脂治疗记录完整，开始用药后出现持续肌痛，排除剧烈运动；医生安排复查。: Lipid treatment is fully documented. Persistent muscle pain began
    after starting treatment, with strenuous exercise excluded; the clinician arranged repeat testing.
  西红柿鸡蛋面: Tomato and egg noodles
  豆浆、包子（素馅）: Soya milk and steamed buns with vegetable filling
  运动造成CK/ALT短暂生理释放；此处分析前指非标准采血前状态，并非体外标本损坏。持续肌损伤归真实变化。: Exercise causes transient physiological release
    of CK/ALT. Here, the preanalytical category refers to non-standard conditions before collection, not
    damage to a specimen outside the body. Persistent muscle injury is classified as a sustained change
    in the patient.
  近两周没有发热、腹泻或呕吐，饮水量和平时差不多。: I've had no fever, diarrhoea or vomiting in the last two weeks, and I've been
    drinking about as much as usual.
  这段时间没有生病，没有自己加服止痛药或其他药。: I've had no illness during this time and have not taken any extra painkillers
    or other medicines on my own.
  连续数周饮酒增加或停止饮酒，非仅单次餐前饮酒。: Increased alcohol intake or abstinence sustained over several weeks, not just
    a single drink before a meal.
  连续数日腹泻或呕吐，口服摄入减少；恢复期排便和摄入恢复。: Diarrhoea or vomiting for several days with reduced oral intake; bowel
    habit and intake returned to normal during recovery.
  酱牛肉约 250 g、米饭: Beef braised in spiced stock, about 250 g, with rice
  采血前1–7日不习惯的高强度抗阻运动与短暂CK/ALT释放；三周前运动不解释新变化，持续损伤另归真实变化。: Unaccustomed strenuous resistance exercise 1–7
    days before collection with transient CK/ALT release. Exercise three weeks earlier does not explain
    a new change; persistent injury is classified separately as a sustained change in the patient.
  采血前一天作息照旧，水喝得不多也不少。: My routine was the same as usual the day before the blood test, and I drank my
    usual amount of water.
  青菜面（清汤）: Noodles with green vegetables in clear broth
  面包、酸奶: Bread and yoghurt
  面条、青菜: Noodles and green vegetables
  馄饨（素馅）: Wontons with vegetable filling
  高血压/肾病随访处方，医生记录起用或停用及复查安排。: Follow-up prescription for hypertension/renal disease. The clinician documented
    starting or stopping treatment and the repeat-testing plan.
  高血压门诊处方，开始服药或医生停用时间已登记。: Hypertension outpatient prescription. The date of starting treatment or clinician-directed
    withdrawal is recorded.
  黑椒牛柳约 250 g、意面: Beef strips in black pepper sauce, about 250 g, with pasta
  p4.contract.true_change: 'true_change: a sustained change in the level of the measurand within the patient
    or in the clinical course, supported by timing, direction and course records. Do not treat assay interference
    as a pharmacological effect within the patient.'
  p4.contract.noise: 'analytic_biological_noise: analytical imprecision and random within-person variation.
    Use when the patient is stable and there is no evidence of a matching sampling, method or clinical
    source. RCV assesses statistical magnitude; it cannot establish the source on its own.'
  p4.contract.preanalytical: 'preanalytical: changes in preparation, intake, collection conditions, transport
    or specimen handling before testing that affect comparability. Transient exercise and time-of-day
    differences also count as sampling conditions in this task. When an ingested substance interferes
    with the assay outside the body, method_difference is also accepted.'
  p4.contract.method_difference: 'method_difference: systematic differences between methods, platforms
    or reagent lots, or verified interference with the analytical reaction. Evidence must apply to the
    analyte, date and method. A method name or platform-change notice alone cannot establish the source.'
  p4.contract.sources: 'Category sources: CLSI EP07, edition 3, Scope (exogenous/endogenous chemical interference);
    CLSI EP09 Scope (patient-sample method comparison); EFLM-COLABIOCLI venous blood sampling recommendations,
    Patient preparation; Fraser 2012, Reference change values (PMID 21958344); for ingested interferents,
    also the FDA biotin safety communication and AACC 2020 guidance (doi:10.1093/jalm/jfz010). Category
    overlap and the classification of transient sampling conditions are task conventions pending clinical
    review.'
  p4.contract.next: The next step is required. repeat_standardized includes a new blood draw after appropriate
    washout, or interpretation using a verified unaffected method. no_action means no additional intervention
    for this historical difference; routine follow-up continues. If ingested interference affected only
    the previous reading and today's reading is standard, treat it as a distortion of the previous reading;
    no_action is acceptable. If it affected today's reading, no_action is acceptable when the exposure has
    ended and subsequent clean results are available; ongoing exposure requires verification.
  p4.notice.commutable_comparison.2: Patient specimens were tested concurrently under both sets of assay
    conditions. The comparison values apply only to the listed dates, platforms and lots.
  p4.notice.commutable_comparison.3: Parallel patient-sample results are recorded here. Verify the applicable
    analyte and implementation date before interpreting differences between reports.
  p4.notice.commutable_comparison.4: The comparison used commutable patient specimens. The listed differences
    apply to the methods and reagent lots in this document and must not be extrapolated to other batches.
  p4.notice.historical_batches.2: The archived document records the assay system and lot used at the time.
    Check its effective dates separately against the current report.
  p4.notice.historical_batches.3: This is a use record from an earlier batch. The fields retain its platform,
    reagents and period of validity.
  p4.notice.historical_batches.4: The old method document is archived with the original report. Its period
    of applicability and assay conditions are given in the record fields.
  p4.event.biotin_ended: The listed supplement has been stopped. Subsequent verification under clean conditions
    is in the laboratory records.
  p4.event.biotin_ongoing: The patient is still taking the listed supplement at this retrospective visit.
    It was temporarily stopped for the earlier verification as recorded and has recently been restarted.
