entries:
  上周户外后出现,无痛: Started after being outdoors last week; no pain
  上周户外晒过后背部开始脱皮: My back began peeling after sun exposure outdoors last week
  上颚被热汤烫到,吃东西时有点疼: Hot soup burnt the roof of my mouth. It hurts a little when I eat
  下唇内侧一处口腔溃疡,吃辣的时候疼: There is an ulcer inside my lower lip. Spicy food hurts it
  下楼梯踩空,冰敷后 2 天缓解: Missed a step downstairs; improved 2 days after applying ice
  下楼踩空右脚踝扭到,局部酸痛: I missed my footing downstairs and twisted my right ankle. It aches locally
  两天后自行消退: Settled by itself two days later
  久未做家务,次日缓解: Had not done housework for a long time; improved the following day
  亲属来访同住一周: Relatives visited and stayed for a week
  位于下唇内侧,一周自行愈合: Inside the lower lip; healed by itself within a week
  低速侧滑,清创后结痂: Slid at low speed; scab formed after wound cleaning
  修剪阳台花草时被枝条划伤小臂: Scratched my forearm on a branch while trimming plants on the balcony
  做饭时吸了油烟,呛咳了一阵: I breathed in cooking fumes and had a coughing spell
  关门夹到手指,指甲下面青了一块: I caught my finger in a door and got a bruise under the nail
  关门时没留意,指甲下淤青: Caught finger while closing a door without noticing; bruising beneath nail
  冬天出门,戴上口罩后好转: When going out in winter; improved after putting on a mask
  冷空气一吸就呛咳一两声: Breathing in cold air makes me cough once or twice
  刮胡子刮破下巴: I nicked my chin while shaving
  刷牙碰到舌根,漱口后正常: Toothbrush touched the back of the tongue; normal after rinsing
  前臂晒了一下午后发红、碰到就刺痛: My forearms went red after an afternoon in the sun and sting when touched
  剪完头发后脖子后面发痒: The back of my neck has itched since having my hair cut
  剪趾甲过短所致,温水泡后缓解: Due to trimming the toenail too short; relieved by a warm-water soak
  办了图书馆借书证: Got a library card
  参加同事婚礼: Attended a colleague's wedding
  参加社区义务植树半天: Joined community tree planting for half a day
  参加线上读书会: Joined an online reading group
  口罩戴了一整天,耳朵后面压得疼: Wearing a mask all day has made it sore behind my ears
  右手食指被纸划了道口子: I cut my right index finger on paper
  吃了辣的以后胃里火烧火燎一阵: Spicy food left my stomach burning for a while
  吃得太饱后上腹胀了一晚上: My upper tummy was bloated all evening after eating too much
  吃辣后半天,喝温水缓解: For half a day after spicy food; relieved by warm water
  吃饭咬到舌头: I bit my tongue eating
  吃饭时不慎咬到,两天后不痛: Accidentally bitten while eating; painless two days later
  周末爬山后两条小腿肌肉酸痛,下楼更明显: Both calf muscles ache after a weekend hike, especially downstairs
  周末登山下坡较多: Weekend hike with much downhill walking
  喉咙有点干痒,说话多了想清嗓子: My throat is a bit dry and tickly. Talking a lot makes me want to clear it
  喝了冰啤酒后肚子隐隐作痛一会儿: Drinking an ice-cold beer gave me a dull tummy ache for a little while
  喝完半小时,热水缓解: Half an hour after drinking; relieved by hot water
  嗓子疼了两天,咽口水有点痛: My throat has hurt for two days and swallowing saliva is a bit painful
  嚼了片咀嚼片就好: A chewable tablet settled it
  因公出差 3 天: Business trip for 3 days
  多年前扭伤处,天晴即缓解: Old sprain site from years ago; eases when the weather clears
  多年前扭伤过的脚踝一到阴雨天就发酸,天晴就好: My ankle, sprained years ago, aches when it is dull and rainy. It gets better in clear
    weather
  大扫除拖地后两条手臂酸: Both arms ache after mopping during a big clean
  天气转凉的那几天,两天后好转: During the days when the weather cooled; improved two days later
  孩子开学: Child started the school term
  室内暖气干燥,加湿后好转: Dry indoor heating; improved with humidification
  家中安装了新的空气净化器: Installed a new air purifier at home
  家中宠物做了绝育手术: Family pet underwent neutering
  家中换了新洗衣机: Replaced the washing machine at home
  家养宠物,已消毒,无红肿: Household pet; disinfected, with no redness or swelling
  家里换了新窗帘: Changed the curtains at home
  小区停水半天: Water supply to the estate interrupted for half a day
  小区草地边久坐: Sat beside the estate lawn for a long time
  小腿被蚊子叮了好几个包、发痒: I have several itchy mosquito bites on my lower leg
  屋里暖气干,擤鼻涕带点血丝: The heating makes the room dry, and there are streaks of blood when I blow my nose
  左眼皮跳了好几天: My left eyelid has twitched for several days
  干燥季节,创可贴处理: Dry season; treated with a plaster
  开始学习一门线上课程: Started an online course
  当场刺痛,次日缓解: Sharp pain at the time; improved the following day
  当天一次稀便,次日正常: One loose stool that day; normal the next day
  户外一下午未遮挡: Uncovered outdoors all afternoon
  户外风大,涂唇膏后好转: Windy outdoors; improved with lip balm
  所在部门搬到新办公楼: Department moved to a new office building
  手机系统升级到新版本: Updated the phone operating system
  手肘外侧在过道墙上蹭红了: I rubbed the outside of my elbow against the corridor wall, making it red
  手腕表带处压出一圈红印: My watch strap has left a red ring around my wrist
  打喷嚏时闪到后背,当时刺痛了一下,第二天好多了: I pulled my back sneezing, with a sharp pain then. It was much better the next day
  报名了社区书法班: Enrolled in a community calligraphy class
  指甲边倒刺撕裂: Torn hangnail beside the nail
  换了新洗衣液后两个手腕发痒: Both wrists itch since changing laundry detergent
  换了新的通勤路线: Changed the route to work
  换了通勤用的自行车: Replaced the bicycle used for commuting
  换回原来的洗衣液后消失: Disappeared after returning to the original detergent
  换季当周,多饮温水后缓解: During the change of season; relieved by drinking more warm water
  换季当周,室内开空调: During the change of season, with indoor air conditioning
  换新鞋后步行较多: Much walking after changing to new shoes
  排队站了一个多小时,小腿发胀,坐下歇一会就好了: I stood queuing for over an hour and my calves felt tight. They improved with a short
    sit-down
  排队约一小时,坐下后缓解: Queued for about an hour; relieved by sitting
  搬箱子后腰部酸痛,弯腰时更明显: Lower back soreness after moving boxes, worse on bending
  搬箱子时用力不当,休息两天缓解: Strained while lifting boxes; improved after two days' rest
  整理文件时划到,贴创可贴次日愈合: Cut while sorting papers; healed the next day after a plaster
  整理资料时划到,贴创可贴: Cut while sorting papers; applied a plaster
  整理资料时指尖被订书钉划到: Fingertip scratched on a staple while sorting papers
  早上刷牙时恶心想吐了一下: Brushing my teeth this morning made me briefly feel like being sick
  早上吃得太快,打嗝停不下来持续了半小时: I ate too fast this morning and had nonstop hiccups for half an hour
  早上照镜子发现眼白上有一小片发红,不痛不痒,视力正常: This morning I saw a small red patch on the white of my eye. It is not painful or
    itchy and I can see normally
  早晨起来咳几口白痰就没事了: I cough up a little white phlegm on waking, then I am fine
  晚饭吃得油腻,后来反酸烧心了一下: I had a brief spell of acid and heartburn after a greasy dinner
  晨起连打喷嚏、流清涕、鼻子痒: Repeated sneezing, clear runny nose and nasal itching on waking
  智齿那一侧牙龈肿痛: The gum beside my wisdom tooth is swollen and sore
  更换了体重秤的电池: Changed the weighing-scale batteries
  更换了家庭宽带运营商: Changed home broadband provider
  更换了手机运营商套餐: Changed mobile phone plan
  止血后无红肿: No redness or swelling after bleeding stopped
  没开抽油烟机,开窗通风后好转: Extractor fan was off; improved after opening the window for ventilation
  泳池水刺激,滴人工泪液缓解: Pool water irritation; relieved by artificial tears
  洗头后外耳道进水发闷: Water in the outer ear canal after hair washing, with a blocked feeling
  洗头时耳内进水,次日自行缓解: Water entered ear washing hair; settled by itself the next day
  洗澡水太热,身上皮肤发红,调低水温后退了: Hot shower water made my skin red. It faded after turning the temperature down
  游泳后眼睛发红: My eyes went red after a swim
  漱口水处理后 3 天缓解: Improved after 3 days using mouthwash
  爬楼后出现,平地行走无痛: Started after stairs; no pain walking on level ground
  爬楼后膝盖前面隐隐作痛,平地走路不疼: The front of my knee aches dully after stairs, with no pain on level ground
  盯屏幕一下午后眼睛干涩,滴眼药水能缓解: My eyes are dry and gritty after an afternoon looking at a screen. Eye drops help
  着凉后第二天,喝热水好转: Day after getting chilled; improved with hot water
  睡姿不当,热敷后缓解: Awkward sleeping position; relieved by warm compress
  碎发刺激,冲洗后缓解: Loose hair irritation; relieved by rinsing
  空气干燥,加湿后好转: Dry air; improved with humidification
  穿新鞋走了一天,足跟磨出水泡: A whole day walking in new shoes gave me a heel blister
  穿薄底鞋走路,当天缓解: Walking in thin-soled shoes; eased that day
  端杯时握到壁面,冷敷后无水泡: Held the wall of a cup; no blisters after cooling
  端热水杯时握到杯壁烫到手指,冷水冲了一下没起泡: I burnt my fingers on the side of a hot-water cup. I rinsed them with cold water and
    no blister appeared
  结膜下出血,无痛,两周自行吸收: Subconjunctival haemorrhage, no pain; absorbed spontaneously over two weeks
  耳后长了个小粉刺,碰到有点疼: A little spot came up behind my ear. It hurts slightly to touch
  聚餐吃多了,次日恢复: Overate at a shared meal; recovered the next day
  脚底被小石子硌到: The sole of my foot was pressed painfully by a little stone
  落枕、颈部转动酸痛: Stiff neck with aching on turning
  表带过紧,松开后消退: Watch strap too tight; marks faded after loosening
  被家里的猫轻轻抓了一下手背: Our cat lightly scratched the back of my hand
  调低水温后消退: Faded after reducing water temperature
  起床后漱口,一整天没再咳: Rinsed mouth after getting up; no further cough all day
  趾甲剪太短后嵌进肉里、一压就疼: My toenail grew into the skin after being cut too short. It hurts with pressure
  轻轻咳了几天,没有痰: I have had a mild cough for a few days, without phlegm
  过道狭窄时蹭到,无破皮: Scraped in a narrow corridor; no broken skin
  这几天鼠标用得多,右手腕酸痛: My right wrist aches after lots of mouse use these past few days
  进食过快,饮温水后停止: Ate too quickly; stopped after warm water
  进食过急,黏膜局部烫伤: Hurried eating, with a local mucosal scald
  连着伏案几天,肩颈酸胀,拉伸一下能松些: Days of desk work have left my neck and shoulders aching. Stretching loosens them a little
  连续伏案数日,拉伸后减轻: Several consecutive days at a desk; improved with stretching
  连续佩戴数小时,取下后缓解: Worn continuously for several hours; relieved after removal
  连续熬夜赶工后出现,休息后减轻: Started after consecutive late nights finishing work; eased with rest
  连续用鼠标数日,腕部劳损: Wrist strain after several consecutive days of mouse use
  连续看屏幕数小时,滴人工泪液缓解: Several hours of screen use; relieved by artificial tears
  邻居装修持续一周: Neighbour's renovation work lasted a week
  阳台整理绿植,已清洁: Tidying balcony plants; cleaned afterwards
  隔夜菜吃了拉了一次肚子: I had diarrhoea once after leftovers
  频繁洗手,抹护手霜后好转: Frequent handwashing; improved with hand cream
  骑车侧滑摔倒,膝盖擦破一块皮: My bicycle slid and I fell, grazing my knee
  鼻子有点堵,清鼻涕不断: My nose is a bit blocked with constant clear discharge
  一天比一天乏,体重也在掉: I feel weaker each day and am losing weight too
  一直觉得是自己体质偏寒: I have always thought I just naturally feel the cold
  一站起来就头晕眼黑,血压掉: When I stand up I get dizzy, my vision darkens and my blood pressure drops
  与健康数据无关的日常事务: Everyday matters unrelated to health data
  以为是年纪大了胃口变小: I thought my smaller appetite was just getting older
  以为是枕头不合适,换过两个: I thought the pillow was wrong and tried two replacements
  体检说我骨密度比同龄人低,嘴里还时不时长溃疡: My health check found lower bone density than others my age. I also get mouth ulcers now
    and then
  便秘很顽固,多吃粗粮加益生菌都不管用: My constipation is stubborn. More whole grains and probiotics have not helped
  原来喜欢的那些事,如今不太想做: I no longer much want to do the things I used to enjoy
  后脖子一块皮又黑又厚,软软的,做了一周去角质还是那样: There is a dark, thick, soft patch at the back of my neck. A week of exfoliating has
    not changed it
  夜里起夜三四回,前列腺血糖查过都正常,性欲也不如以前: I pass urine three or four times at night. Prostate and blood sugar tests were normal,
    and my interest in sex is less than before
  大便一直解不下来,吃了纤维和益生菌也没改善: I still cannot open my bowels. Fibre and probiotics have not helped
  大便次数多了,还有点稀: I open my bowels more often and the stools are a bit loose
  家庭作息调整: Change in the family daily routine
  晚上要起来解三四次小便,查了前列腺和血糖都没事,那方面的兴趣也淡了: I get up three or four times a night to pass urine. Prostate and blood sugar
    checks were fine, and I am less interested in sex
  最近人很乏,看东西也老是花: I feel very weak lately and things keep looking blurred
  最近觉睡得不好,白天没什么精神: I have slept poorly lately and have little energy by day
  有点发热,碰到右上边肚子更疼: I feel a bit feverish and touching the top right of my tummy hurts more
  查骨密度说偏低,另外口腔溃疡隔一阵就犯一次: My bone density test was low, and I get mouth ulcers every so often
  没劲,看东西有点模糊: I have no energy and my vision is a bit blurred
  浑身乏力,眼睛看东西不太清楚: I feel weak all over and cannot see things very clearly
  眼镜度数没变,看东西时清时糊,吃完甜食更糊: My glasses prescription has not changed, but my vision comes and goes between clear and
    blurred, worse after sweets
  经常腹胀拉稀,一天两三回,牛奶不喝了还是这样: I often have bloating and diarrhoea two or three times a day. Stopping milk has not helped
  肘部膝盖那块老起一片片痒疙瘩,挠了结痂又起: I keep getting patches of itchy bumps at my elbows and knees. They crust when scratched,
    then come back
  肚子老胀,大便稀,一天两三次,少喝奶也没好: My tummy keeps bloating and my stools are loose two or three times a day. Less milk has
    not helped
  胳膊肘和膝盖外面长了一簇簇的小水疱疙瘩,很痒,挠破了结痂,反反复复: Clusters of little blistery bumps keep coming up on the outsides of my elbows
    and knees. They itch badly, break and crust when scratched, then return
  脖子后面的皮肤发黑变厚,摸着像绒布,去角质一礼拜也没用: The skin at the back of my neck is dark and thick and feels like velvet. A week exfoliating
    has not helped
  血压突然高了,在148/95上下,严格少盐一个月也没见好: My blood pressure suddenly became high, around 148/95. A month of strict salt restriction
    has not helped
  血压顽固偏高,低盐吃得很严,还是146/96左右: My blood pressure stays stubbornly high, around 146/96, despite a very strict low-salt
    diet
  补铁吃了三个月,复查血红蛋白还是低: I have taken iron for three months but repeat haemoglobin is still low
  觉得发热,一碰右上腹疼得更明显: I feel feverish and touching my upper right tummy makes the pain more noticeable
  说我缺铁贫血,铁剂吃了三个月,血红蛋白还是上不去: I was told I have iron deficiency anaemia. Three months of iron have not brought my
    haemoglobin up
  越来越没劲,人也瘦了: I am getting weaker and have lost weight too
  越来越累,还瘦了不少: I feel increasingly tired and have lost quite a lot of weight
  蹲下站起头晕,测血压偏低: I get dizzy standing from a squat and my blood pressure reads low
  近两周大部分日子心情低落: My mood has been low on most days over the past two weeks
  近半年头发掉得多,一洗头就掉一把: I have lost more hair over six months, a handful whenever I wash it
  这半年掉头发比以前多,洗头的时候特别明显: I have lost more hair than before over these six months, especially noticeable washing it
  这阵子上厕所次数多,大便不成形: I have been opening my bowels more often lately and the stools are unformed
  连原来做的小事都难动起来,最近做得少: Even small things I used to do are hard to get started on. I have done less lately
  验光度数没变,可看东西一会儿清楚一会儿模糊,吃了甜的更明显: My sight test prescription has not changed, but things alternate between clear
    and blurred, especially after something sweet
  周末外出一天,外食一餐: Out for a day at the weekend; one meal eaten out
  地铁线路调整: Metro route changed
  居室日常更换: Routine household replacement
  户外活动,当日无不适: Outdoor activity; no discomfort that day
  旧机故障后更换: Replaced after the previous appliance failed
  晚间一小时,屏幕时间增加: One hour in the evening; increased screen time
  术后需照料数日: Needed care for several days after surgery
  每周一次,室内活动: Weekly indoor activity
  物业检修,当日恢复: Building management maintenance; service restored the same day
  白天有噪音: Noise during the day
  胃肠道反应明显，停用: Stopped because of marked gastrointestinal side effects
  设备日常维护: Routine device maintenance
  多囊卵巢综合征(PCOS) + 原发性甲状旁腺功能亢进(高钙血症): polycystic ovary syndrome (PCOS) + primary hyperparathyroidism (hypercalcaemia)
  多囊卵巢综合征(PCOS) + 系统性红斑狼疮(SLE): polycystic ovary syndrome (PCOS) + systemic lupus erythematosus (SLE)
  阻塞性睡眠呼吸暂停(OSA) + 胰岛素抵抗: obstructive sleep apnoea (OSA) + insulin resistance
  # Registry-wide coverage (tests/i18n_en/registry_text.yaml): symptom_lay sentences and lookalike contexts.
  我一直都是瘦瘦的,血糖却一下子升得很快: I've always been slim, yet my blood sugar has suddenly gone up very quickly
  人本来就瘦,血糖这回涨得特别快: I'm slim to begin with, but this time my blood sugar has gone up especially fast
  一直瘦瘦的,血糖却几个月里蹿上去了: I've always been slim, but my blood sugar has shot up within a few months
  皮肤变得灰灰暗暗的,像古铜色,可我没怎么晒太阳: My skin has turned greyish and dark, like bronze, but I've hardly been in the sun
  最近皮肤发灰发暗,有点像古铜色,也没晒过什么太阳: Lately my skin has gone grey and dark, a bit like bronze, and I haven't really been out
    in the sun
  皮肤颜色变深变暗,像古铜色,没怎么晒太阳却这样: My skin has turned a deeper, darker colour, like bronze, even though I've hardly been in
    the sun
  嗓子发哑,说话声音变粗了: My voice has gone hoarse and coarser when I speak
  手掌纹路和牙龈变黑了: The creases of my palms and my gums have turned dark
  拉了一次肚子,有点恶心,一起吃饭的人也这样: I had diarrhoea once and felt a bit nauseous, and the people I ate with had the same
  那天吃完饭恶心、拉肚子,同桌的也有: After a meal that day I felt nauseous and had diarrhoea, and others at my table had it too
  拉肚子加恶心,就一回,和我一起吃饭的几个人也拉了: I had diarrhoea and nausea, just the once. Several people who ate with me had diarrhoea
    too
  嘴唇老是干得裂口子、掉皮,换季时更厉害: My lips keep getting so dry they crack and peel, worse when the seasons change
  一到秋冬换季,嘴唇就干裂起皮,抹润唇膏能好点: Whenever autumn turns to winter my lips get dry, cracked and peeling. Lip balm helps a bit
  秋冬交替嘴唇就干裂脱皮: Between autumn and winter my lips get dry, cracked and peeling
  两只眼睛干涩,像有东西在里面,到傍晚更厉害: Both my eyes feel dry and gritty, as if something is in them, and it gets worse by the evening
  最近盯电脑时间长,两只眼睛发干、磨得慌,傍晚更明显: I've been staring at the computer for long stretches lately. Both eyes feel dry and scratchy,
    more so in the evening
  双眼干,总觉得进了沙子,快天黑时加重: Both eyes are dry and always feel as if there's sand in them, worse towards dusk
