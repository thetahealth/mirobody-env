    \ symptoms into one disease is a typical error; `independent` is a valid answer.\n   In `join_evidence`,\
    \ list the symptom evidence IDs supporting this judgement, **at least 2**, copied exactly from evidence_ledger.\n\
    ④ `tests_to_order` / `referral_specialty` -- which investigations and specialty referral would confirm\
    \ your leading diagnosis?\n\napproved_action_classes = {actions}\n\npre-T data (JSON):\n{payload}\n\
    \nOutput only one JSON object (no additional text/markdown), schema:\n{{\"differential\":[{{\"rank\"\
    :1,\"diagnosis\":\"...\",\"certainty\":\"definite|probable|possible|rule_out\",\n  \"supporting_evidence\"\
    :[\"EV-...\"],\"ruled_out_by\":null}},{{\"rank\":2,\"diagnosis\":\"...\",\n  \"certainty\":\"definite|probable|possible|rule_out\"\
    ,\"supporting_evidence\":[\"EV-...\"],\n  \"ruled_out_by\":\"EV-...\"}}],\n\"signal_evidence\":[\"\
    EV-...\"],\"incidental_evidence\":[\"EV-...\"],\n\"join_type\":\"unified|comorbidity|independent\"\
    ,\n\"join_reason\":\"one sentence explaining this grouping\",\"join_evidence\":[\"EV-...\",\"EV-...\"\
    ],\n\"tests_to_order\":[\"...\"],\"referral_specialty\":[\"...\"],\n\"forecast\":{{\"risk_category\"\
    :\"low|elevated|high|indeterminate\"}},\n\"action\":{{\"selected_action_class\":\"A0|A1|A2|A3|A4|A5\"\
    ,\"specific_action\":\"...\",\"what_not_to_do\":[\"...\"],\"clinician_review_required\":true,\"followup_interval\"\
    :\"7d\"}},\n\"data_quality\":{{\"data_sufficiency\":\"sufficient|insufficient_data\",\"signal_quality\"\
    :{{}}}},\n\"cited_evidence\":[\"EV-...\"]}}\nAlso provide a \"trace\" object describing your **reasoning\
    \ process** (used only for process assessment, not conclusion scoring):\n\"trace\":{{\"hypotheses\"\
    :[{{\"name\":\"hypothesis name\",\"status\":\"considered|supported|excluded\",\n\"evidence_for\":[\"\
    EV-...\"],\"evidence_against\":[\"EV-...\"]}}],\n\"tool_calls\":[{{\"target\":\"signal or investigation\
    \ you wanted to check\",\"why\":\"reason for checking\"}}],\n\"commitments\":[{{\"claim\":\"judgement\
    \ you currently commit to\",\"falsified_by\":\"observation that would overturn it\"}}],\n\"data_notes\"\
    :[\"data quality issue\"],\"scope\":\"what you consider outside the scope of this assessment\"}}\n\
    ⚠️ List only evidence IDs you **actually** relied on. If you cannot supply them, leave an empty array:\
    \ **no process-score penalty** for an empty array; fabricated evidence will be detected."
