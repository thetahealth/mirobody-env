  runtime.p2.source_question: 'Recommend a disposition using the patient record and protocol library.


    Choose one of four dispositions: `ed_now` emergency department immediately · `within_24h` seek medical
    care within 24 hours · `routine_followup` routine follow-up · `watchful_waiting` observation at home.


    Medical boundary (mandatory): do not independently prescribe, stop medication or change doses.


    Patient data (JSON):

    {payload}


    Output only one JSON object (no additional text/markdown), schema:

    {{"disposition":"ed_now|within_24h|routine_followup|watchful_waiting",

    "rule":"rule ID from the protocol used",

    "evidence":["supporting patient records"],

    "reason":"one-sentence rationale"}}

    The answer JSON must also include management_plan: free text in English fully describing next steps,
    investigations to repeat or purchase, an explanation for the patient and follow-up arrangements. State
    explicitly if no additional investigations are needed.'
  runtime.p3.plugin.module.1: 'Recommend today''s management for this medication follow-up record. The
    header gives the visit type, today''s date, the patient''s own words and all current chronic medication.

    Review outpatient progress notes, laboratory results, prescriptions, dispensing, home monitoring and
    the symptom diary to identify the current drug requiring assessment at this visit.

    Enter its name in `target_drug`; identify the drug assessed even if you maintain treatment. Use this
    clinic''s protocols to select one `med_decision`:

    `uptitrate` increase dose · `downtitrate` reduce dose · `maintain` continue current dose ·

    `switch` do not increase this drug further; switch to or add another drug ·

    `check_adherence_or_adverse_effect` check adherence, adverse effects or other causes first; do not
    change the dose yet

    (select dose reduction for adverse effects already attributable to this drug''s dose).

    Enter the adjusted dose in `new_dose` (null for maintain, switch or investigate first); list supporting
    records in `rationale_evidence`.

    Your recommendation is to be implemented after clinician review: `action.clinician_review_required`
    must be true for dose changes or switching medication.


    pre-T data (JSON):

    {payload}


    Output only one JSON object (no additional text/markdown), schema:

    {{"med_decision":"uptitrate|downtitrate|maintain|switch|check_adherence_or_adverse_effect",

    "target_drug":"drug name","new_dose":null,

    "rationale_evidence":["supporting records"],

    "action":{{"selected_action_class":"A3","specific_action":"specific next step in one sentence","clinician_review_required":true}}}}'
