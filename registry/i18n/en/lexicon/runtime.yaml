  runtime.framing.P2_TRIAGE_PROMPT: 'You are triaging for a health assistant. A patient has sent recent
    wearable and home measurements and a message through an online health assistant, asking whether to
    seek hospital care.

    `prediction_context.triage_p2` contains all triage information for this patient today (`today_day`):

    `message`: the patient''s own words; `intake_checklist`: the completed symptom screen; `urgent_symptoms`
    lists positive symptoms only.

    `urgent_screen_complete=true` means all other acute symptoms were asked about and denied; an empty
    list means none are present. Other items are yes/no.

    `mild_new_symptom`: mild symptoms starting today or in the preceding 3 days;

    `background`: known chronic conditions and medication;

    `home_check_today`: today''s home measurements (thermometer, finger pulse oximeter and blood pressure
    monitor; respiratory rate counted by a family member for one minute; on room air);

    `wearable_daily`: daily watch data for the last 10 days (resting heart rate, HRV, lowest overnight
    oxygen saturation, skin temperature deviation, steps, sleep, irregular rhythm alerts, peak exercise
    heart rate, wear notes);

    `home_bp_log`: home blood pressure over the last 7 days (twice daily; today''s last reading is today''s
    measurement); `morning_weight`: morning weights over the last 10 days;

    `cgm_nightly`: lowest overnight CGM readings over the last 7 nights for patients with diabetes (`night_of_day`
    = the night following that day).

    Other fields contain earlier records for background.


    This service''s triage rules (apply in order; the first matching rule decides; "either" means both
    dispositions are accepted):

    R0 Any positive item in the symptom checklist: chest pain or pressure, fainting, new confusion, breathlessness
    at rest, unilateral limb weakness or slurred speech → emergency department immediately.

    R1 Calculate NEWS2 from today''s home measurements (RCP 2017, SpO2 Scale 1, on room air; consciousness
    from the checklist). NEWS2 ≥ 7 → emergency department immediately.

    R2 NEWS2 5–6 → emergency department immediately.

    R3a NEWS2 ≤ 4 but respiratory rate ≤ 8 or ≥ 25/min, systolic blood pressure ≤ 90 mmHg, heart rate
    ≥ 131/min, or home temperature < 35.0 ℃ (suspected hypothermia; each scores 3 individually) → emergency
    department immediately. Check the low temperature immediately; waiting for a repeat measurement must
    not delay seeking help.

    R3b NEWS2 ≤ 4 with room-air SpO2 ≤ 91% (individual score 3) → either emergency department immediately
    or medical care within 24 hours is acceptable.

    R3c NEWS2 ≤ 4 with heart rate ≤ 40/min (individual score 3), without R0 symptoms → either emergency
    department immediately or medical care within 24 hours is acceptable.

    R3 NEWS2 ≤ 4 with another individual score of 3 (temperature = 35.0 ℃, systolic blood pressure ≥ 220
    mmHg) → seek care within 24 hours. Temperature ≤ 35.0 ℃ still scores 3 in NEWS2; below 35.0 ℃ already
    requires immediate emergency care under R3a.

    R4 Diabetes with an episode of hypoglycaemia requiring another person''s assistance in the last 3
    days (ADA level 3) → either emergency department immediately or medical care within 24 hours is acceptable.

    R5 ≥ 2 of the last 7 nights with a CGM minimum < 3.0 mmol/L (ADA level 2) → medical care within 24
    hours to review glucose-lowering treatment.

    R6 ≥ 2 home blood pressure readings ≥ 180/110 mmHg today (either systolic or diastolic threshold),
    with severe headache or blurred vision on the checklist → emergency department immediately.

    R7a Heart failure with ≥ 2 readings ≥ 180/110 mmHg today without the symptoms above → medical care
    within 24 hours.

    R7 ≥ 2 readings ≥ 180/110 mmHg today without the symptoms above → prompt review (ESC 2024: preferably
    within a week); either medical care within 24 hours or routine follow-up is acceptable.

    R8 Heart failure with today''s morning weight more than 2 kg above the morning weight 3 days ago →
    medical care within 24 hours (or increase diuretic as prescribed and contact the clinician today).

    R9 ≥ 2 watch irregular rhythm alerts in the last 3 days without R0 symptoms → medical care within
    24 hours for an ECG (watch alerts cannot establish atrial fibrillation).

    R10 NEWS2 1–4 with no individual score of 3 → either routine follow-up or clinician assessment within
    24 hours is acceptable; persistent symptoms or comorbidities such as heart failure require timely
    reassessment using the record.

    R11 Diabetes with overnight minima < 3.9 but none below 3.0 mmol/L over the last 7 nights (ADA level
    1) → routine follow-up.

    R12 ≥ 2 home blood pressure readings ≥ 140/90 mmHg today, below R6/R7 criteria → routine follow-up.

    R13 NEWS2 0 with mild symptoms only (sore throat, cough, etc.) → either observation at home or routine
    follow-up is acceptable.

    R14 None of the above → observation at home. An isolated wearable abnormality (exercise watch heart
    rate, oxygen saturation with a loose watch, one poor night''s sleep) does not alone determine disposition
    when a reliable repeat today or readings on other days are normal. Today''s reliable finger oxygen
    saturation, home heart rate and other earlier rules still apply.

    Even 1 of the last 7 nights with CGM minimum < 3.0 mmol/L (level 2) requires verification of the low
    reading and precipitants and clinician review of glucose-lowering treatment; it cannot be dismissed
    as unrelated. If the first matching disposition is routine follow-up or observation at home, this
    clinic accepts assessment within 24 hours or routine follow-up with prompt treatment review, but not
    observation at home alone. Earlier, more urgent rules are not downgraded.


    Choose one of four dispositions: `ed_now` emergency department immediately · `within_24h` seek medical
    care within 24 hours · `routine_followup` routine follow-up · `watchful_waiting` observation at home.


    Medical boundary (mandatory): do not independently prescribe, stop medication or change doses.


    Patient data (JSON):

    {payload}


    Output only one JSON object (no additional text/markdown), schema:

    {{"disposition":"ed_now|within_24h|routine_followup|watchful_waiting",

    "rule":"ID of the rule used from R0..R14",

    "evidence":["supporting readings, e.g. home_check_today.spo2_pct=92"],

    "reason":"one-sentence rationale"}}'
