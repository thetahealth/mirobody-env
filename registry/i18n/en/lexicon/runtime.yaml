    from the source
  runtime.interaction.extract.fill_gold_from_text.6: The text does not explicitly state a diagnosis ⇒
    do not infer one
  runtime.interaction.extract.fill_gold_llm.10: primitive=intermediate severity depends on the disease
    (neither biconditional applies); the model judged only this level; both extremes are still derived
  runtime.interaction.extract.fill_gold_llm.11: wq.derive_urgency(same rule)
  runtime.interaction.extract.fill_gold_llm.13: This path does not produce this field
  runtime.interaction.extract.fill_gold_llm.2: The model reports uncertainty ⇒ discard; do not supply
    defaults
  runtime.interaction.extract.fill_gold_llm.3: LLM adjudication, not transcription
  runtime.interaction.extract.fill_gold_llm.4: wq.derive_clinician_warranted(same rule)
  runtime.interaction.extract.fill_gold_llm.5: independent(no unifying pathology)⇒ no clinical action
    required
  runtime.interaction.extract.fill_gold_llm.6: unified(an identifiable disease is present)⇒ clinical action
    required
  runtime.interaction.extract.fill_gold_llm.7: ' -- the same rule as wq.derive_clinician_warranted, without
    asking the model'
  runtime.interaction.extract.module.1: "You are an **information extractor**, not a clinician. **Transcribe**\
    \ facts only from the case description below.\n\nStrict rules:\n1. **Extract only what is explicitly\
    \ stated.** Use `null` for anything not stated; **never infer or add general knowledge**.\n2. **Do\
    \ not diagnose, assess severity or recommend investigations**; these are outside your task.\n3. Convert\
    \ dates to integer days from the start of the course. Convert relative dates (e.g. \"two weeks later\"\
    ) accordingly;\n   if a complaint cannot be placed in time, set `day` to null.\n\nOutput **plain JSON**,\
    \ without ``` or explanation:\n{{\n  \"disease\": \"one of {diseases}, or null\",\n  \"age_range\"\
    : \"e.g. 45-49, or null\",\n  \"sex\": \"M|F|null\",\n  \"bmi\": number or null,\n  \"comorbidities\"\
    : [\"...\"] or [],\n  \"drug\": \"**must be one of these** (convert a Chinese or brand name in the\
    \ case to the corresponding English name):{drugs}; null if none applies\",\n  \"dose_steps\": [numbers]\
    \ or [],\n  \"devices\": [a subset of {devices}] or [],\n  \"start_weight\": number or null,\n  \"\
    nadir_weight\": number or null,\n  \"symptoms\": [{{\"day\": integer or null, \"text\": \"patient's\
    \ exact complaint\", \"context\": \"additional context, or an empty string if absent\"}}]\n}}\n\n\
    Case description:\n---\n{text}\n---"
  runtime.interaction.extract.module.2: High-intensity interference injects additional events not counted
    in the declared density ⇒ event_density_mismatch. Model its contribution to density first; handle
    separately.
  runtime.interaction.extract.sample_knobs.1: Deterministic sampling (the same case_id always gives the
    same set), not text extraction
  runtime.interaction.gated._base_synth_on_demand.1: Positive / abnormal, suggesting a pathological change
  runtime.interaction.gated._base_synth_on_demand.2: Negative / no significant abnormality detected
  runtime.interaction.prompts.module.1: 'You are predicting longitudinal health deterioration. Using only
    the data before index-time T (pre-T) below, predict the predefined future event, give competing attributions
    and choose a safe action from the approved set.


    Medical boundaries (mandatory; violations fail): do not diagnose, independently prescribe, stop medication
    or change doses, assert causation without evidence, or reassure about red-flag symptoms. If evidence
    is insufficient, abstain or recommend collecting data/referral. Every claim must cite an EV id from
    evidence_ledger; do not invent EVs.


    target_event_type = {target}

    allowed_drivers = {drivers}

    approved_action_classes = {actions}


    pre-T data (JSON):

    {payload}


    Output only one JSON object (no additional text/markdown), schema:

    {{"forecast":{{"target_event":"...","risk":0.0-1.0,"risk_category":"low|elevated|high|indeterminate",

    "confidence":0.0-1.0,"key_predictive_evidence":["EV-..."]}},

    "drivers":[{{"rank":1,"driver":"<one of allowed_drivers>","causal_status":"association_only|plausible_contributor|strongly_supported_contributor|contradicted|unresolved|causally_confirmed","evidence_for":["EV-..."]}}],

    "action":{{"selected_action_class":"A0|A1|A2|A3|A4|A5","specific_action":"...","what_not_to_do":["..."],"clinician_review_required":true,"followup_interval":"7d"}},

    "data_quality":{{"data_sufficiency":"sufficient|insufficient_data","signal_quality":{{}}}},

    "cited_evidence":["EV-..."]}}'
