  runtime.p4.plugin.module.1: "You are interpreting follow-up laboratory tests. Below are all visible data\
    \ for a patient up to and including index-time T.\n`prediction_context.followup_p4` is today's (day\
    \ T) follow-up test: all historical and current readings for the indicator,\neach with blood draw time,\
    \ recorded fasting status, specimen handling (time before centrifugation, haemolysis index), testing\
    \ institution and method.\n`diet_record` records diet before the previous (`previous_draw_day`) and\
    \ current blood draws; `medication_record` records medication;\n`specimen_policy` is the laboratory's\
    \ printed specimen stability policy; `patient_remarks` contains the patient's statements at these blood\
    \ draws.\nSee `longitudinal_data` for weight and other data.\n\nAssess the change from the previous\
    \ to the current reading:\n① `change_source`, choose one of four sources:\n   true_change: a sustained\
    \ change in the level of the measurand within the patient or in the clinical course, supported by timing,\
    \ direction and course records. Do not treat assay interference as a pharmacological effect within the\
    \ patient.\n   analytic_biological_noise: analytical imprecision and random within-person variation.\
    \ Use when the patient is stable and there is no evidence of a matching sampling, method or clinical\
    \ source. RCV assesses statistical magnitude; it cannot establish the source on its own.\n   preanalytical:\
    \ changes in preparation, intake, collection conditions, transport or specimen handling before testing\
    \ that affect comparability. Transient exercise and time-of-day differences also count as sampling conditions\
    \ in this task. When an ingested substance interferes with the assay outside the body, method_difference\
    \ is also accepted.\n   method_difference: systematic differences between methods, platforms or reagent\
    \ lots, or verified interference with the analytical reaction. Evidence must apply to the analyte, date\
    \ and method. A method name or platform-change notice alone cannot establish the source.\n   Category\
    \ sources: CLSI EP07, edition 3, Scope (exogenous/endogenous chemical interference); CLSI EP09 Scope\
    \ (patient-sample method comparison); EFLM-COLABIOCLI venous blood sampling recommendations, Patient\
    \ preparation; Fraser 2012, Reference change values (PMID 21958344); for ingested interferents, also\
    \ the FDA biotin safety communication and AACC 2020 guidance (doi:10.1093/jalm/jfz010). Category overlap\
    \ and the classification of transient sampling conditions are task conventions pending clinical review.\n\
    ② `factor`: the factor causing the change (choose from the schema; use null for measurement error and\
    \ biological variation).\n③ `true_change_pct`: percentage change in the true level from the previous\
    \ to the current measurement (negative for a decrease).\n④ `next_step`: `act_on_change` manage on the\
    \ basis of this change · `repeat_standardized` repeat under standard conditions before deciding ·\n\
    \   `no_action` no action needed for this change.\n\nThe next step is required. repeat_standardized\
    \ includes a new blood draw after appropriate washout, or interpretation using a verified unaffected\
    \ method. no_action means no additional intervention for this historical difference; routine follow-up\
    \ continues. If ingested interference affected only the previous reading and today's reading is standard,\
    \ treat it as a distortion of the previous reading; no_action is acceptable. If it affected today's\
    \ reading, no_action is acceptable when the exposure has ended and subsequent clean results are available;\
    \ ongoing exposure requires verification.\n\nMedical boundary (mandatory): do not independently prescribe,\
    \ stop medication or change doses.\n\npre-T data (JSON):\n{payload}\n\nOutput only one JSON object (no\
    \ additional text/markdown), schema:\n{{\"change_source\":\"true_change|analytic_biological_noise|preanalytical|method_difference\"\
    ,\n\"factor\":\"glp1_dose_change|weight_change|acei_start_or_stop|postprandial_labelled_fasting|delayed_processing|meat_meal|poc_meter|jaffe_enzymatic_switch|infusion_sampling|hemolysis|edta_contamination|cold_delayed_separation|nonfasting|glucose_glycolysis|recent_exercise|sampling_time|platform_calibration|reagent_lot|biotin_tsh|dehydration|thiazide|gastrointestinal_loss|glucocorticoid|acute_illness|thyroiditis|thyroxine_adherence|hepatotoxic_drug|alcohol_change|statin_myopathy|muscle_injury|fibrate_adherence|null\"\
    ,\n\"true_change_pct\":-12.0,\n\"next_step\":\"act_on_change|repeat_standardized|no_action\",\n\"reason\"\
    :\"one-sentence rationale\"}}"
