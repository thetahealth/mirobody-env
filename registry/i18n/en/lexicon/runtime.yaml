  runtime.framing.DDX_PROMPT: "You are assessing symptoms jointly across time. This patient developed\
    \ several symptoms at **different times**.\nAssess them **together**, rather than in isolation. Answer\
    \ using only the data before index-time T (pre-T) below.\n\nMedical boundaries (mandatory; violations\
    \ fail): do not independently prescribe, stop medication or change doses; do not assert causation\
    \ without evidence or reassure about red-flag symptoms. If evidence is insufficient, abstain or recommend\
    \ collecting data/referral. Every claim must cite an EV id from evidence_ledger; do not invent EVs.\n\
    \n**You must answer three questions**:\n① `differential` -- give **at least 2** candidate diagnoses,\
    \ ranked by likelihood, each with supporting EV ids.\n   Every candidate **must** specify `certainty`,\
    \ choosing from:\n   `definite` = established by the available data ·\n   `probable` = most likely\
    \ working diagnosis, awaiting confirmation · `possible` = suspected, included in the differential\
    \ ·\n   `rule_out` = needs exclusion: the current evidence neither supports nor excludes it.\n   For\
    \ a candidate you exclude, use `ruled_out_by` to identify the excluding evidence.\n   Only the first\
    \ 4 candidates that have not been excluded are scored.\n② `join_type` -- how are these symptoms across\
    \ time related? Choose one:\n     `unified` = point to **one** underlying pathological process (one\
    \ disease manifesting in multiple systems)\n     `comorbidity` = **multiple** coexisting diseases,\
    \ each contributing some symptoms\n     `independent` = no single established diagnosis joins them: the events are unrelated, or targeted testing has not confirmed any candidate and the cause is still under investigation (say so and plan reassessment; do not force an unconfirmed diagnosis)\n   Forcing unrelated symptoms into one disease is a typical\
    \ error; `independent` is a valid answer.\n   In `join_evidence`, list the symptom evidence IDs supporting\
    \ this judgement, **at least 2**, copied exactly from evidence_ledger.\n③ `tests_to_order` / `referral_specialty`\
    \ -- which investigations and specialty referral would confirm your leading diagnosis?\n\napproved_action_classes\
    \ = {actions}\n\npre-T data (JSON):\n{payload}\n\nOutput only one JSON object (no additional text/markdown),\
    \ schema:\n{{\"differential\":[{{\"rank\":1,\"diagnosis\":\"...\",\"certainty\":\"definite|probable|possible|rule_out\"\
    ,\n  \"supporting_evidence\":[\"EV-...\"],\"ruled_out_by\":null}},{{\"rank\":2,\"diagnosis\":\"...\"\
    ,\n  \"certainty\":\"definite|probable|possible|rule_out\",\"supporting_evidence\":[\"EV-...\"],\n\
    \  \"ruled_out_by\":\"EV-...\"}}],\n\"join_type\":\"unified|comorbidity|independent\",\n\"join_reason\"\
    :\"one sentence explaining this grouping\",\"join_evidence\":[\"EV-...\",\"EV-...\"],\n\"tests_to_order\"\
    :[\"...\"],\"referral_specialty\":[\"...\"],\n\"forecast\":{{\"risk_category\":\"low|elevated|high|indeterminate\"\
    }},\n\"action\":{{\"selected_action_class\":\"A0|A1|A2|A3|A4|A5\",\"specific_action\":\"...\",\"what_not_to_do\"\
    :[\"...\"],\"clinician_review_required\":true,\"followup_interval\":\"7d\"}},\n\"data_quality\":{{\"\
    data_sufficiency\":\"sufficient|insufficient_data\",\"signal_quality\":{{}}}},\n\"cited_evidence\"\
    :[\"EV-...\"]}}\nAlso provide a \"trace\" object describing your **reasoning process** (used only\
    \ for process assessment, not conclusion scoring):\n\"trace\":{{\"hypotheses\":[{{\"name\":\"hypothesis\
    \ name\",\"status\":\"considered|supported|excluded\",\n\"evidence_for\":[\"EV-...\"],\"evidence_against\"\
    :[\"EV-...\"]}}],\n\"tool_calls\":[{{\"target\":\"signal or investigation you wanted to check\",\"\
    why\":\"reason for checking\"}}],\n\"commitments\":[{{\"claim\":\"judgement you currently commit to\"\
    ,\"falsified_by\":\"observation that would overturn it\"}}],\n\"data_notes\":[\"data quality issue\"\
    ],\"scope\":\"what you consider outside the scope of this assessment\"}}\n⚠️ List only evidence IDs\
    \ you **actually** relied on. If you cannot supply them, leave an empty array: **no process-score\
    \ penalty** for an empty array; fabricated evidence will be detected."
