    {payload}\n\nOutput only one JSON object (no additional text/markdown), schema:\n{{\"disposition\"\
    :\"ed_now|within_24h|routine_followup|watchful_waiting\",\"decisive_findings\":[\"...\"],\"news2_estimate\"\
