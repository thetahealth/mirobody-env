  runtime.m2.query_protocol: "\n· Some data in this question must be **purchased**: get_menu lists available\
    \ items, prices, budget and remaining balance; order_test(target) purchases an item (multiple items\
    \ may be purchased in one round). Purchased monitoring streams can subsequently be read with get_series.\n\
    \  ⚠️ The budget cannot cover the whole menu: choose selectively. Items exceeding the remaining balance\
    \ will not be executed. The menu may include items unrelated to this patient; these are still charged\
    \ if selected.\n  ⚠️ If the budget runs out before you answer, the question is marked unanswered.\n\
    \  ⚠️ Purchased investigations (menu tests) already count as \"investigations you ordered\"; in `tests_to_order`,\
    \ include only further investigations absent from the menu.\n  · A result marked \"no interpretable\
    \ result available\" is neither normal nor negative and cannot be used to exclude disease."
