entries:
  已核实且未撤销的 ACEI 相关血管性水肿记录适用于本类药；本次核对到此项而目前仍在用依那普利时，不加量，应由临床人员复核并更换方案。其他药物的记录、尚未确认或已排除的记录不据此禁用 ACEI。: >-
    A verified, unretracted record of ACEI-related angioedema applies to this drug class.
    If this history is found on review and the patient is still taking enalapril, do not
    increase the dose; clinical staff should review and replace the regimen. Records
    concerning other medicines, unconfirmed records and excluded reactions do not
    establish an ACEI contraindication.
  核对用药及加量前肝功能原报告，并查看治疗调整后的复查；原 CK、转氨酶与处方记录要按日期对照，不能以一次症状代替原始化验。: >-
    Check medication use and the original liver function report before dose escalation,
    together with repeat results after the treatment change. Compare the original CK,
    transaminase and prescription records by date; a single symptom episode cannot
    substitute for the original laboratory results.
