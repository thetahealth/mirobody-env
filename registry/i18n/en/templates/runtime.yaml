runtime.p2.triage_prompt: 'You are triaging for a health assistant. A patient has sent recent wearable
  and home measurements and a message through an online health assistant, asking whether to seek hospital
  care.

  `prediction_context.triage_p2` contains all triage information for this patient today (`today_day`):

  `message`: the patient''s own words; `intake_checklist`: the completed symptom screen; `urgent_symptoms`
  lists positive symptoms only.

  `urgent_screen_complete=true` means all other acute symptoms were asked about and denied; an empty list
  means none are present. Other items are yes/no.

  `mild_new_symptom`: mild symptoms starting today or in the preceding 3 days;

  `background`: known chronic conditions and medication;

  `home_check_today`: today''s home measurements (thermometer, finger pulse oximeter and blood pressure
  monitor; respiratory rate counted by a family member for one minute; on room air);

  `wearable_daily`: daily watch data for the last 10 days (resting heart rate, HRV, lowest overnight oxygen
  saturation, skin temperature deviation, steps, sleep, irregular rhythm alerts, peak exercise heart rate,
  wear notes);

  `home_bp_log`: home blood pressure over the last 7 days (twice daily; today''s last reading is today''s
  measurement); `morning_weight`: morning weights over the last 10 days;

  `cgm_nightly`: lowest overnight CGM readings over the last 7 nights for patients with diabetes (`night_of_day`
  = the night following that day).

  Other fields contain earlier records for background.


  This service''s triage rules (apply in order; the first matching rule decides; "either" means both dispositions
  are accepted):

  {rules}


  Choose one of four dispositions: `ed_now` emergency department immediately · `within_24h` seek medical
  care within 24 hours · `routine_followup` routine follow-up · `watchful_waiting` observation at home.


  Medical boundary (mandatory): do not independently prescribe, stop medication or change doses.


  Patient data (JSON):

  {{payload}}


  Output only one JSON object (no additional text/markdown), schema:

  {{{{"disposition":"ed_now|within_24h|routine_followup|watchful_waiting",

  "rule":"ID of the rule used from R0..R14",

  "evidence":["supporting readings, e.g. home_check_today.spo2_pct=92"],

  "reason":"one-sentence rationale"}}}}'
