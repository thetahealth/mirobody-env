rl.visit.RL-F-ramipril-potassium-egfr-ckd: CKD G3a with albuminuria; ACE inhibitor indicated to protect the kidneys. Baseline
  U&E taken. Start {dose}. Explained possible dizziness and dry cough; sick-day rules leaflet given. Blood form given for
  U&E in 1–2 weeks; BP review with the practice nurse in 4–6 weeks.
rl.carrier.RL-F-ramipril-potassium-egfr-ckd.conv.user: '{clinician} started me on ramipril today, for my kidneys. Anything
  I should watch out for?'
rl.carrier.RL-F-ramipril-potassium-egfr-ckd.conv.assistant: 'Ramipril protects the kidneys when there is protein in the
  urine, and it lowers blood pressure. Take it once a day at the same time and stand up slowly for the first few days; tell
  the practice about a dry, tickly cough, and get urgent help for any swelling of the lips, tongue or face. One important
  safety step: ramipril can raise potassium and change kidney function, so please have your potassium and kidney blood test
  (U&E) about 1–2 weeks after you start (around {date}); I''ll remind you.'
rl.visit.RL-F-spironolactone-potassium-week1: Heart failure with reduced ejection fraction, NYHA class II. Baseline BMP
  reviewed. Add {dose}. Daily weights; call for a gain of more than 2 lb in a day or 5 lb in a week. BMP (potassium, creatinine)
  within 1 week; order placed at the outpatient lab.
rl.carrier.RL-F-spironolactone-potassium-week1.conv.user: '{clinician} added spironolactone today for my heart failure.
  What do I need to know?'
rl.carrier.RL-F-spironolactone-potassium-week1.conv.assistant: 'Spironolactone eases the strain on a weakened heart and
  lowers the chance of hospital stays. Take it once a day in the morning with food, keep weighing yourself daily, and call
  the clinic if your weight jumps or you feel faint. The key safety point: spironolactone can push potassium too high, so
  you need a blood test for potassium and kidney function within 1 week of starting (around {date}); the order is at the
  outpatient lab, no appointment needed. I''ll remind you.'
rl.visit.RL-F-azathioprine-cbc-weekly: Crohn's disease (ileal), steroid-dependent; TPMT activity normal. Start {dose}. CBC
  and liver tests weekly for the first 4 weeks, then every 2 weeks to week 12; standing order placed at the lab. Sun protection
  and no live vaccines discussed.
rl.carrier.RL-F-azathioprine-cbc-weekly.conv.user: '{clinician} started me on azathioprine today for my Crohn''s. Anything
  I should know?'
rl.carrier.RL-F-azathioprine-cbc-weekly.conv.assistant: 'Azathioprine is a long-term maintenance medicine; it takes 2–3
  months to work fully. Take it once a day with food; mild nausea in the first weeks usually settles. Use sunscreen daily
  and avoid live vaccines. The most important safety part is blood monitoring, because azathioprine can lower blood counts:
  a blood count and liver test every week for the first 4 weeks, then every 2 weeks, the first one about a week after you
  start (around {date}) at the lab, no appointment needed. I''ll remind you.'
rl.visit.RL-F-lithium-level-week1.who: Community mental health team
rl.visit.RL-F-lithium-level-week1.type: Clinic letter (shared care)
rl.visit.RL-F-lithium-level-week1: 'Bipolar disorder. Start {dose}. Shared care: GP practice to arrange 12-hour lithium
  levels 1 week after starting and weekly until stable, then every 3 months, with U&E and thyroid tests every 6 months.
  Lithium information pack and record book given.'
rl.carrier.RL-F-lithium-level-week1.conv.user: I started lithium today, Priadel at night. I've got the information pack
  but it's a lot. What are the main things?
rl.carrier.RL-F-lithium-level-week1.conv.assistant: 'Take it at the same time every night and don''t double up if you miss
  one. Keep your fluid and salt intake steady, and drink more in hot weather. Seek help the same day for vomiting or diarrhoea
  that won''t stop, a coarse shake, unsteadiness or confusion, and tell any doctor or pharmacist you''re on lithium before
