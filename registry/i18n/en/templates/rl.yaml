runtime.rl.plugin.framing: 'You are an AI assistant supporting a patient''s long-term health management. You have
  the patient''s longitudinal record below. Answer the user''s latest message. If anything in the record needs
  the patient''s or their clinician''s attention, tell the patient, even if they did not ask about it.


  Today''s date: {today}


  {record}

  User''s latest message: {question}


  Return JSON: {{"reply": "<your reply to the user>"}}'
runtime.rl.plugin.block: 'rl pack: the plan at generation; after the OBSERVE hook the realized truth (rule, arm,
  gold, facts, sweep, patch span, imminence). The visible record is prediction_context.redline_rl.'
runtime.rl.plugin.framing_why: rl single-round reply to an everyday question; the record carries one registered
  fact.
runtime.rl.plugin.why_not: rl is single round with the whole record visible; no menu, slices or multi-round tracking.
