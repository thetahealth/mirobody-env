p3.rule.absorption: Separate levothyroxine and calcium carbonate by about {hours} hours. If control is inadequate
  with concurrent intake, keep the current dose, check administration and address absorption interference before
  repeating; do not increase the dose immediately. With TSH in target and persistent symptoms, continue the current
  dose and investigate other causes first. An isolated resolved symptom does not count as a current persistent symptom;
  gliclazide-related hypoglycaemia still requires review even if food has relieved it.
p3.rule.top_check: "Clinic dose ceiling for {name}: if {axis} is still above target at the clinic's highest dose ({top} {unit}), do not increase the dose or change drugs; keep the dose and first check adherence, administration, malabsorption (such as gastrointestinal disease) and interacting medicines."
