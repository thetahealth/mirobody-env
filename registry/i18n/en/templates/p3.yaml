p3.review.documented_only: '{text}; any course not entered in the symptom diary is undocumented.'
当时有长途徒步，CK {ck} 倍上限，休息后消退，原剂量继续且耐受。: Long-distance hiking at the time; CK {ck} times the upper limit of normal.
  Symptoms subsided with rest; the original dose was continued and tolerated.
CK {ck} 倍上限，撤药随访症状未缓解；后再用原剂量无复发，已耐受。: CK {ck} times the upper limit of normal. Symptoms did not improve after withdrawal;
  subsequently tolerated the original dose on reintroduction, with no recurrence.
当时查出甲状腺功能减退，CK {ck} 倍上限；纠正后原剂量继续，无复发。: Hypothyroidism identified at the time; CK {ck} times the upper limit of normal.
  After correction, the original dose was continued without recurrence.
