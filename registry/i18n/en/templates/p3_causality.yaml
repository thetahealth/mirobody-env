p3.causality.withdrawal.yes: 'Complaint: {symptom}; first noticed on day {onset}. Treatment was held on day {hold}. By the review on day {resume}, the same complaint had improved during the hold.'
p3.causality.withdrawal.no: 'Complaint: {symptom}; first noticed on day {onset}. Treatment was held on day {hold}. By the review on day {resume}, the same complaint had not improved during the hold.'
p3.causality.alternative.yes: 'Complaint: {symptom}; first noticed on day {onset}. Another service assessed intercurrent illness and other medicines; an alternative explanation for the same complaint was supported by the documented course.'
p3.causality.alternative.no: 'Complaint: {symptom}; first noticed on day {onset}. Another service assessed intercurrent illness and other medicines; an alternative explanation for the same complaint was excluded by the documented course.'
p3.causality.alternative.unassessed: 'Complaint: {symptom}; first noticed on day {onset}. Other possible causes of this complaint have not yet been assessed.'
p3.causality.rechallenge.yes: 'Complaint: {symptom}; first noticed on day {onset}. The original dose was resumed on day {resume}; this follow-up records the same complaint after resumption. The symptom course during the hold is documented separately.'
p3.causality.rechallenge.no: 'Complaint: {symptom}; first noticed on day {onset}. The original dose was resumed on day {resume}; this follow-up records no change in the complaint after resumption. The symptom course during the hold is documented separately.'
p3.causality.protocol: 'For a documented hold/resumption course, this rule replaces onset-window or exposure-only attribution: assess the symptom from its onset relative to exposure, response during the hold and the separate assessment of other causes. Onset before exposure is not attributed to this exposure. After exposure, improvement during the hold with other causes excluded supports dose reduction. No improvement during the hold together with a documented alternative cause leaves the ordinary control-based decision unchanged. If either observation is missing or the findings disagree, first review causality. Rechallenge supports assessment but is not required. No fixed number of days establishes attribution. A temporary hold followed by resumption of the same prescribed dose retains the original tablet strength and dose-review clock. For the adherence assessment, the days of a documented hold are excluded from the assessment period; no tablets are used during the hold, so tablets on hand or collected during it carry forward to the resumption.'
p3.causality.hold: Temporary treatment hold for symptom assessment
