  do not attribute it to this drug''s dose. Do not adjust the dose yet; investigate other causes first.
  {pre}'
p3.rule.adherence: 'Local adherence assessment: estimate intake coverage over the latest {window} days
  (or since initiation if treatment duration is less than {window} days) from dispensing records and today''s
  pill count. Carry forward early-refill stock; when a new strength is dispensed on escalation day, exclude
  remaining old-strength stock. Coverage below {pct}% indicates poor adherence. If above target with poor
  adherence, do not adjust the dose yet; verify intake first.'
p3.rule.interval: 'Local reassessment interval: full effect is expected about {tau} days after increasing
  (or starting) this drug. Readings still above target within {half} days of increasing (or starting)
  treatment reflect an effect that has not yet fully developed; they do not establish failure of the dose
  increase.'
