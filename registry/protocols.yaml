- key: LIB-HEADACHE-RF
  name: 头痛的红旗筛查与转诊
  topics: &id010
  - 头痛
  - 红旗
  - 转诊
  keywords: *id010
  applies: 12 岁及以上，以头痛为主诉就诊。
  excludes:
  - text: 病历确诊偏头痛，且本次发作与既往头痛日记中的发作性质相同者不适用。
    needs_chart: true
  - text: 已确诊颅内占位或脑血管病、正在专科随访者不适用。
    needs_chart: true
  - text: 妊娠或产后 6 周内者不适用，走产科头痛规程。
    needs_chart: true
  steps:
  - 问红旗：发热伴头痛加重、5 分钟内达到最痛、新出现的神经功能缺损、认知或人格改变、意识受损、3 个月内头部外伤。
  - 另问：咳嗽或用力时诱发、体位性头痛、50 岁后新发并有颞部压痛、急性闭角型青光眼表现。
  - 5 分钟内达峰的雷击样头痛，或有新神经功能缺损、意识受损 → 转急诊。
  - 其余任一红旗 → 当日做进一步检查或转专科。
  - 新发头痛且有免疫低下、HIV 或恶性肿瘤史 → 同样进一步检查。
  - 无红旗 → 按原发性头痛处理，记录头痛日记，排查止痛药过度使用。
  exceptions:
  - 头痛同时有剧烈眼痛、视力下降、恶心呕吐者，先按青光眼处理，当日眼科会诊。
  source:
    cite: 'NICE CG150 (2012, updated 2021), Headaches in over 12s: diagnosis and management, recommendations 1.1.1–1.1.2;
      NHS, Headaches (nhs.uk/conditions/headaches)'
    url: https://www.nice.org.uk/guidance/cg150/chapter/Recommendations ; https://www.nhs.uk/conditions/headaches/
    locator: CG150 1.1.1；1.1.2；NHS「Immediate action required」
