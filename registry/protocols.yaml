- key: LIB-UTI-LOWER
  name: 非妊娠成年女性下尿路感染的处理
  topics: &id011
  - 尿路感染
  - 抗生素
  - 门诊
  keywords: *id011
  applies: 非妊娠成年女性，有尿频、尿痛症状，无发热、腰痛。
  excludes:
  - text: 妊娠者不适用。
    needs_chart: true
  - text: 男性或留置导尿管者不适用。
    needs_chart: true
  - text: 近 3 个月 eGFR < 45 者不适用呋喃妥因部分，改用其他一线药。
    needs_chart: true
  steps:
  - 先排除上尿路：发热、寒战、腰痛或恶心呕吐 → 转肾盂肾炎规程；尿试纸查白细胞酯酶与亚硝酸盐，两项均阴性则不太可能是细菌性尿路感染。
  - 一线：呋喃妥因缓释 100 mg，每日 2 次，共 3 天（要求 eGFR ≥ 45）；一线备选：甲氧苄啶 200 mg，每日 2 次，共 3 天（仅限耐药风险低者）。
  - 用药 48 小时症状无改善 → 送尿培养，换用二线药。
  - 6 个月内 ≥ 2 次或 12 个月内 ≥ 3 次发作 → 送尿培养并评估诱因。
  exceptions:
  - 近 3 个月用过甲氧苄啶或有耐药史者，不选甲氧苄啶，改用呋喃妥因。
  source:
    cite: 'NICE NG109 (2018), Urinary tract infection (lower): antimicrobial prescribing, first-choice antibiotics
      for non-pregnant women; NG111 for pyelonephritis'
    url: https://www.nice.org.uk/guidance/ng109/chapter/Recommendations
    locator: 「Choice of antibiotic」表；Pyelonephritis 指向 NG111
    verified: 非妊娠女性一线为呋喃妥因（eGFR ≥ 45）100 mg 缓释每日 2 次共 3 天，或甲氧苄啶（低耐药风险）200 mg 每日 2 次共 3 天；用药至少 48 小时无改善换二线；有肾盂肾炎症状或复杂性感染转看肾盂肾炎指南。
    verified_on: '2026-10-12'
  ours: true
