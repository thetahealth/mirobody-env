other:
- key: LIB-FEVER
  name: 成人发热的预检分诊
  topics: &id001
  - 发热
  - 预检
  - 感染
  keywords: *id001
  applies: 到院预检台，成人（16 岁及以上），测得体温 ≥ 38.0 ℃，尚未明确感染部位。
  excludes:
  - text: 16 岁以下者不适用。
    needs_chart: false
  - text: 正在化疗、中性粒细胞减少或长期使用免疫抑制剂者不适用，走肿瘤发热规程。
    needs_chart: true
  steps:
  - 休息 15 分钟后在同一部位复测体温，确认 ≥ 38.0 ℃。
  - 问诊：咳嗽气促、尿频尿痛、腹泻、皮疹、颈部僵硬、新出现的意识改变；有颈部僵硬或新出现的意识改变 → 转急诊处理。
  - 发热 ≤ 3 天、无上述症状、生命体征平稳 → 居家补液与退热，72 小时内复测。
  - 发热 > 3 天，或体温 ≥ 39.5 ℃ → 当日门诊评估。
  - 有局灶症状（咳嗽伴气促、尿路刺激症状）→ 转对应规程。
  exceptions:
  - 体温在腋下测得的，读数加 0.5 ℃ 后再按本表判断。
  source:
    cite: NHS, High temperature (fever) in adults (nhs.uk/conditions/fever-in-adults)
    url: https://www.nhs.uk/conditions/fever-in-adults/
    locator: 页面首段与「When to get medical help」
    verified: 页面存在；定义 38 ℃ 及以上为发热；「持续不退或加重」应就医。页面没有天数与更高体温的分档。
    verified_on: '2026-10-12'
  ours: true
  ours_reason: 3 天、39.5 ℃ 与腋温加 0.5 ℃ 为我们取的分档；来源只给发热定义与「加重应就医」。
  overlap: 与家庭监测分诊的感染类题目同主题；本条限定到院预检台，不读家庭监测数据。
  protocol_id: HP-B20737A0
- key: LIB-FALL
  name: 老年人跌倒后的评估
  topics: &id002
  - 跌倒
  - 老年
  - 用药审查
  keywords: *id002
  applies: 50 岁及以上（或衰弱者）近 1 年内跌倒、因跌倒就诊，头部未受外伤。
  excludes:
  - text: 本次跌倒伴头部外伤，且在服用抗凝药或抗血小板药（阿司匹林单药除外）者，改走头外伤规程。
    needs_chart: true
  - text: 已在跌倒预防专科门诊随访、有综合评估记录者不适用。
    needs_chart: true
  - text: 处于临终关怀阶段者不适用。
    needs_chart: true
  steps:
  - 问清跌倒经过、受伤部位，以及能否自行起身；有骨折或畸形体征先做影像。
  - 测卧位与站立 3 分钟血压。
  - 收缩压降 ≥ 20 mmHg 或舒张压降 ≥ 10 mmHg 记为体位性低血压。
  - 问头晕性质；有旋转性眩晕的做 Dix–Hallpike 手法。
  - 结构化用药审查：降压药、利尿剂、镇静催眠药、降糖药，评估能否减量或停用。
  - 检查视力、足部与鞋、认知情绪、尿失禁、饮酒，并评估骨质疏松风险。
  - 1 年内跌倒 ≥ 2 次、受伤需就医、无法自行起身、跌倒时意识丧失或衰弱者，转综合跌倒评估。
  exceptions:
  - 跌倒时有短暂意识丧失者，同时按晕厥规程评估心律与直立性血压，不只做跌倒评估。
  source:
    cite: 'NICE NG249 (2025), Falls: assessment and prevention in older people and in people 50 and over at higher
      risk, recommendations 1.1.3, 1.2.2, 1.3.2'
    url: https://www.nice.org.uk/guidance/ng249/chapter/Recommendations
    locator: 1.1.3；1.2.2；1.3.2
    verified: 1.1.3 列出需做综合评估的人群（衰弱、受伤就医、意识丧失、不能自行起身、1 年内 ≥ 2 次跌倒）；1.2.2 含卧立位血压、头晕/Dix–Hallpike、用药审查；1.3.2 结构化用药审查。
    verified_on: '2026-10-12'
  ours: true
  ours_reason: 体位性低血压的 20/10 mmHg 取传统定义，来源页没有数值，为我们取的。
  overlap: 无。
  protocol_id: HP-68D0205A
- key: LIB-HYPO-TX
  name: 清醒患者低血糖的现场处理
  topics: &id003
  - 低血糖
  - 糖尿病
  - 诊室处置
  keywords: *id003
  applies: 诊室内清醒、能吞咽的成人，指尖血糖 < 3.9 mmol/L。
  excludes:
  - text: 意识不清或不能吞咽者不适用，改走静脉葡萄糖或胰高血糖素。
    needs_chart: false
  steps:
  - 测指尖血糖确认 < 3.9 mmol/L，并记录症状与最近一次进食、用药时间。 给约 15–20 g 速效碳水（5 片葡萄糖片，或小半杯果汁），不给巧克力等含脂食物。
  - 10–15 分钟后复测；仍 < 4.0 mmol/L 则再给一份，最多重复 3 轮；3 轮后仍未恢复，或再次变得迟钝 → 按严重低血糖转急诊。
  - 血糖 ≥ 4.0 mmol/L 且症状缓解后，补充一份可持续升糖的食物（饼干、三明治）；记录诱因，并通知开具降糖药的医生复核方案。
  exceptions:
  - 正在使用阿卡波糖的患者必须用葡萄糖片或果汁，不可用蔗糖或糕点。
  source:
    cite: NHS, Low blood sugar (hypoglycaemia) (nhs.uk/conditions/low-blood-sugar-hypoglycaemia)
    url: https://www.nhs.uk/conditions/low-blood-sugar-hypoglycaemia/
    locator: 「How to treat a hypo」
    verified: 页面存在；速效糖（果汁、5 片葡萄糖片、4 颗软糖、2 管葡萄糖凝胶）、10–15 分钟复测、仍低于 4 mmol/L 再给一份、好转后补持久性碳水、昏迷者给胰高血糖素。
    verified_on: '2026-10-12'
  ours: true
  ours_reason: 触发线取 3.9（与本院监测的 1 级线一致），15–20 g、最多 3 轮、阿卡波糖例外为我们取的；NHS 页面写的是复测线 4 mmol/L，没给克数。
  overlap: 与家庭监测分诊的低血糖规则同主题；本条只管诊室现场处理，不含是否就医的分档。
  protocol_id: HP-40953374
- key: LIB-HTN-STEP2
  name: 钙通道阻滞剂单药后血压未达标的加药
  topics: &id004
  - 高血压
  - 降压药
  - 加药
  keywords: *id004
  applies: 成人高血压，目前仅用一种钙通道阻滞剂（CCB），诊室血压持续超过目标，且动态或家庭血压确认。
  excludes:
  - text: 已在使用 ACE 抑制剂或 ARB，或已用 2 种及以上降压药者不适用。
    needs_chart: true
  - text: 2 型糖尿病患者不适用，起始药应为 ACE 抑制剂或 ARB。
    needs_chart: true
  - text: 妊娠或备孕者不适用。
    needs_chart: true
  - text: 近 3 个月 eGFR < 30 或血钾 > 5.5 mmol/L 者不适用。
    needs_chart: true
  steps:
  - 先核对是否按医嘱服药，询问漏服与自行停药，未解决依从性前不加药。
  - 用动态或家庭血压确认：日间均值 ≥ 135/85 mmHg 才算未控制。
  - 80 岁以下诊室目标 < 140/90 mmHg，80 岁及以上 < 150/90 mmHg。
  - 在 CCB 基础上加 ACE 抑制剂、ARB 或噻嗪样利尿剂中的一种。
  - 加药前查肌酐、eGFR 与血钾；加药后 2–4 周复测血压与肾功能。
  - 三种药物仍不达标，转专科评估继发性高血压。
  exceptions:
  - 80 岁以上、有直立性低血压史者，加药前先测站立血压，收缩压低于 110 mmHg 暂不加药。
  source:
    cite: 'NICE NG136 (2019, updated 2022), Hypertension in adults: diagnosis and management, recommendations 1.2.8,
      1.4.20, 1.4.40–1.4.42'
    url: https://www.nice.org.uk/guidance/ng136/chapter/Recommendations
    locator: 1.2.8；Table 1–2（1.4.20）；1.4.40；1.4.41；1.4.42
    verified: 1.4.40 先讨论依从性；1.4.42 CCB 单药未控制时可加 ACE 抑制剂、ARB 或噻嗪样利尿剂；ABPM 日间或 HBPM 均值 135/85 mmHg 及以上为诊断线；80 岁以下
      < 140/90。
    verified_on: '2026-10-12'
  ours: true
  ours_reason: 加药后 2–4 周复测、血钾 5.5 与站立收缩压 110 为我们取的；NG136 给了药物选择与目标，没给这些数值。
  overlap: 与慢病用药复评的依那普利题同主题（降压药）；已排除正在用 ACE 抑制剂者，且不给任何剂量规则。
  protocol_id: HP-A3A82647
- key: LIB-STATIN-INTOL
  name: 确诊他汀不耐受后的降脂方案
  topics: &id005
  - 血脂
  - 他汀
  - 不耐受
  keywords: *id005
  applies: 病历已确诊他汀不耐受，LDL-C 仍未达标，需要选择非他汀降脂药。
  excludes:
  - text: 病历中没有他汀不耐受确诊记录者不适用（仅一次肌肉酸痛不算）。
    needs_chart: true
  - text: 肌肉症状已查明有其他原因（甲减、剧烈运动、药物相互作用）者不适用。
    needs_chart: true
  - text: 尚未试过降低剂量或换用另一种他汀者不适用。
    needs_chart: true
  steps:
  - 复核不耐受证据：肌肉症状的时间、CK 值、TSH、维生素 D 与相互作用药物；持续全身性肌肉症状且 CK > 5 倍正常上限，7 天后复查；仍 > 5 倍则不再用他汀。 CK 升高但不足 5 倍的，可从低剂量或隔日给药再试一次。
  - 确定不耐受 → 用依折麦布（二级预防可直接替代他汀）；二级预防 LDL-C > 2.0 mmol/L 仍未达标 → 加贝派地酸，或转专科评估 PCSK9 抑制剂。
  - 起始或调整后 3 个月复查血脂。
  exceptions:
  - 肝酶超过正常上限 3 倍的，先查肝病原因，再决定是否使用依折麦布。
  source:
    cite: 'NICE NG238 (2023, updated 2023-12), Cardiovascular disease: risk assessment and reduction, including
      lipid modification, recommendations 1.5.7, 1.7.1, 1.10.1–1.10.3'
    url: https://www.nice.org.uk/guidance/ng238/chapter/Recommendations
