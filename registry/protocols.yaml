- key: med-statin
  name: 他汀既往最大耐受剂量复评
  topics:
  - 慢病复诊
  - 用药
  keywords:
  - 他汀既往最大耐受剂量复评
  applies: 成人本次复评阿托伐他汀，需查既往肌痛、CK、撤药与再用经过。须查同药更高剂量的旧处方、当时症状与 CK 原报告、停药后的变化、继发原因排查及是否再激发。
  excludes:
  - 症状有明确其它原因或再用耐受者不据此限制剂量；一次肌痛主诉不足以确认不耐受。
