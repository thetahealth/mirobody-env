  - 甲状腺
  - 甲减
  - 随访
  keywords: *id007
  applies: 成人 TSH 高于参考范围、游离 T4 正常，且尚未使用左甲状腺素。
  excludes:
  - text: 已在使用左甲状腺素者不适用，走已治疗甲减的监测规程。
    needs_chart: true
  - text: 妊娠或备孕者不适用。
    needs_chart: true
  - text: 病历有甲状腺手术或放射性碘治疗史者不适用。
    needs_chart: true
  - text: 近 3 个月内有急性疾病住院者，先在恢复后复测，不适用本表。
    needs_chart: true
  steps:
  - 首次 TSH 升高后 3 个月复测 TSH 与游离 T4，排除一过性升高；可查一次甲状腺过氧化物酶抗体（TPOAb），不重复查。
  - 两次间隔 3 个月 TSH 均 ≥ 10 mIU/L → 考虑开始左甲状腺素。
  - 65 岁以下，TSH 高于参考值但 < 10 mIU/L 两次，且有甲减症状 → 可试用 6 个月，症状无改善则停。
  - 65 岁及以上、TSH < 10 mIU/L 者不常规治疗，只随访。
  - 不治疗者每年复查 TSH，出现症状时随时复查。
  exceptions:
  - TPOAb 阳性者复查间隔缩短为每 6 个月 1 次。
  source:
