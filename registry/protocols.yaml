  steps:
  - 确认是发作期：关节红肿热痛，起病在 24 小时内达高峰；一线三选一：NSAID、秋水仙碱或短程口服糖皮质激素，按合并症与合用药物选择。
  - 选 NSAID 的，同时加用质子泵抑制剂保护胃；NSAID、秋水仙碱、口服激素都不能用或无效 → 关节腔或肌肉注射糖皮质激素。
  - 患处冰敷，作为药物治疗的补充；已在用的降尿酸药不停；发作期间不新开始降尿酸药，缓解后再评估。
  exceptions:
  - 秋水仙碱用于 eGFR 30–59 者，剂量减半，并只用 1 个疗程。
  source:
    cite: 'NICE NG219 (2022), Gout: diagnosis and management, recommendations 1.3.1–1.3.3, 1.3.5'
    url: https://www.nice.org.uk/guidance/ng219/chapter/Recommendations
    locator: 1.3.1；1.3.2；1.3.3；1.3.5
    verified: 1.3.1 NSAID、秋水仙碱或短程口服激素为一线；1.3.2 用 NSAID 者考虑加 PPI；1.3.3 均禁忌/无效时关节腔或肌注激素；1.3.5 冰敷。
    verified_on: '2026-10-12'
  ours: true
  ours_reason: 「发作期不新开始降尿酸药」「秋水仙碱 eGFR 30–59 减半」为我们取的。
  overlap: 无。
  protocol_id: HP-B8FDD67C
- key: LIB-DRUG-RASH
  name: 新药后皮疹的分级处理
  topics: &id014
  - 皮疹
  - 药疹
  - 过敏
  keywords: *id014
  applies: 开始新药 1–6 周内出现皮疹的成人。
  excludes:
  - text: 病历中已记录对该药确认过敏者不适用，按既有过敏记录处理。
    needs_chart: true
  - text: 病历有慢性荨麻疹或湿疹，且本次皮疹形态与既往相同者不适用。
    needs_chart: true
  - text: 皮疹出现在 3 周内接种疫苗之后者不适用。
    needs_chart: true
  steps:
  - 记录皮疹形态、分布、起病距新药的天数，以及有无发热、黏膜受累、水疱。
  - 皮肤疼痛、水疱、脱皮、口眼黏膜受累、面唇肿胀或喘鸣 → 立即转急诊。
  - 局限性斑丘疹、无全身症状 → 暂停最近 6 周内新加的药，抗组胺药对症；同时有发热、淋巴结肿大或嗜酸性粒细胞升高 → 当日查肝肾功能并转专科。
  - 48–72 小时复评，皮疹进展则按上一步升级。
  - 把可疑药物、反应的症状与严重程度、发生日期写入药物过敏记录。
  exceptions:
  - 服用别嘌醇、卡马西平或磺胺类药物者，出现任何皮疹都按急症处理。
  source:
    cite: 'NICE CG183 (2014), Drug allergy: diagnosis and management, recommendations 1.1.1–1.1.3, 1.2.1–1.2.3;
      NHS, Stevens-Johnson syndrome'
    url: https://www.nice.org.uk/guidance/cg183/chapter/Recommendations ; https://www.nhs.uk/conditions/stevens-johnson-syndrome/
    locator: CG183 1.1.1；1.1.2；1.1.3；1.2.1–1.2.3；NHS「Immediate action required」
    verified: CG183 1.1.2–1.1.3 用药后发生且既往同药反应时更可能为药物过敏；1.2.1–1.2.3 记录过敏状态（药名、症状与严重程度、日期）。NHS 页面：新用药后皮疹扩散、皮肤疼痛/水疱/脱皮、喘鸣、口眼面肿
      → 999 或急诊。
    verified_on: '2026-10-12'
  ours: true
  ours_reason: 「6 周内新药」「48–72 小时复评」与高危药物例外为我们取的。
  overlap: 无。
  protocol_id: HP-C84ABBE0
- key: LIB-DIARRHOEA
  name: 成人急性腹泻的脱水评估
  topics: &id015
  - 腹泻
  - 脱水
  - 补液
  keywords: *id015
  applies: 成人急性腹泻，病程 ≤ 14 天，能口服进食饮水。
  excludes:
  - text: 病历有炎症性肠病、乳糜泻或已确诊肠易激综合征者不适用。
    needs_chart: true
  - text: 正在化疗或使用免疫抑制剂者不适用。
    needs_chart: true
  steps:
  - 评估脱水：口干、尿少色深、站立头晕，站立收缩压较卧位降 ≥ 20 mmHg；便血、体温 ≥ 38.5 ℃、剧烈腹痛或病程 > 7 天 → 当日就诊并送粪便检查。 轻度脱水：口服补液盐，每次稀便后补 200–250 mL，少量多次。
  - 无尿、意识改变或收缩压 < 90 mmHg → 转急诊静脉补液；正在使用利尿剂、ACE 抑制剂、ARB、二甲双胍或 SGLT2 抑制剂者，病期暂停这些药并 24 小时内联系医生。
  - 症状缓解后逐步恢复饮食；有发热或便血时不用止泻药。
  exceptions:
  - 近 2 周有境外旅行史者，病程 > 3 天即送粪便检查。
  source:
    cite: NHS, Diarrhoea and vomiting in adults (nhs.uk/conditions/diarrhoea)
    url: https://www.nhs.uk/conditions/diarrhoea/
    locator: 「How to treat diarrhoea and vomiting yourself」，「Speak to a pharmacist if」
    verified: 页面存在；首要是大量饮水防脱水；老年、免疫低下或有其他易脱水疾病者、尿少色深者应咨询药师或就医。页面没有 mmHg 或 mL 数值。
    verified_on: '2026-10-12'
  ours: true
  ours_reason: 所有数值（站立收缩压降 20、38.5 ℃、7 天、200–250 mL、90 mmHg、境外旅行 3 天）与停药清单为我们取的；NHS 页面只给定性建议。
  overlap: 与二甲双胍规程同引停药情形，方向一致。
  protocol_id: HP-21E9183D
- key: LIB-SLEEP-ANXIETY
  name: 失眠与焦虑的筛查及转介
  topics: &id016
  - 失眠
  - 焦虑
  - 转介
  keywords: *id016
  applies: 成人主诉持续睡眠困难 ≥ 3 个月，或自述长期过度担忧。
  excludes:
  - text: 近 2 周有自伤或自杀想法者不适用，当日转精神科急诊评估。
    needs_chart: false
  steps:
  - 用 GAD-2 筛查焦虑，总分 ≥ 3 分 → 继续做 GAD-7；GAD-7 ≥ 10 分 → 转心理治疗（认知行为治疗），不首选药物。
  - 失眠 ≥ 3 个月且影响日间功能 → 提供睡眠卫生建议，转失眠的认知行为治疗（CBT-I）；询问咖啡因、酒精、轮班、夜间疼痛与夜尿，并核对用药（β 受体阻滞剂、糖皮质激素、利尿剂）。
  - 避免长期使用苯二氮䓬类，单次处方不超过 2 周；4 周后复评 GAD-7 与睡眠日记；无改善再转精神科。
  exceptions:
  - 症状在近 3 个月内由亲人去世或重大事件诱发的，先随访 4 周，不立即转介。
  source:
    cite: 'NICE CG113 (2011, updated 2020), Generalised anxiety disorder and panic disorder in adults: management,
      recommendations 1.2.1–1.2.2 (stepped care, GAD-2); NHS, Insomnia'
    url: https://www.nice.org.uk/guidance/cg113/chapter/Recommendations ; https://www.nhs.uk/conditions/insomnia/
    locator: CG113 1.2.1；1.2.2；NHS「See a GP if」
    verified: CG113 1.2.1 阶梯式照护、从干预最轻者起；1.2.2 用 GAD-2 询问焦虑感受。NHS 失眠页：改睡眠习惯无效、持续数月或影响日常 → 就医；医生可提供 CBT。
    verified_on: '2026-10-12'
  ours: true
  ours_reason: GAD-2 ≥ 3、GAD-7 ≥ 10 的切点、苯二氮䓬 2 周与 4 周复评为我们取的；CG113 没写这些分数。
  overlap: 无。
  protocol_id: HP-F4D32E8E
