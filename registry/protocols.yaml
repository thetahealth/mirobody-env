- key: LIB-CHEST-PAIN
  name: 门诊疑似心源性急性胸痛的处置
  topics: &id009
  - 胸痛
  - 心电图
  - 急症
  keywords: *id009
  applies: 已到诊室的成人，当前胸痛，或 72 小时内有过疑似心源性的胸痛。
  excludes:
  - text: 胸痛明确由外伤或带状疱疹引起者不适用。
    needs_chart: false
  steps:
  - 立即做 12 导联静息心电图，目标 10 分钟内完成；问疼痛特点：持续 > 15 分钟、伴恶心出汗气短、向手臂背部下颌放射、血流动力学不稳。
  - 当前仍痛，或 12 小时内痛过且心电图异常或无法做 → 急救转送。
  - 12 小时内痛过但已缓解且心电图正常，或末次疼痛在 12–72 小时前 → 当日评估。
  - 疼痛在 72 小时前且无并发症 → 详细评估，并查心电图与肌钙蛋白。
  - 无明确过敏时给阿司匹林 300 mg 负荷量，转送时随病人附书面记录。
  exceptions:
  - 已在服用抗凝药或有消化道出血史者，阿司匹林由接诊医生决定，不自动给。
  source:
    cite: 'NICE CG95 (2010, updated 2016), Recent-onset chest pain of suspected cardiac origin: assessment and diagnosis,
      recommendations 1.2.1.3, 1.2.1.7–1.2.1.10, 1.2.3.2'
    url: https://www.nice.org.uk/guidance/cg95/chapter/Recommendations
    locator: 1.2.1.3；1.2.1.7；1.2.1.8；1.2.1.10；1.2.3.2
    verified: 1.2.1.7 当前胸痛或 12 小时内痛过且心电图异常/无法做 → 急诊转送；1.2.1.8 12 小时内痛过但已缓解且心电图正常，或 12–72 小时前 → 当日评估；1.2.1.10 超过
      72 小时 → 详细评估、心电图与肌钙蛋白；1.2.3.2 300 mg 阿司匹林负荷量。
    verified_on: '2026-10-12'
  ours: true
  ours_reason: 心电图 10 分钟目标与抗凝药例外为我们取的。
  overlap: 与家庭监测分诊的红旗规则（胸痛 → 急诊）方向一致；本条限定「已到诊室」且给的是诊室内动作，不含是否就医的分档。
