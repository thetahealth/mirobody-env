- key: LIB-ANTICOAG-FU
  name: 长期口服抗凝治疗的随访
  topics: &id008
  - 抗凝
  - 华法林
  - DOAC
  - 随访
  keywords: *id008
  applies: 房颤等适应证下长期口服华法林或直接口服抗凝药（DOAC）的门诊随访。
  excludes:
  - text: 病历有机械瓣膜或中重度二尖瓣狭窄者不适用 DOAC 部分。
    needs_chart: true
  - text: 近 7 天有活动性出血者不适用，走出血处理。
    needs_chart: false
  - text: 妊娠者不适用。
    needs_chart: true
  steps:
  - 华法林：查 INR，多数适应证目标 2.0–3.0，对照病历里的目标范围。
  - 近 6 个月 INR 有 2 次 > 5 或 1 次 > 8，或 2 次 < 1.5 → 重新评估抗凝方案。
  - 近 6 个月 INR 达标时间比例（TTR）< 65% → 同样重新评估抗凝方案。
  - DOAC：每年至少查肾功能、血红蛋白与肝功能。
  - eGFR < 60 者每 6 个月查 1 次肾功能。
  - 核对合并用药与饮酒：抗血小板药、NSAID、SSRI、过量饮酒都增加出血风险。
  - 询问出血、黑便、跌倒与漏服；高血压控制不佳者同步处理。
  - 至少每年评估一次抗凝的必要性与质量，并写入病历。
  exceptions:
  - 近期更换过抗菌药或抗真菌药的华法林患者，在换药后 3–5 天加查一次 INR。
